<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Pone el manifest de la app que corresponde a la ruta ANTES de que el navegador lo pida: si se cambiara después, Chrome
      // ofrecería instalar la carta aunque se esté en el panel. Mismo mapa que src/pwa/manifestPorRuta.ts.
      (function () {
        var p = location.pathname, q = new URLSearchParams(location.search).get('instalar');
        var adm = p === '/admin' || p.indexOf('/admin/') === 0;
        // ?instalar= solo vale dentro de su área: en la carta pública nunca se enlaza un manifest del panel
        var a = (adm ? (q === 'admin' || q === 'asistencia') : q === 'carta') ? q
          : p === '/admin/mi-asistencia' || p.indexOf('/admin/mi-asistencia/') === 0 ? 'asistencia'
          : p === '/admin' || p.indexOf('/admin/') === 0 ? 'admin' : 'carta';
        var l = document.createElement('link');
        l.rel = 'manifest';
        l.href = a === 'carta' ? '/manifest.webmanifest' : '/manifest-' + a + '.webmanifest';
        document.head.appendChild(l);
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caprichos Cafetería Artesanal: carta, pedidos y delivery en San Juan de Lurigancho</title>
    <meta
      name="description"
      content="Carta de Caprichos, cafetería artesanal en San Juan de Lurigancho: haz tu pedido en línea para recoger o con delivery."
    />
    <link rel="canonical" href="https://caprichos.pe/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:site_name" content="Caprichos" />
    <meta property="og:title" content="Caprichos Cafetería Artesanal: carta, pedidos y delivery" />
    <meta
      property="og:description"
      content="Carta de Caprichos, cafetería artesanal en San Juan de Lurigancho: haz tu pedido en línea para recoger o con delivery."
    />
    <meta property="og:url" content="https://caprichos.pe/" />
    <meta property="og:image" content="https://caprichos.pe/logo.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap"
    />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
