<div class="page-heading row text-right p-t-none"> <div class="wrapper page-heading-inner p-t-sm p-b-sm"> </div> </div> <ng-form name="form"> <div rest-loader-model="cargando" ng-class="{'is-loading': cargando}"></div> <div class="wrapper wrapper-content animated fadeIn restloader-remote-el" ng-class="{'is-loading': cargando}"> <div class="row"> <div class="col-sm-12"> <div class="ibox"> <div class="ibox-title"> <h5>Documento de venta: {{vm.deudaObj.documento}}: {{vm.deudaObj.numero}}</h5> </div> <div class="ibox-content"> <div class="row"> <div class="col-md-4 col-md-push-8 float-e-margins text-right m-b"> <button ladda="btnCargandoGuardar" ng-disabled="form.$invalid" class="btn btn-success" ng-click="vm.fnAgregar()"><i class="fa fa-save"></i> Registrar pago</button> <a class="btn btn-default" ui-sref="creditos.ventacreditos"> <i class="fa fa-reply"></i> Regresar a la lista </a> </div> <div class="col-md-8 col-md-pull-4"> <div class="row"> <div class="col-sm-6"> <div class="row"> <p class="col-md-6"> <strong>Cliente:</strong> {{vm.deudaObj.cliente}} </p> </div> <p><strong>Monto de deuda:</strong> {{vm.total}}</p> <p><strong>Observación:</strong></p> <textarea class="form-control" name="" id="" cols="30" rows="5" ng-model="vm.deudaObj.detalleventasporcobrar_observacion"></textarea> </div> <div class="col-sm-6"> <div class="form-group"> <div class="row"> <div class="col-sm-6"> <label>Moneda</label> <div class="input-group"> <div class="input-group"> <ui-select ng-model="vm.monedaSeleccionada" ng-change="vm.fnObtenerMoneda($item)" theme="bootstrap" search-enabled="false"> <ui-select-match placeholder="Moneda"> <strong>{{$select.selected.moneda_descripcion}}</strong> </ui-select-match> <ui-select-choices repeat="item in vm.monedaList | filter: $select.search"> <div ng-bind-html="item.moneda_descripcion | highlight: $select.search"></div> </ui-select-choices> </ui-select>  </div> </div> </div> <div class="col-sm-6" ng-class="{'has-error': !vm.pagocon && form.$dirty}"> <label for="pagocon" class="control-label">Monto</label> <div class="input-group"> <input class="form-control" type="text" required name="pagocon" id="pagocon" solo-numeros placeholder="Ingrese el monto" ng-model="vm.pagocon" ng-change="vm.actualizarPago()" required> <div ng-if="form.pagocon.$dirty" ng-messages="form.pagocon.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> <span class="input-group-addon"> <span class="fa fa-money"></span> </span> </div> </div> </div> <h1>{{vm.vuelto}}</h1> </div> </div> </div> </div> </div> </div> </div> </div> </div> </div> </ng-form>
