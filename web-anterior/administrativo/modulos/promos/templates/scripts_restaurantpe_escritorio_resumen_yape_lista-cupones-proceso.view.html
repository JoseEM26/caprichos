<div class="page-heading row text-right p-t-none fadeInDown"> </div> <div rest-loader-model="vm.loading" ng-class="{'is-loading': vm.loading}"></div> <div class="wrapper wrapper-content animated fadeIn"> <div class="row"> <div class="col-sm-12"> <div class="ibox" style="overflow:auto;height:calc(95vh - 96px);margin:0"> <div class="ibox-title"> <h5>Lista de cupones en proceso</h5> </div> <div class="ibox-content"> <div class="row"> <div class="col-sm-10"> <div class="input-group m-b" ng-class="{'has-warning': vm.valBusqueda}"> <div class="input-group-addon"> <i class="fa fa-search"></i> </div> <input type="text" autocomplete="off" class="form-control" placeholder="Buscar..." ng-model="vm.valBusqueda" ng-model-options="{ debounce: 500 }" ng-change="vm.pagina = 1; vm._cargarCuponesEnProceso();"> </div> </div> <div class="col-sm-2" uib-tooltip="Volver a cargar los datos"> <button ng-click="vm._cargarCuponesEnProceso()" class="btn btn-default btn-icon btn-block"><i class="fa fa-refresh"></i></button> </div> </div> <div class="restloader-remote-el" ng-class="{'is-loading': vm.cargando}"> <table class="table table-striped table-hover table-middle" ng-if="vm.promotions && vm.promotions.length"> <thead> <tr> <th>Codigo cupon</th> <th class="text-center">Promoción</th> <th class="text-center">Cantidad</th> <th class="text-center">Fecha en proceso</th> <th class="text-center">Opciones</th> </tr> </thead> <tbody> <tr ng-repeat="promo in vm.promotions"> <td><div class="flex flex-col"> <span class="font-medium">{{promo.cupon_cuponcodeado}}</span> </div></td> <td class="text-center">{{promo.title}}</td> <td class="text-center">{{promo.cupon_cantidad | convertirEntero}} UND</td> <td class="text-center">{{promo.cupon_fechaactualizacion}}</td> <td class="text-center"> <a ng-if="promo.cupon_estado == '2'" ng-click="vm._reactivarCupon(promo)"><i class="fa fa-check"></i> Reactivar</a> </td> </tr> <tr ng-if="!vm.promotions || !vm.promotions.length"> <td colspan="8"> <em> <i class="fa fa-info-circle"></i> <em>No hay descuentos registrados.</em> </em> </td> </tr> </tbody> </table> </div> <nav class="b-t-gray-l1 text-right"> <uib-pagination class="m-sm m-b-xs" ng-model="vm.pagina" total-items="vm.totalCupones" items-per-page="vm.cantidadPorPagina" previous-text="Anterior" next-text="Siguiente" first-text="Primera" last-text="Último" max-size="8" ng-change="vm._cargarCuponesEnProceso()"> </uib-pagination> </nav> </div> </div> </div> </div> </div>
