<ol class="breadcrumb m-t-xs m-b-none p-xxs flex-shrink-none"> <li><button class="btn btn-warning"><i class="fa fa-star"></i></button></li> <li><strong>FAVORITOS</strong></li> </ol> <div class="product-list flex-grow-1 p-t-xs"> <div class="btn-group" ng-repeat="item in vm.productosgeneralesfavoritos"> <button class="btn btn-sm btn-multi-flex btn-default" data-toggle="dropdown" ng-click="vm.seleccionarProductoGeneral(item);vm.reiniciarTimerDesdeView();"> <span class="color-mark" ng-if="item.color" ng-style="{'border-top-color': item.color}"></span> <span class="button-value"> <span> <i class="fa" ng-class="{'fa-angle-right':item.productoList.length>1,'fa-plus-circle':item.productoList.length<=1}"></i> {{item.productogeneral_descripcion}} </span> </span> <span class="button-tag"> <strong ng-if="item.productoList.length<=1">{{Utility.getSimboloMoneda()}} {{item.productogeneral_minprecio|roundPriceFinanzasFilter}}</strong> <span ng-if="item.productoList.length>1">desde {{Utility.getSimboloMoneda()}} {{item.productogeneral_minprecio|roundPriceFinanzasFilter}}</span> </span> </button> <ul class="dropdown-menu dropdown-menu-mediun dropdown-icons-right" ng-if="item.productoList.length>1"> <li ng-repeat="producto in item.productoList"> <a ng-click="vm.fnSeleccionarProducto(producto);vm.reiniciarTimerDesdeView();"> <i class="fa fa-plus-circle"></i> {{producto.producto_presentacion}} - {{producto.producto_precio|roundPriceFinanzasFilter}} </a> </li> </ul> </div> </div>
