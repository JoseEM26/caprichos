<div class="ibox no-margins"> <div class="ibox-title text-danger"><h5>Lista de categorias de cupon de descuento</h5></div> <div class="ibox-content"> <ng-form name="form"> <div class="row"> <div class="col-sm-6"> <div class="form-group" ng-class="{'has-error': !vm.categoriacupodescuento.categoriacupodescuento_descripcion && form.$dirty}"> <label class="control-label">Descripción</label> <input type="text" class="form-control" name="categoriacupodescuento_descripcion" ng-model="vm.categoriacupodescuento.categoriacupodescuento_descripcion" required> <div ng-if="form.categoriacupodescuento_descripcion.$dirty" ng-messages="form.categoriacupodescuento_descripcion.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> </div> </div> <div class="col-sm-6"> <div class="form-group"> <label class="control-label">Tipo</label> <div class="input-group"> <ui-select ng-model="vm.tipoCuponSeleccionado" theme="bootstrap" search-enabled="false"> <ui-select-match placeholder="Selecciona un tipo">{{$select.selected.descripcion}} </ui-select-match> <ui-select-choices repeat="item in vm.TipoCupon | filter: $select.search"> <div ng-bind-html="item.descripcion | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> </div> </div> <div class="col-sm-6"> <div class="form-group" ng-class="{'has-error': !vm.categoriacupodescuento.categoriacupodescuento_montopordefecto && form.$dirty}"> <label for="categoriacupodescuento_montopordefecto" class="control-label">Monto defecto</label> <input class="form-control" required id="categoriacupodescuento_montopordefecto" name="categoriacupodescuento_montopordefecto" ng-model="vm.categoriacupodescuento.categoriacupodescuento_montopordefecto"> <div ng-if="form.categoriacupodescuento_montopordefecto.$dirty" ng-messages="form.categoriacupodescuento_montopordefecto.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> </div> </div> <div class="col-md-6"> <div class="form-group" ng-class="{'has-error': form.categoriacupodescuento_fechaexpiracionpordefecto.$invalid && form.$dirty}"> <label for="categoriacupodescuento_fechaexpiracionpordefecto" class="control-label">Fecha de expiración defecto</label> <input type="text" name="categoriacupodescuento_fechaexpiracionpordefecto" id="categoriacupodescuento_fechaexpiracionpordefecto" class="form-control" placeholder="Fecha de expiración" ng-model="vm.categoriacupodescuento.categoriacupodescuento_fechaexpiracionpordefecto" bs-datepicker> </div> </div> <div class="col-sm-6"> <div class="form-group" ng-class="{'has-error': !vm.categoriacupodescuento.categoriacupodescuento_estado && form.$dirty}"> <label class="control-label">Estado</label> <div class="checkbox is-icheck"> <label> <input type="checkbox" id="categoriacupodescuento_estado" icheck ng-model="vm.categoriacupodescuento.categoriacupodescuento_estado" ng-true-value="'1'" ng-false-value="'0'"> Categoria activa </label> </div> <div ng-if="form.categoriacupodescuento_estado.$dirty" ng-messages="form.categoriacupodescuento_estado.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> </div> </div> </div> <div class="float-e-margins"> <button class="btn btn-primary" ng-show="!vm.categoriacupodescuento.categoriacupodescuento_id" ladda="vm.btnGuardando" ng-disabled="form.$invalid" ng-click="vm.fnAgregarCategoria()"> <i class="fa fa-save"></i> Guardar </button> <button class="btn btn-primary" ng-show="vm.categoriacupodescuento.categoriacupodescuento_id" ladda="vm.btnGuardando" ng-disabled="form.$invalid" ng-click="vm.fnActualizarCategoria()"> <i class="fa fa-save"></i> Actualizar </button> </div> </ng-form> <br> <div rest-loader-model="vm.cargandoDetalle" ng-class="{'is-loading': vm.cargandoDetalle}"></div> <div class="restloader-remote-el" ng-class="{'is-loading': vm.cargandoDetalle}"> <div class="table-responsive"> <table class="table table-hover table-condensed"> <thead> <tr> <th>Descripción</th> <th class="text-center">Tipo</th> <th class="text-center">Estado</th> <th></th> </tr> </thead> <tbody> <tr ng-repeat="d in vm.listaCategoriasCupodescuentos" ng-show="($index)>=((vm.nPagina-1)*vm.itemsPorPagina) && ($index+1)<=((vm.nPagina)*vm.itemsPorPagina)"> <td>{{d.categoriacupodescuento_descripcion}}</td> <td class="text-center"> <span class="label label-info" ng-show="d.categoriacupodescuento_tipo=='1'"> Valido para un solo consumo </span> <span class="label label-warning" ng-show="d.categoriacupodescuento_tipo=='2'"> Valido para varios consumos </span> </td> <td class="text-center"> <span class="label label-primary" ng-show="d.categoriacupodescuento_estado=='1'"> Activo </span> <span class="label label-danger" ng-show="d.categoriacupodescuento_estado!='1'"> Anulado </span> </td> <td> <button class="btn btn-success btn-xs" ng-click="vm.categoriacupodescuento=d;vm.seleccionarTipo(d);"> <i class="fa fa-edit"></i> Editar </button> </td> </tr> <tr ng-if="vm.listaCategoriasCupodescuentos.length==0"> <td colspan="3"> <em> <span>No existen categorias</span> </em> </td> </tr> </tbody> </table> <nav class="b-t-gray-l1 text-right"> <uib-pagination class="m-sm m-b-xs" ng-model="vm.nPagina" total-items="vm.listaCategoriasCupodescuentos.length" items-per-page="vm.itemsPorPagina" previous-text="Anterior" next-text="Siguiente" first-text="Primera" last-text="Último" max-size="8"> </uib-pagination> </nav> </div> </div> <div class="float-e-margins text-right"> <button class="btn btn-default" ng-click="vm.fnCancel()">Cerrar</button> </div> </div> </div>
