<div class="sales-popup white-bg b-l-gray-l1 full-height"> <div class="fastsale-sidebar display-flex display-flex-v full-height"> <div class="subtotal flex-shrink-none"> <h3 class="m-t">Config. de Cliente</h3> </div> <div class="p-sm flex-grow-1 overflow-y-auto"> <div class="order-customer" ng-controller="BuscarClienteCtrl"> <div class="form-group"> <label>Buscar cliente</label> <div class="input-group customer-finder"> <ui-select class="" ng-model="vm.cliente" theme="bootstrap" on-select="vm.fnSeleccionarCliente($item);vm.reiniciarTimerDesdeView();" tagging="vm.customerTransform" ng-required="vm.venta.venta_tipodoc=='Factura'"> <ui-select-match placeholder="Público general"> <strong>{{$select.selected.getTipoAndDocumento()}}</strong> - {{$select.selected.getNombres()}} </ui-select-match> <ui-select-choices refresh="vm.buscarClientes($select.search)" refresh-delay="0" repeat="item in vm.clientes | propsFilter: {cliente_dniruc: $select.search, cliente_nombres: $select.search,cliente_apellidos: $select.search,_cliente_nombres:$select.search,nombreapellido:$select.search}"> <div ng-if="item.cliente_id == 0" ng-bind-html="item.cliente_nombres +' <small>Añadir nuevo cliente</small>'| highlight: $select.search"></div> <div ng-if="item.cliente_id != 0" ng-bind-html="item.getNombres() | highlight: $select.search"></div> </ui-select-choices> </ui-select> <span class="input-group-btn"> <button ng-click="vm.cliente = undefined" type="button" class="btn btn-default"> <span class="fa fa-close"></span> </button> </span> </div> </div> <div class="form-group clearfix"> <div ng-class="{'pull-right':vm.fnObtenerAnchoPantalla()<1400}"> <button class="btn btn-success btn-multimozo-width-lg" ng-class="{'btn-lg':vm.fnObtenerAnchoPantalla()>=1400}" ng-disabled="vm.cliente == undefined" ng-click="vm.fnEditarCliente();vm.fnCancelarTimerCierreAutomatico();"> <i class="fa fa-edit"></i> Editar </button> <button class="btn btn-default btn-multimozo-width-lg" ng-class="{'btn-lg pull-right':vm.fnObtenerAnchoPantalla()>=1400}" ng-click="vm.fnNuevoCliente(null);vm.fnCancelarTimerCierreAutomatico();"><i class="fa fa-user"></i> Nuevo cliente</button> </div> </div> </div> <div class="row" ng-if="vm.cliente && vm.cliente.cliente_id && vm.cliente.cliente_id!=1"> <div class="col-xs-6"> <div class="form-group"> <label class="control-label">Límite de crédito</label> <p class="form-control-static">{{Utility.getSimboloMoneda()}} {{vm.cliente.getCliente_limitecredito()|roundPriceFinanzasFilter}}</p> </div> </div> <div class="col-xs-6"> <div class="form-group"> <label class="control-label">Deuda</label> <p class="form-control-static">{{Utility.getSimboloMoneda()}} {{900|roundPriceFinanzasFilter}}</p> </div> </div> </div> <div ng-hide="vm.fnObtenerAnchoPantalla()>=1400"> <button class="btn btn-primary" ng-click="vm.fnGuardarCliente();vm.fnReiniciarTimerCierreAutomatico();" ladda="vm.loadingGuardarCliente"> <i class="fa fa-save"></i> Guardar </button> <button class="btn btn-default" ng-click="togglePopupCliente(false);vm.fnReiniciarTimerCierreAutomatico();"> Cancelar </button> </div> <div class="float-e-margins float-e-margins-bootom" ng-if="vm.fnObtenerAnchoPantalla()>=1400"> <button class="btn btn-default btn-lg btn-multimozo-width-lg" ng-click="togglePopupCliente(false);vm.fnReiniciarTimerCierreAutomatico();"> Cancelar </button> <button class="btn btn-primary pull-right btn-lg btn-multimozo-width-lg" ng-click="vm.fnGuardarCliente();vm.fnReiniciarTimerCierreAutomatico();" ladda="vm.loadingGuardarCliente"> <i class="fa fa-save"></i> Guardar </button> </div> </div> </div> </div>
