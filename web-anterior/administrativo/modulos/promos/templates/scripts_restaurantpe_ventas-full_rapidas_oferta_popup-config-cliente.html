<div class="sales-popup white-bg b-l-gray-l1 full-height"> <div class="fastsale-sidebar display-flex display-flex-v full-height"> <div class="subtotal flex-shrink-none"> <h3 class="m-t">Config. de Cliente</h3> </div> <div class="p-sm flex-grow-1 overflow-y-auto"> <div class="order-customer" ng-controller="BuscarClienteCtrl"> <div class="form-group"> <label>Buscar cliente</label> <div class="input-group"> <ui-select ng-model="customer.selected" theme="bootstrap" tagging="customerTransform" on-select="onCustomerSelect($item)"> <ui-select-match placeholder="Público general"> <strong>{{$select.selected.idType}} {{$select.selected.idDoc}}</strong> - {{$select.selected.name}} </ui-select-match> <ui-select-choices repeat="item in customers | propsFilter: {idDoc: $select.search, name: $select.search}"> <div ng-if="item.id == 0" ng-bind-html="item.name +' <small>Añadir nuevo cliente</small>'| highlight: $select.search"></div> <div ng-if="item.id != 0" ng-bind-html="item.name | highlight: $select.search"></div> </ui-select-choices> </ui-select> <span class="input-group-btn"> <button ng-click="customer.selected = undefined" class="btn btn-default"> <span class="fa fa-close"></span> </button> </span> </div> </div> <div class="form-group clearfix"> <div class="pull-right"> <button class="btn btn-success" ng-disabled="customer.selected == undefined" ng-click="editCustomer()"> <i class="fa fa-edit"></i> Editar </button> <button class="btn btn-default" ng-click="newCustomer()"><i class="fa fa-user"></i> Nuevo cliente</button> </div> </div> </div> <div class="row"> <div class="col-xs-6"> <div class="form-group"> <label class="control-label">Límite de crédito</label> <p class="form-control-static">{{Utility.getSimboloMoneda()}} {{1000 | roundPriceFinanzasFilter}}</p> </div> </div> <div class="col-xs-6"> <div class="form-group"> <label class="control-label">Deuda</label> <p class="form-control-static">{{Utility.getSimboloMoneda()}} {{900 | roundPriceFinanzasFilter}}</p> </div> </div> </div> <button class="btn btn-primary" ng-click="togglePopupCliente(false)"> <i class="fa fa-save"></i> Guardar </button> <button class="btn btn-default" ng-click="togglePopupCliente(false)"> Cancelar </button> </div> </div> </div>
