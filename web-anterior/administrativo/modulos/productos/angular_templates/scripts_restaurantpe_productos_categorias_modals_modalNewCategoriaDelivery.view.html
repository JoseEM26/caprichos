<div rest-loader-model="cargando" ng-class="{'is-loading': cargando}"></div> <div class="ibox no-margins" ng-class="{'is-loading': cargando}"> <button type="button" class="modal-close close" ng-click="vm.fnCancelar()" style="margin-right:10px;margin-top:5px">&times; </button> <div class="ibox-title"> <h4 class="text-left">{{vm.idCategoria * 1 > 0 ? 'Modificar Categoria':'Registrar Categoria'}}</h4> </div> <div class="ibox-content" style="border-top:0 solid #fff"> <div class="row"> <div class="col-sm-12"> <form name="form" novalidate> <div class="form-group m-b-xs" ng-class="{'has-error': !vm.categoria.categoria_descripcion && form.$dirty}"> <label for="cat-name"> <small>Nombre</small> </label> <input id="cat-name" class="form-control input-sm" type="text" name="categoria_descripcion" ng-model="vm.categoria.categoria_descripcion" required> <div ng-if="form.categoria_descripcion.$dirty" ng-messages="form.categoria_descripcion.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> </div> <div class="form-group m-b-xs" ng-class="{'has-error': !vm.categoria.categoria_color && form.$dirty}"> <label for="cat-name"> <small>Color</small> </label> <input autocomplete="off" id="categoria_color" colorpicker class="form-control input-sm" type="text" name="categoria_color" ng-model="vm.categoria.categoria_color" required> <div ng-if="form.categoria_color.$dirty" ng-messages="form.categoria_color.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> <div class="row"> <div class="col-sm-12"> <div class="div-color-categoria" style="background:{};"></div> </div> </div> </div> <div class="form-group m-b-xs"> <label for="cat-name"> <small>Activa</small> </label> <input autocomplete="off" class="form-control input-sm" ng-true-value="'1'" ng-false-value="'0'" icheck type="checkbox" ng-model="vm.categoria.categoria_estado"> </div> <div class="float-e-margins pull-right"> <button class="btn btn-default" ladda="cargando" ng-disabled="vm.rating==0" ng-disabled="form.$invalid" ng-click="vm.fnCancelar()"> Cerrar </button> <button class="btn btn-primary" ladda="vm.btnCargando" ng-disabled="vm.rating==0 || form.$invalid" ng-click="vm.fnGuardar()"> {{vm.idCategoria * 1 > 0 ? 'Modificar':'Registrar'}} </button> </div> </form> </div> </div> </div> </div>
