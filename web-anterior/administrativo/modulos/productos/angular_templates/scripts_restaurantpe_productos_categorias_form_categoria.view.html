<div class="page-heading"> <div class="row wrapper"> <div class="col-md-5"> <div class="page-title"> <h2 class="title-text">Administrar categorías</h2> </div> <ol class="breadcrumb"> <li><a href="#">Inicio</a></li> <li><a href="#">Productos</a></li> <li class="active"><strong>Categorías</strong></li> </ol> </div> <div class="col-md-7"> <div class="title-action"> <a href="" class="btn btn-link"><i class="fa fa-plus"></i> Nuevo producto</a> <a href="" class="btn btn-link"><i class="fa fa-edit"></i> Editar categoría</a> <a href="" class="btn btn-link"><i class="fa fa-gear"></i> Opciones de pantalla</a> <a href="" class="btn btn-link"><i class="fa fa-life-saver"></i> Ayuda</a> </div> </div> </div> </div> <div class="wrapper wrapper-content"> <div class="row"> <div class="col-sm-6"> <div class="ibox"> <div class="ibox-title"> <h5>Todas las categorías</h5> </div> <div class="ibox-content"> <div class="b-gray-l1 b-dashed p-sm m-b"> <button class="btn btn-primary pull-right"><i class="fa fa-save"></i> Guardar cambios</button> <p><small><i class="fa fa-info-circle"></i> Ordena o elimina categorías. Luego haz clic en Guardar cambios.</small></p> </div> <script type="text/ng-template" id="categorias-editar-nodo.html"> <div class="ibox collapsed">
                            <div class="ibox-title has-color" ui-tree-handle>
                                <a class="pull-left m-r-sm"
                                   ng-if="node.categorias && node.categorias.length > 0"
                                   data-nodrag ng-click="toggle(this)">
                                    <i class="fa fa-lg"
                                       ng-class="{'fa-plus-square-o': collapsed, 'fa-minus-square-o': !collapsed}"></i>
                                </a>
                                <a class="pull-left m-r-sm"
                                   ng-if="!(node.categorias && node.categorias.length > 0)"
                                   data-nodrag ng-click="toggle(this)">
                                    <i class="fa fa-lg fa-square-o"></i>
                                </a>

                                <span class="color-indicator" style="color: {{node.color ? node.color : 'transparent';}}">
                                    <i class="fa fa-caret-right"></i>
                                </span>

                                <h5 ng-if="node.activo">{{node.nombre}}</h5>
                                <h5 class="text-muted" ng-if="!node.activo">{{node.nombre}} <small class="text-muted">- inactiva</small></h5>

                                <div class="ibox-tools pull-right" data-nodrag attach-ibox-tools>
                                    <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                                </div>
                            </div>

                            <div class="ibox-content" ng-include="'scripts/restaurantpe/productos/categorias/categoria.form.view.html'"></div>
                        </div>
                        <ol ui-tree-nodes ng-model="node.categorias" ng-show="!collapsed">
                            <li ui-tree-node ng-repeat="node in node.categorias"
                                ng-include="'categorias-editar-nodo.html'"></li>
                        </ol> </script> <div ui-tree> <ol ui-tree-nodes ng-model="categorias" id="tree-root"> <li ui-tree-node ng-repeat="node in categorias" ng-include="'categorias-editar-nodo.html'"></li> </ol> </div> <div class="b-gray-l1 b-dashed p-sm m-t text-right"> <button class="btn btn-primary"><i class="fa fa-save"></i> Guardar cambios</button> </div> </div> </div> </div> <div class="col-sm-6"> <div class="ibox"> <div class="ibox-title"> <h5>Agregar categoría</h5> </div> <div class="ibox-content"> <div class="form-group"> <label for="cat-name">Nombre</label> <input id="cat-name" class="form-control" type="text" ng-model="nombreCategoria"> </div> <div class="form-group"> <label for="cat-name">Categoría superior</label> <ui-select ng-model="categoria.selected" theme="bootstrap" append-to-body="true"> <ui-select-match placeholder="Selecciona una categoría">{{$select.selected.nombre}}</ui-select-match> <ui-select-choices repeat="item in categorias | filter: $select.search"> <div ng-bind-html="item.nombre | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> <button class="btn btn-primary" ng-click="guardarCategoria()"><i class="fa fa-save"></i> Agregar</button> </div> </div> </div> </div> </div>
