<div class="ibox no-margins"> <div class="ibox-title"> <h5>Propiedades de {{vm.grupoCaracteristica.grupocaracteristica_descripcion}}}</h5> </div> <div class="ibox-content"> <div class="row"> <div class="col-sm-12" ng-repeat="propiedad in vm.listaCaracteristicas"> <div class="form-group"> <label uib-tooltip="{{propiedad.caracteristica_nombre}}"><i class="icon-help fa fa-question-circle"></i> {{propiedad.caracteristica_nombre}}</label> <input ng-if="propiedad.caracteristica_tipo == CARACTERISTICA.CARACTERISTICA_TIPO_TEXTO" class="form-control" ng-model="propiedad.caracteristica_valor" placeholder="Ingrese valor de {{propiedad.caracteristica_nombre}}"> <ui-select ng-model="propiedad.caracteristica_valor" theme="bootstrap" ng-if="propiedad.caracteristica_tipo == CARACTERISTICA.CARACTERISTICA_TIPO_SELECT"> <ui-select-match placeholder="Selecciona una propiedad">{{$select.selected.caracteristicadefault_nombre}} </ui-select-match> <ui-select-choices repeat="item in propiedad.listaCaracteristicasDefault | filter: $select.search"> <div ng-bind-html="item.caracteristicadefault_nombre | highlight: $select.search"></div> </ui-select-choices> </ui-select> <input ng-if="propiedad.caracteristica_tipo == CARACTERISTICA.CARACTERISTICA_TIPO_SELECT && propiedad.caracteristica_valor.caracteristica_id == PARAM.TODOS" class="form-control" ng-model="propiedad.caracteristica_valor.valorPersonalizado" placeholder="Ingrese valor de {{propiedad.caracteristica_nombre}}"> <ui-select ng-model="propiedad.caracteristica_valor" theme="bootstrap" ng-if="propiedad.caracteristica_tipo == CARACTERISTICA.CARACTERISTICA_TIPO_COLOR"> <ui-select-match placeholder="Selecciona un color">{{$select.selected.color_descripcion}} </ui-select-match> <ui-select-choices repeat="item in vm.listColors | filter: $select.search"> <div ng-bind-html="item.color_descripcion | highlight: $select.search"></div> </ui-select-choices> </ui-select> <div class="row" ng-if="propiedad.caracteristica_tipo == CARACTERISTICA.CARACTERISTICA_TIPO_COLOR"> <div class="col-sm-12"> <div class="div-color-categoria" style="background:{};"></div> </div> </div> <div class="input" ng-if="propiedad.caracteristica_tipo == CARACTERISTICA.CARACTERISTICA_TIPO_MULTIPLE"> <ui-select multiple class="select-required" tagging="vm.fnAgregarCampoImpresion" tagging-label="(Agregar)" tagging-tokens=",|/" ng-model="propiedad.caracteristica_valor" theme="bootstrap" title="Escribe los campos"> <ui-select-match placeholder="Escribe los campos a agregar">{{$item.caracteristicadefault_nombre}} </ui-select-match> <ui-select-choices repeat="item in propiedad.listaCaracteristicasDefault | propsFilter: {caracteristicadefault_nombre: $select.search}"> <div ng-bind-html="item.caracteristicadefault_nombre + ' ' + $select.taggingLabel | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> <div class="col-sm-12" ng-if="propiedad.caracteristica_tipo == CARACTERISTICA.CARACTERISTICA_TIPO_UNICO"> <table class="table table-body-no-border table-middle table-hover table-condensed"> <tbody> <tr ng-repeat="item in propiedad.listaCaracteristicasDefault track by $index"> <td> <input type="radio" icheck ng-model="propiedad.caracteristica_valor" ng-value="item.caracteristicadefault_nombre"> </td> <td class="expanded-column">{{item.caracteristicadefault_nombre}}</td> </tr> </tbody> </table> </div> </div> </div> </div> <div class="text-right"> <button class="btn btn-default" type="button" ng-click="vm.fnCancel()">Cancelar</button> <button class="btn btn-primary ladda-button" ladda="vm.btnCargandoGuardar" data-style="expand-left" ng-click="vm.fnGuardar()"> <i class="fa fa-save"></i> Guardar </button> </div> </div> </div>
