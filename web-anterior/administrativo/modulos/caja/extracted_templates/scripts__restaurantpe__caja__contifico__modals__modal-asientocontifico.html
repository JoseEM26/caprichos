<div class="modal-header"> <h4 class="modal-title"><i class="fa fa-plus-circle"></i> Asiendo Segun Libro</h4> </div> <ng-form name="formProveedor"> <div class="modal-body"> <div class="row"> <div ng-class="{\'col-sm-12\': vm.objRegistro.tipolibroSeleccionado.contifico_librotipo == \'3\', \'col-sm-7\': vm.objRegistro.tipolibroSeleccionado.contifico_librotipo != \'3\'}"> <div class="form-group"> <label class="control-label">Razón social</label> <ui-select ng-model="vm.objRegistro.tipolibroSeleccionado" ng-change="vm.fnGenerarInforme()" theme="bootstrap" name="tipolibroSeleccionado" search-enabled="false"> <ui-select-match placeholder="Selecciona un libro"> Libro: <strong>{{$select.selected.tipofiltro_nombre}}</strong> </ui-select-match> <ui-select-choices repeat="item in vm.librotipoList | filter: $select.search"> <div ng-bind-html="item.tipofiltro_nombre | highlight: $select.search"></div> </ui-select-choices> </ui-select> <div ng-if="formProveedor.tipolibroSeleccionado.$dirty" ng-messages="formProveedor.tipolibroSeleccionado.$error"> <div class="help-block" ng-message="required">Campo requerido</div> <div class="help-block" ng-message="minlength">Nombre muy corto (minimo 3 letras)</div> <div class="help-block" ng-message="uniqueNombrecaja">Se econtraron coincidencias</div> </div> </div> </div> <div class="col-sm-5" ng-hide="vm.objRegistro.tipolibroSeleccionado.contifico_librotipo == \'3\'"> <div class="form-group"> <label class="control-label">Fecha de Libro de ventas</label> <button type="button" class="btn btn-default btn-block" date-range-picker ng-model="pickerFecha.fechas.startDate" options="pickerFecha.opciones"> <i class="fa fa-calendar"></i> {{pickerFecha.fechas.startDate | amDateFormat: \'DD MMMM, YYYY\'}} </button> </div> </div> <div class="col-sm-12" ng-hide="vm.objRegistro.tipolibroSeleccionado.contifico_librotipo != \'3\'"> <div class="form-group"> <label class="control-label">Rango de Fecha de Inventario</label> <button class="btn btn-default btn-block" date-range-picker ng-model="rangoDeFechas.fechas" options="rangoDeFechas.opciones"> <i class="fa fa-calendar"></i> Desde el <strong>{{rangoDeFechas.fechas.startDate | amDateFormat: \'DD MMMM, YYYY HH:mm A\'}}</strong> hasta el <strong>{{rangoDeFechas.fechas.endDate | amDateFormat: \'DD MMMM,YYYY HH:mm A\'}}</strong> </button> </div> </div> </div> </div> <div class="modal-footer"> <button class="btn btn-default" type="button" ng-click="vm.cerrarModal()">Cancelar</button> <button ladda="btnCargandoModalGuardar" ng-disabled="formProveedor.$invalid" class="btn btn-primary" id="btnRegistrar" ng-click="vm.fnAgregar()"> <i class="fa fa-save"></i> Guardar </button> </div> </ng-form>
