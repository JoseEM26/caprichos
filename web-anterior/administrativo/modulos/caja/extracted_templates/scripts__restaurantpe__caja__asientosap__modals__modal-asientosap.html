<div class="modal-header"> <h4 class="modal-title"><i class="fa fa-plus-circle"></i> Asiendo Segun Libro</h4> </div> <ng-form name="formProveedor"> <div class="modal-body p-t-sm"> <div class="row"> <div class="col-sm-4"> <div class="form-group m-b-sm"> <label class="control-label">Local asginado para asiento</label> <ui-select ng-model="vm.localSeleccionado" ng-disabled="vm.objPreview" theme="bootstrap" name="localSeleccionado"> <ui-select-match placeholder="Selecciona un local"> Local: <strong>{{$select.selected.local_descripcion}}</strong> </ui-select-match> <ui-select-choices repeat="item in vm.sucursalList | filter: $select.search"> <div ng-bind-html="item.local_descripcion | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> </div> <div class="col-sm-4"> <div class="form-group m-b-sm"> <label class="control-label">Asiento Contable</label> <ui-select ng-model="vm.objRegistro.tipoasientoSeleccionado" theme="bootstrap" name="tipoasientoSeleccionado" ng-disabled="vm.objPreview" search-enabled="false"> <ui-select-match placeholder="Selecciona un libro"> <strong>{{$select.selected.tipofiltro_nombre}}</strong> </ui-select-match> <ui-select-choices repeat="item in vm.asientotipoList | filter: $select.search"> <div ng-bind-html="item.tipofiltro_nombre | highlight: $select.search"></div> </ui-select-choices> </ui-select> <div ng-if="formProveedor.tipoasientoSeleccionado.$dirty" ng-messages="formProveedor.tipoasientoSeleccionado.$error"> <div class="help-block" ng-message="required">Campo requerido</div> <div class="help-block" ng-message="minlength">Nombre muy corto (minimo 3 letras)</div> <div class="help-block" ng-message="uniqueNombrecaja">Se econtraron coincidencias</div> </div> </div> </div> <div class="col-sm-2"> <div class="form-group m-b-sm"> <label class="control-label">Mes</label> <ui-select ng-model="vm.mesAsiento" ng-disabled="vm.objPreview" theme="bootstrap" search-enabled="false"> <ui-select-match placeholder="Selecciona un mes"> Mes: <strong>{{$select.selected.descripcion}}</strong> </ui-select-match> <ui-select-choices repeat="item in vm.meses | filter: $select.search"> <div ng-bind-html="item.descripcion | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> </div> <div class="col-sm-2"> <div class="form-group m-b-sm"> <label class="control-label">Año</label> <input class="form-control" ng-model="vm.anioAsiento" ui-mask="9999" required solo-numeros-sin-decimal maxlength="4" ng-disabled="vm.objPreview"> </div> </div> </div> <div class="row" ng-if="vm.objPreview"> <div class="col-sm-12" ng-repeat="asiento in vm.objPreview"> <hr style="margin:5px!important"> <h5 class="margin-5p"><strong>Previsualziacion</strong></h5> <div ng-bind-html="asiento.detalleHtml"></div> </div> </div> </div> <div class="modal-footer"> <button class="btn btn-default" type="button" ng-click="vm.cerrarModal()">Cancelar</button> <button ladda="btnCargandoModalGuardar" ng-disabled="formProveedor.$invalid" class="btn btn-warning" id="btnLimpiar" ng-click="vm.objPreview = false" ng-if="vm.objPreview"> <i class="fa fa-trash-o"></i> Limpiar </button> <button ladda="btnCargandoModalGuardar" ng-disabled="formProveedor.$invalid" class="btn btn-primary" id="btnPrevisualizar" ng-click="vm.fnPrevisualizar()" ng-if="!vm.objPreview"> <i class="fa fa-eye"></i> Previsualizar </button> <button ladda="btnCargandoModalGuardar" ng-disabled="formProveedor.$invalid" class="btn btn-primary" id="btnRegistrar" ng-click="vm.fnAgregar()" ng-if="vm.objPreview"> <i class="fa fa-save"></i> Guardar </button> </div> </ng-form>
