<table class="table table-condensed table-hover table-body-no-border"> <thead> <tr> <th class="is-number" title="Cantidad">Cant.</th> <th title="Producto y presentación">Descripción</th> <th class="is-number is-amount has-input" title="Precio final" class="is-number">Importe</th> <th></th> </tr> </thead> <tbody> <tr ng-repeat="pedido in vm.pedidos" ng-class="{\'active\': pedido.activo}"> <td class="is-number">{{Utility.roundCantFinanzas(pedido.pedido_cantidad)}}</td> <td>{{pedido.pedido_productodescripcion}}</td> <td class="is-number has-input"> <strong uib-tooltip="Monto que falta dividir">{{Utility.getSimboloMoneda()}} {{pedido.pedido_importe | roundPriceFinanzasFilter}}</strong> </td> <td class="text-right" ng-if="vm.tipoDivisionCuentaSeleccionada==1"> <button class="btn btn-default" title="Mover pedidos" uib-tooltip="Debe añadir una subcuenta" tooltip-enable="vm.subcuentas.length == 0" popover-enable="vm.fnDebeMostrarPopover()" uib-popover-template="\'myPopoverTemplate.html\'" popover-append-to-body="true" popover-trigger="focus"> <i class="fa fa-arrows"></i> Mover </button> <script type="text/ng-template" id="myPopoverTemplate.html"> <button ng-click="vm.fnMoverPedido($index,pedido,$parent.$index)" type="button" class="btn btn-primary m-r-xs m-b-xs" ng-repeat="subcuenta in vm.subcuentas">+{{subcuenta.nombre}}</button> <\/script> </td> </tr> <tr ng-hide="vm.pedidos.length != 0"> <td class="p-sm text-muted" colspan="7"> <i class="fa fa-info-circle"></i> <em>No hay pedidos registrados.</em> </td> </tr> <tr ng-show="vm.pedidos.length != 0"> <td colspan="2" class="text-right"><strong>IMPORTE TOTAL</strong></td> <td class="is-number has-input"><strong>{{Utility.getSimboloMoneda()}} {{vm.getTotalCuentaPrincipal() | roundPriceFinanzasFilter}}</strong></td> <td></td> </tr> </tbody> </table>
