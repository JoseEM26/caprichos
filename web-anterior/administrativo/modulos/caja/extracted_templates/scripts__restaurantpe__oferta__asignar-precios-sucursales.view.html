<div class="col-md-12 p-t-sm m-t-1 m-t-xxs" equalizer="list-pres"> <div class="row"> <div class="col-sm-12"> <div class="ibox"> <div class="ibox-title"> <div class="ibox-title-buttons pull-right flex gap-10 col-sm-6"> <div class="col-sm-5" ng-if="vm.showBtnFilterListado"> <ui-select ng-model="vm.categoriacupodescuento" theme="bootstrap" search-enabled="false"> <ui-select-match placeholder="Categoría"> <span> Categoria: <strong>{{$select.selected.categoriacupodescuento_descripcion}}</strong> </span> </ui-select-match> <ui-select-choices repeat="item in vm.listaCategoriascupodescuentoList"> <div ng-bind-html="item.categoriacupodescuento_descripcion"></div> </ui-select-choices> </ui-select> </div> <button class="btn btn-primary" ladda="vm.btnGenerarInformeOfertas" ng-click="vm.changeListadoNormal()" ng-if="vm.showBtnDetails"> <i class="fa fa-eye"></i> Ver detalles de ofertas </button> <button class="btn btn-success" ladda="vm.btnGenerarInformeOfertas" ng-if="vm.esControladorPropio==true" ng-click="vm.fnGuardarCambios()"> <i class="fa fa-save"></i> Guardar cambios </button> </div> <h5>Asignar precios de oferta a sucursales</h5> </div> <div class="ibox-content"> <div class="row"> <div class="overflow-x-auto"> <table class="table table-striped table-striped2 table-hover table-middle"> <thead> <tr> <th style="position:sticky;left:0;background-color:#fff">Producto</th> <th class="text-center">¿Marcar fila?</th> <th class="text-center" ng-repeat="header in vm.localesPermitidos">Sucursal <span class="whitespace-nowrap">{{header.local_descripcion}}</span></th> </tr> </thead> <tbody> <tr ng-repeat="oferta in vm.ofertaDetalleLista | filter:vm.filtroBusqueda track by $index" ng-value="{{$index}}"> <td style="position:sticky;left:0;z-index:10;background-color:#fff"> <div class="flex flex-col gap-5"> <span class="text-gris">{{oferta.producto.producto_descripcion + \' - \' + oferta.producto.producto_presentacion}}</span> <div class="flex gap-10"> <div class="btn-success text-white p-x-10 p-y-2 text-10 whitespace-nowrap"> {{producto.tipooferta}} </div> <div class="bg-primary text-white p-x-10 p-y-2 text-10 whitespace-nowrap" ng-class="{\'label-warning\': !producto.vigente}"> </div> </div> </div> </td> <td class="text-center"><div class=""> <input class="form-control input-sm" icheck type="checkbox" ng-true-value="\'1\'" ng-false-value="\'0\'" ng-model="oferta.marcarfila" ng-change="vm.fnChangeSelectOferta(oferta)"> <label> <small>Sí</small> </label> </div></td> <td class="text-center" ng-repeat="localoferta in oferta.locales "> <div class="flex w-100 justify-center items-center gap-5"> <input class="form-control input-sm" icheck type="checkbox" ng-true-value="\'1\'" ng-false-value="\'0\'" ng-model="localoferta.oferta.oferta_estado" ng-change="vm.fnChangeSelectOfertaLocal(localoferta.oferta, oferta, localoferta.local_id, $index)"> <input ng-if="$state.params.idTipooferta==\'1\'" type="text" ng-model="localoferta.oferta.oferta_preciocantidad" class="w-75" name="" id="" solo-numeros> <input ng-if="$state.params.idTipooferta==\'2\'" disabled type="text" ng-value="localoferta.oferta.oferta_compra+\'-\'+localoferta.oferta.oferta_lleva" class="w-75" name="" id=""> <input ng-if="$state.params.idTipooferta==\'3\'" type="text" ng-model="localoferta.oferta.oferta_precio" class="w-75" name="" id="" solo-numeros> </div> </td> </tr> </tbody> </table> </div> <nav ng-if="vm.ofertaDetalleLista.length && vm.esControladorPropio==true" class="b-t-gray-l1 text-right"> <uib-pagination class="m-sm m-b-xs" ng-model="vm.paginaActual" total-items="vm.totalRegistros" items-per-page="vm.cantidadPorPagina" previous-text="Anterior" next-text="Siguiente" first-text="Primera" last-text="Último" max-size="8" ng-change="vm.fnGenerarInforme()" boundary-links="true"> </uib-pagination> </nav> </div> </div> </div> </div> </div> </div>
