<div class="ibox no-margins"> <div class="ibox-content"> <div class="col"> <div class="flex gap-1" style="display:flex;gap:10px"> <button class="btn btn-default pull-right" style="margin-bottom:16px" date-range-picker ng-model="rangoDeFechas.fechas" options="rangoDeFechas.opciones"> <i class="fa fa-calendar"></i> Del <strong>{{rangoDeFechas.fechas.startDate | amDateFormat: 'DD MMMM, YYYY'}}</strong> hasta <strong>{{rangoDeFechas.fechas.endDate | amDateFormat: 'DD MMMM, YYYY'}}</strong> </button> <ui-select ng-model="vm.estadoSeleccionado" theme="bootstrap" search-enabled="false"> <ui-select-match placeholder="Selecciona un estado"> Estado: <strong>{{$select.selected.value}}</strong> </ui-select-match> <ui-select-choices repeat="item in vm.estadoList | filter: $select.search"> <div ng-bind-html="item.value | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> <div class="row p-t-md"> <div class="col-sm-12"> <div class="panel panel-default panel-shadow"> <div class="panel-body" equalizer="'col'"> <div class="form-group"> <label class="control-label font-16px">Descargar Excel <i class="fa fa-upload"></i></label> <button type="button" class="btn btn-rounded btn-block btn-info m-t-md" ladda="vm.btnSubiendoExcel" ng-click="vm.fnDescargarExcel()"> <i class="fa fa-fw fa-file-excel-o"></i> Descargar Excel </button> </div> </div> </div> </div> </div> </div> <div class="float-e-margins text-right p-t-md"> <button class="btn btn-default" ng-click="vm.cerrarModal()">Cancelar</button> </div> </div> </div>
