<div class="page-heading row text-right p-t-none fadeInDown"> <div class="wrapper page-heading-inner p-t-sm p-b-sm"> <ui-select class="ui-select-inline-block" ng-change="vm.fnCargarDatosPorLocal(vm.localSeleccionado);vm.fnObtenerReporteMenus()" ng-model="vm.localSeleccionado" theme="bootstrap"> <ui-select-match placeholder="Selecciona un local"> Local: <strong>{{$select.selected.local_descripcion}}</strong> </ui-select-match> <ui-select-choices repeat="item in vm.sucursalList | filter: $select.search"> <div ng-bind-html="item.local_descripcion | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> </div> <div class="wrapper wrapper-content animated fadeIn"> <div class="ibox"> <div class="ibox-title"> <div class="ibox-title-buttons pull-right"> <button class="btn btn-warning" ui-sref="informes.ventas"> <i class="fa fa-arrow-left"></i> Atras </button> <button ladda="vm.btnGenerarInformeTodasVentasMenu" class="btn btn-success" ng-click="vm.fnObtenerReporteMenus()"> <i class="fa fa-refresh"></i> Generar informe </button> <div class="btn-group" uib-dropdown> <button type="button" class="btn btn-default" uib-dropdown-toggle> <i class="fa fa-download"></i> Descargar <span class="caret"></span> </button> <ul class="dropdown-menu dropdown-menu-right" uib-dropdown-menu> <li class="dropdown-header">Formato</li> <li><a ng-click="vm.fnDescargarExcel()" target="_blank"><i class="fa fa-fw fa-file-excel-o"></i> Excel</a></li> </ul> </div> </div> <h5>Menús por día</h5> </div> <div class="ibox-content"> <div class="row m-b-md"> <div class="col-sm-12"> <button class="btn btn-default pull-right" date-range-picker ng-model="rangoDeFechas.fechas" options="rangoDeFechas.opciones"> <i class="fa fa-calendar"></i> Del <strong>{{rangoDeFechas.fechas.startDate | amDateFormat: 'DD MMMM, YYYY'}}</strong> hasta <strong>{{rangoDeFechas.fechas.endDate | amDateFormat: 'DD MMMM, YYYY'}}</strong> </button> </div> </div> <div rest-loader-model="vm.cargando" ng-class="{'is-loading': vm.cargando}"></div> <div class="table-responsive restloader-remote-el" ng-class="{'is-loading': vm.cargando}"> <table class="table"> <thead> <tr> <th rowspan="2" class="text-center in-middle">Menú</th> <th class="text-center" colspan="{{vm.rangoDiasList.length}}">Fecha</th> <td rowspan="2" class="text-center in-middle"> <b>Total</b> </td> </tr> <tr> <td ng-repeat="rango in vm.rangoDiasList" class="text-center in-middle"> <b>{{rango | amDateFormat: 'DD/MM/YYYY'}}</b> </td> </tr> </thead> <tbody> <tr ng-hide="vm.ventasMenuList.length != 0"> <td colspan="10"> <em> <span>No hay resultados</span> </em> </td> </tr> <tr ng-repeat="ventasMenu in vm.ventasMenuList"> <td> <p class="no-margins"> <i class="fa fa-check"></i> {{ventasMenu.categoriamenu_nombre}} </p> </td> <td class="text-center in-middle" ng-repeat="resumenPorFecha in ventasMenu.resumenPorFecha track by $index"> {{resumenPorFecha}} </td> </tr> </tbody> </table> </div> </div> </div> </div>
