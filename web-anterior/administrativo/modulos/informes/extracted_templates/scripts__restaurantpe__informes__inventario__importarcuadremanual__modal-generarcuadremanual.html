<div class="ibox no-margins"> <div class="ibox-title"> <h5>Datos especificos para generar el cuadre manual de stock</h5> </div> <div class="ibox-content"> <div class="row"> <div class="col-sm-4"> <label for="cuadremanual_fecha" class="control-label">Fecha del cuadre manual</label> <div class="input-group"> <input type="text" class="form-control" id="cuadremanual_fecha" placeholder="Fecha de ordencompra" ng-model="vm.cuadremanual_fecha" bs-datepicker required> <span class="input-group-btn"> <button type="button" class="btn btn-default" ng-click="abrirDatepicker(true)"> <i class="fa fa-calendar"></i> </button> </span> </div> </div> <div class="col-sm-3"> <label for="cuadramanual_hora" class="control-label">Hora</label> <div class="input-group clockpicker"> <input class="form-control" type="text" name="cuadramanual_hora" id="cuadramanual_hora" placeholder="Especifique la hora de la compra" ng-model="vm.cuadramanual_hora" lng-clockpicker readonly lng-clockpicker-options="clockpicker"> <span class="input-group-addon"> <span class="fa fa-clock-o"></span> </span> </div> </div> <div class="col-sm-5"> <label class="control-label" uib-tooltip="Formato que se usará importar el excel. Asegurate sea el correcto para evitar variaciones en las cantidades ingresadas."> Formato númerico <i class="icon-help"></i></label> <ui-select ng-model="vm.formatoSeparadorDecimalSeleccionado" theme="bootstrap" search-enabled="false"> <ui-select-match placeholder="Selecciona un formato"> Formato: <strong>{{$select.selected.descripcion}}</strong> </ui-select-match> <ui-select-choices repeat="item in vm.formatoSeparadorDecimal | filter: $select.search"> <div ng-bind-html="item.descripcion | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> </div> <div class="float-e-margins text-right p-t-md"> <button class="btn btn-default" ng-click="vm.cerrarModal()">Cancelar</button> <button class="btn btn-primary" ng-click="vm.preGuardarCuadreManual()">Generar Cuadre Manual</button> </div> </div> </div>
