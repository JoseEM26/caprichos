<form name="frmAlmacen"> <div class="modal-header"> <h4 class="modal-title"><i class="fa fa-print"></i> Seleccionar una impresora</h4> </div> <ng-form name="form"> <div class="modal-body"> <div class="row"> <div class="col-sm-6"> <div class="form-group"> <label class="control-label">Canal de venta</label> <ui-select ng-model="vm.modalidadSeleccionada" theme="bootstrap" search-enabled="false"> <ui-select-match placeholder="Orden"> Canal de venta: <strong>{{$select.selected.value}}</strong> </ui-select-match> <ui-select-choices repeat="item in vm.modalidadList | filter: $select.search"> <div ng-bind-html="item.value | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> </div> <div class="col-sm-6" ng-if="vm.modalidadSeleccionada.id == PLPMODALIDAD.PLP_MODALIDAD_VENTA_DELIVERY"> <div class="form-group"> <label class="control-label">Canal de delivery</label> <ui-select ng-model="vm.canaldeliverySeleccionado" theme="bootstrap" search-enabled="false"> <ui-select-match placeholder="Canal de delivery"> Canal de delivery: <strong>{{$select.selected.canaldelivery_descripcion}}</strong> </ui-select-match> <ui-select-choices repeat="item in vm.canaldeliveryList | filter: $select.search"> <div ng-bind-html="item.canaldelivery_descripcion | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> </div> </div> <div class="row"> <div class="col-sm-6"> <div class="form-group"> <label class="control-label">Impresora</label> <ui-select ng-model="vm.impresoraSeleccionada" theme="bootstrap" search-enabled="false"> <ui-select-match placeholder="Impresora"> Impresora: <strong>{{$select.selected.impresora_nombre}}</strong> </ui-select-match> <ui-select-choices repeat="item in vm.impresoraList | filter: $select.search"> <div ng-bind-html="item.impresora_nombre | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> </div> <div class="col-sm-6"> <div class="form-group"> <label class="control-label">Ordenar por</label> <ui-select ng-model="vm.ordenSeleccionado" theme="bootstrap" search-enabled="false"> <ui-select-match placeholder="Orden"> Por: <strong>{{$select.selected.order}}</strong> </ui-select-match> <ui-select-choices repeat="item in vm.ordenSeleccion | filter: $select.search"> <div ng-bind-html="item.order | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> </div> </div> </div> <div class="modal-footer"> <button class="btn btn-default" type="button" ng-click="vm.cerrarModal()">Cancelar</button> <button ng-disabled="form.$invalid" class="btn btn-warning" ng-click="vm.pdfResumenProductos()"><i class="fa fa-file-pdf-o"></i> PDF productos </button> <button ng-disabled="form.$invalid" class="btn btn-primary" ng-click="vm.imprimirResumenProductos()"><i class="fa fa-print"></i> Imprimir productos </button> </div> </ng-form> </form>
