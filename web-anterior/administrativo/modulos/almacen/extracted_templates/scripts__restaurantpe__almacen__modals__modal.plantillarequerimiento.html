<div class="ibox no-margins"> <div class="ibox-title"> <h5>Lista de plantillas registradas</h5> </div> <div class="ibox-content"> <div class="table-responsive"> <table class="table table-hover table-condensed"> <thead> <tr> <th>N°</th> <th>Local</th> <th>Encargado</th> <th>Obs.</th> <th class="text-right">Opciones</th> </tr> </thead> <tbody> <tr ng-repeat="plantilla in vm.plantillas"> <td> {{plantilla.plantillarequerimiento_id}} </td> <td> {{plantilla.localproduccion.local_descripcion}} </td> <td> {{plantilla.plantillarequerimiento_encargado}} </td> <td> {{plantilla.plantillarequerimiento_observacion}} </td> <td class="text-right"> <button class="btn btn-primary btn-xs" ng-click="vm.cerrarModal();$state.go('almacen.requerimientomovimiento.nuevo', {plantillaRequerimientoId: plantilla.plantillarequerimiento_id})"> <i class="fa fa-check"></i> Seleccionar </button> <a class="btn btn-danger btn-xs" ng-click="vm.anularPlantilla(plantilla.plantillarequerimiento_id);"> <i class="fa fa-ban"></i> Eliminar </a> </td> </tr> <tr ng-hide="vm.plantillas.length"> <td colspan="5"> <em> <span>No hay resultados</span> </em> </td> </tr> </tbody> </table> </div> <div class="float-e-margins text-right"> <button class="btn btn-default" ng-click="vm.cerrarModal()">Cerrar</button> </div> </div> </div>
