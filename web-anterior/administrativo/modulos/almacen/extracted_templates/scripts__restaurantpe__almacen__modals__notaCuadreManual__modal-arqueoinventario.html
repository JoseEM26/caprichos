<div class="ibox no-margins"> <div class="ibox-title"> <h5>Nota de arqueo de inventario</h5> </div> <div class="ibox-content"> <p class="m-b"><em>Ingresar una nota de arqueo.</em></p> <ng-form name="form"> <div class="form-group" ng-class="{'has-error': !vm.nota && form.$dirty}"> <label for="" class="control-label">Nota</label> <input class="form-control" name="nota" colocar-focus required ng-model="vm.nota"> <div ng-if="form.nota.$dirty" ng-messages="form.nota.$error"> <div class="help-block" ng-message="required">Campo requerido </div> </div> </div> </ng-form> <div class="text-right"> <button class="btn btn-default" type="button" ng-click="vm.fnCancel()">Cancelar</button> <button class="btn btn-primary ladda-button" ladda="vm.btnCargandoGuardar" data-style="expand-left" ng-click="vm.fnGuardar()" ng-disabled="form.$invalid" type="none"> <i class="fa fa-save"></i> Guardar </button> </div> </div> </div>
