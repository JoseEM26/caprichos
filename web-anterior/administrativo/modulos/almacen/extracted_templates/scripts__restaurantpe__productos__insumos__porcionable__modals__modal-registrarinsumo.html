<div class="ibox no-margins"> <div class="ibox-title"> <h5>Registrar insumo: {{vm.insumoAgregar.insumo_nombre}}</h5> </div> <div class="ibox-content"> <p class="m-b"><em>Registro rapido de un insumo.</em></p> <ng-form name="form"> <div class="form-group" ng-class="{'has-error': !vm.insumoAgregar.unidadmedidainsumo && form.$dirty}"> <label class="control-label">Unidad de medida</label> <ui-select ng-model="vm.insumoAgregar.unidadmedidainsumo" theme="bootstrap" name="unidadmedidainsumo" required> <ui-select-match placeholder="Selecciona"> {{$select.selected.unidadmedidainsumo_descripcion}} </ui-select-match> <ui-select-choices repeat="um in vm.listaUnidadesMedida | filter: $select.search"> <div ng-bind-html="um.unidadmedidainsumo_descripcion | highlight: $select.search"></div> </ui-select-choices> </ui-select> <div ng-if="form.unidadmedidainsumo.$dirty" ng-messages="form.unidadmedidainsumo.$error"> <div class="help-block" ng-message="required">Campo requerido </div> </div> </div> <div class="form-group" ng-class="{'has-error': !vm.insumoAgregar.categoriainsumo && form.$dirty}"> <label class="control-label">Categoría</label> <ui-select ng-model="vm.insumoAgregar.categoriainsumo" theme="bootstrap" name="categoriainsumo" required> <ui-select-match placeholder="Selecciona una categoria"> {{$select.selected.categoriainsumo_descripcion}} </ui-select-match> <ui-select-choices repeat="categoria in vm.listaCategoriasActivas | filter: $select.search"> <div ng-bind-html="categoria.categoriainsumo_descripcion | highlight: $select.search"></div> </ui-select-choices> </ui-select> <div ng-if="form.categoriainsumo.$dirty" ng-messages="form.categoriainsumo.$error"> <div class="help-block" ng-message="required">Campo requerido </div> </div> </div> </ng-form> <div class="text-right"> <button class="btn btn-default" type="button" ng-click="vm.fnCancel()">Cancelar</button> <button class="btn btn-primary ladda-button" ladda="vm.btnCargandoGuardar" data-style="expand-left" ng-click="vm.fnGuardar()" ng-disabled="form.$invalid" type="none"> <i class="fa fa-save"></i> Guardar </button> </div> </div> </div>
