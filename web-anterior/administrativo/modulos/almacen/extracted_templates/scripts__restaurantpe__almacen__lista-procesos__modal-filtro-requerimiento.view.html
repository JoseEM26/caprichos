<div class="p-x-24 p-t-24 p-b-80"> <div class="flex justify-between items-center border-b border-gray-5 p-b-16"> <div class="flex gap-8 items-center"> <span class="head-m text-primary">Filtros de búsqueda</span> </div> <i class="fa fa-times text-primary text-26 cursor-pointer" ng-click="vm.cerrarModal()"></i> </div> <div class="p-t-16 flex flex-col gap-16"> <div class="flex gap-16 w-full"> <div class="flex flex-col gap-8 w-50"> <span class="text-16">Fecha de registro:</span> <div class="flex items-center gap-8"> <button class="btn btn-default pull-right" date-range-picker ng-model="vm.objFiltro.rangoDeFechas.fechas" options="rangoDeFechas.opciones"> <i class="fa fa-calendar"></i> Del <strong>{{vm.objFiltro.rangoDeFechas.fechas.startDate | amDateFormat: 'DD MMMM, YYYY'}}</strong> hasta <strong>{{vm.objFiltro.rangoDeFechas.fechas.endDate | amDateFormat: 'DD MMMM, YYYY'}}</strong> </button> </div> </div> <div class="flex flex-col gap-8 w-50"> <span class="text-16">Solicitado a:</span> <ui-select ng-model="vm.localSeleccionado" theme="bootstrap" append-to-body="true" ng-change="vm.seleccionarLocal(vm.localSeleccionado)"> <ui-select-match placeholder="Selecciona un local">{{$select.selected.local_descripcion}}</ui-select-match> <ui-select-choices repeat="item in vm.sucursalList  | filter: $select.search"> <div ng-bind-html="item.local_descripcion | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> </div> <div class="flex gap-16 w-full"> <div class="flex flex-col gap-8"> <span class="text-16">Estado del requerimiento:</span> <div class="flex gap-10"> <div ng-class="{' border-primary bg-primary-5 text-primary': vm.objFiltro.estado == '1'}" ng-click="vm.objFiltro.estado = '1'; vm.objFiltro.estadoSeleccionadoDecrip = 'Pendiente';" class="rounded-lg border border-gray-5 cursor-pointer flex items-center gap-6 p-16 text-16"> <i class="fa fa-search"></i> <span>Pendiente</span> </div> <div ng-class="{' border-primary bg-primary-5 text-primary': vm.objFiltro.estado == '3'}" ng-click="vm.objFiltro.estado = '3'; vm.objFiltro.estadoSeleccionadoDecrip = 'Cancelado';" class="rounded-lg border cursor-pointer border-gray-5 flex items-center gap-6 p-16 text-16 text-gris2"> <i class="fa fa-times"></i> <span>Cancelado</span> </div> <div ng-class="{' border-primary bg-primary-5 text-primary': vm.objFiltro.estado == '2'}" ng-click="vm.objFiltro.estado = '2'; vm.objFiltro.estadoSeleccionadoDecrip = 'Aprobado';" class="rounded-lg border cursor-pointer border-gray-5 flex items-center gap-6 p-16 text-16 text-gris2"> <i class="fa fa-file"></i> <span>Aprobado</span> </div> <div ng-class="{' border-primary bg-primary-5 text-primary': vm.objFiltro.estado == '4'}" ng-click="vm.objFiltro.estado = '4'; vm.objFiltro.estadoSeleccionadoDecrip = 'Despachado';" class="rounded-lg border cursor-pointer border-gray-5 flex items-center gap-6 p-16 text-16 text-gris2"> <i class="fa fa-truck"></i> <span>Despachado</span> </div> <div ng-class="{' border-primary bg-primary-5 text-primary': vm.objFiltro.estado == '5'}" ng-click="vm.objFiltro.estado = '5'; vm.objFiltro.estadoSeleccionadoDecrip = 'Recepcionado';" class="rounded-lg border cursor-pointer border-gray-5 flex items-center gap-6 p-16 text-16 text-gris2"> <i class="fa fa-box"></i> <span>Recepcionado</span> </div> <div ng-class="{' border-primary bg-primary-5 text-primary': vm.objFiltro.estado == '-1'}" ng-click="vm.objFiltro.estado = '-1'; vm.objFiltro.estadoSeleccionadoDecrip = 'Todos';" class="rounded-lg border cursor-pointer border-gray-5 flex items-center gap-6 p-16 text-16 text-gris2"> <i class="fa fa-box"></i> <span>Todos</span> </div> </div> </div> </div> </div> <div class="botones_modal_fin absolute" style="bottom:16px;right:16px"> <button class="gap-5 btn btn-danger" ng-click="vm.cerrarModal()"> <span class="text-12">Cancelar</span> </button> <button class="btn btn-primary gap-5" ng-click="vm.fnAplicarFiltros()"> <span class="text-12">Aplicar filtros</span> </button> </div> </div>
