<div class="ibox no-margins"> <div class="ibox-title"> <h5>Arqueo de inventario</h5> </div> <div class="ibox-content"> <div class="row m-l-md m-r-md"> <h3 class="m-t-md m-b-md"><strong> Detalle de item's para arqueo de inventario </strong></h3> <div class="table-responsive" style="position:relative;height:500px;overflow:auto;display:block"> <table class="table table-hover table-clickable table-striped table-middle"> <thead> <tr> <th rowspan="1" style="min-width:400px">Item's</th> <th rowspan="1" style="min-width:150px">Presentación</th> <th class="tex-center" colspan="1" ng-repeat="alm in vm.almacenes">{{alm.almacen_descripcion}}</th> </tr> </thead> <tbody> <tr ng-repeat="det in vm.detalleitems"> <td> <span class="label label-info label-7rem" ng-if="det.insumo_id || det.presentacioninsumo_id">Insumo </span> <span class="label label-primary label-7rem" ng-if="det.producto_id">Producto </span> {{det.item_descripcion}} </td> <td> <ui-select on-select="vm.fnObtenerAlmacenPorId($item, $model)" ng-model="det.presentacion" theme="bootstrap"> <ui-select-match placeholder="Selecciona una presentación"> {{$select.selected.presentacion_nombre}} </ui-select-match> <ui-select-choices repeat="item in det.presentacionList | filter: $select.search"> <div ng-bind-html="item.presentacion_nombre | highlight: $select.search"></div> </ui-select-choices> </ui-select> </td> <td class="text-center cell-right-border" ng-repeat="alm in vm.almacenes"> <div class="input-group min-width-120" uib-tooltip="Desabilitado por que no se controla stock." tooltip-enable="!detAlm.seControlaStock" ng-repeat="detAlm in det.almacenes | filter: {almacen_id: alm.almacen_id} as listaFiltradaGuia"> <input type="text" class="form-control input-sm text-right" solo-numeros ng-model="detAlm.inventario_cantidad" ng-disabled="!detAlm.seControlaStock"> <div class="input-group-btn" uib-tooltip="{{detAlm.detallearqueoinventario_nota}}"> <button type="none" ng-click="vm.fnAbrirModal(detAlm)" ng-disabled="!detAlm.seControlaStock" class="btn btn-sm btn-primary"> <i class="fa fa-comment" ng-if="detAlm.detallearqueoinventario_nota"> </i> <i class="fa fa-comment-o" ng-if="!detAlm.detallearqueoinventario_nota"> </i> </button> </div> </div> <div class="input-group min-width-120" uib-tooltip="Desabilitado por que no se controla stock." tooltip-enable="true" ng-if="listaFiltradaGuia.length == 0">-</div> </td> </tr> </tbody> </table> </div> </div> <div class="float-e-margins text-right m-r-md"> <button class="btn btn-default" ng-click="vm.cerrarModal()" ladda="vm.registrandoArqueo">Cancelar </button> <button class="btn btn-primary" ng-click="vm.guardarArqueo()" ladda="vm.registrandoArqueo"> <i class="fa fa-save"></i> Guardar arqueo de inventario</button> </div> </div> </div>
