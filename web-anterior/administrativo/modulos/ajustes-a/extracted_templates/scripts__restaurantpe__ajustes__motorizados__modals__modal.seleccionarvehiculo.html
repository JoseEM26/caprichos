<div class="modal-header"> <h4 class="modal-title"><i class="fa fa-plus-circle"></i> Lista de vehículos disponibles </h4> </div> <div class="modal-body"> <div class="row p-b-md"> <div class="col-sm-12"> <div class="input-group customer-finder"> <input class="form-control" ng-model="vm.filtroMovilidad" placeholder="Filtrar o buscar"> <span class="input-group-btn"> <button ng-click="vm.filtroMovilidad = ''" class="btn btn-default"> <span class="fa fa-close"></span> </button> </span> </div> </div> </div> <div class="row" ng-if="vm.movilidadList.length"> <div class="col-sm-12"> <div class="table-responsive"> <table class="table table-bordered table-shadow"> <thead> <tr> <th>Marca</th> <th>Placa</th> <th>Serie chasis</th> <th>Asignar</th> </tr> </thead> <tbody> <tr ng-repeat="movilidad in vm.movilidadList | filter: vm.filtroMovilidad"> <td><strong>{{movilidad.movilidad_marca }}</strong></td> <td><strong>{{movilidad.movilidad_placa }}</strong></td> <td><strong>{{movilidad.movilidad_seriechasis }}</strong></td> <td> <div class="checkbox is-icheck text-center"> <label> <input type="checkbox" icheck ng-model="movilidad.movilidad_asignar" ng-true-value="'1'" ng-false-value="'0'"> </label> </div> </td> </tr> </tbody> </table> </div> </div> </div> <div class="row" ng-if="!vm.movilidadList.length"> <div class="col-sm-12"> <div class="panel panel-transparent panel-dashed text-center p-md"> <i class="fa fa-warning fa-3x text-warning"></i> <h2 class="m-t-none m-b-sm">No se han encontrado vehículos registrados.</h2> </div> </div> </div> </div> <div class="modal-footer"> <button class="btn btn-default" type="button" ng-click="vm.cerrarModal()">Cancelar</button> <button ladda="btnCargandoModalGuardar" ng-disabled="formProveedor.$invalid" class="btn btn-primary" ng-if="vm.movilidadList.length" id="btnRegistrar" ng-click="vm.fnAsignarAMorotizado()"><i class="fa fa-check"></i> Asignar al motorizado </button> </div>
