 <div sticky-kit="globalStickyOpts"> <div class="ibox"> <div class="ibox-title"> <h5><i class="fa fa-edit"></i> Mesa: {{vm.mesa.mesa_descripcion}}</h5> </div> <div class="ibox-content"> <ng-form name="form"> <div class="row"> <div class="col-sm-6"> <div class="form-group" ng-class="{'has-error': !vm.mesa.mesa_descripcion && form.$dirty}"> <label class="control-label" for="mesa_descripcion" uib-tooltip="Hasta 5 caracteres"> Nombre <i class="icon-help"></i> </label> <input colocar-focus capitalize class="form-control" name="mesa_descripcion" id="mesa_descripcion" required ui-mask="*?*?*?" capitalize ng-model="vm.mesa.mesa_descripcion" ng-if="!Security.esDominioParaPardos()"> <input colocar-focus capitalize class="form-control" name="mesa_descripcion" id="mesa_descripcion" required ui-mask="*?*?*?*?*?" capitalize ng-model="vm.mesa.mesa_descripcion" ng-if="Security.esDominioParaPardos()"> <div ng-if="form.mesa_descripcion.$dirty" ng-messages="form.mesa_descripcion.$error"> <div class="help-block" ng-message="required">Campo requerido</div> <div class="help-block" ng-message="minlength">Nombre muy corto (minimo 3 letras)</div> <div class="help-block" ng-message="uniqueNombrecaja">Se econtraron coincidencias</div> </div> </div> </div> <div class="col-sm-4"> <div class="form-group"> <label class="control-label" for="mesa_numeroasientos" uib-tooltip="Cantidad de asientos disponibles en esta mesa"> Número asientos <i class="icon-help"></i> </label> <input colocar-focus capitalize class="form-control" name="mesa_numeroasientos" id="mesa_numeroasientos" solo-numeros capitalize ng-model="vm.mesa.mesa_numeroasientos"> </div> </div> </div> <div class="row"> <div class="col-sm-6"> <div class="form-group"> <label class="control-label">Forma</label> <ui-select ng-model="vm.formaSeleccionado" theme="bootstrap" search-enabled="false"> <ui-select-match placeholder="Selecciona una forma">{{$select.selected.nombre}}</ui-select-match> <ui-select-choices repeat="item in vm.tiposDeMesa | filter: $select.search"> <div ng-bind-html="item.nombre | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> </div> <div class="col-sm-6"> <div class="form-group"> <label class="control-label">Salón</label> <ui-select ng-model="vm.salonSeleccionado" theme="bootstrap" search-enabled="false" ng-disabled="vm.mesa.mesa_estado*1>1"> <ui-select-match placeholder="Selecciona un salon">{{$select.selected.salon_descripcion}}</ui-select-match> <ui-select-choices repeat="salon in vm.salonList | filter: $select.search"> <div ng-bind-html="salon.salon_descripcion | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> </div> </div> <div class="form-group"> <label class="control-label">Estado</label> <div class="checkbox is-icheck" ng-if="vm.mesa.mesa_estado*1<2"> <label> <input type="checkbox" icheck ng-model="vm.mesa.mesa_estado" ng-true-value="'1'" ng-false-value="'0'"> Mesa(s) activa(s) </label> </div> <div ng-if="vm.mesa.mesa_estado*1>1"> <label class="text-info"> <em> Atención la mesa esta ocupada, esta opción estará disponible cuando la mesa se libere.</em> </label> </div> </div> <div class="float-e-margins"> <button ladda="btnCargandoMesaGuardar" ng-disabled="form.$invalid" class="btn btn-primary" ng-if="$state.is('ajustes.salones.ver.nuevaMesa')" id="btnRegistrar" ng-click="vm.fnAgregarMesa()"><i class="fa fa-save"></i> Guardar</button> <button ladda="btnCargandoMesaModificar" ng-disabled="form.$invalid" class="btn btn-success" ng-if="$state.is('ajustes.salones.ver.editarMesa')" id="btnModificar" ng-click="vm.fnActualizarMesa()"><i class="fa fa-save"></i> Modificar</button> <button class="btn btn-default" ng-click="$state.go('ajustes.salones.ver')">Cancelar</button> </div> </ng-form> </div> </div> </div>
