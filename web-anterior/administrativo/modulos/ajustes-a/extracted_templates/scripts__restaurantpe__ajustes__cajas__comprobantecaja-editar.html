g-false-value="'0'"> </label> </div> </td> </tr> <tr ng-hide="(vm.marcaList).length"> <td colspan="5"> <em> <i class="fa fa-info-circle"></i> <em>No hay resultados.</em> </em> </td> </tr> </tbody> </table> </div> </div> <div class="float-e-margins"> <button ladda="btnCargandoModificar" ng-disabled="form.$invalid" class="btn btn-primary" id="btnRegistrar" ng-click="vm.fnActualizarComprobante()" class="btn btn-default btn-icon btn-block">Guardar</button> <button class="btn btn-default" ng-click="$state.go('ajustes.comprobantes')">Cancelar</button> </div> </ng-form> </div> </div>
