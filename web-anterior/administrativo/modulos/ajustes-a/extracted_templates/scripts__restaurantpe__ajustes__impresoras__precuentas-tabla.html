<button class="btn btn-primary btn-sm m-b" ng-click="vm.nuevaPrecuenta()"> <i class="fa fa-plus-circle"></i> Nueva estación </button> <div ng-form name="form"> <div rest-loader-model="cargandoprecuenta" ng-class="{'is-loading': cargandoprecuenta}"></div> <div class="table-responsive restloader-remote-el" ng-class="{'is-loading': cargandoprecuenta}"> <table class="table table-condensed table-text-13 table-middle table-hover m-b-none"> <thead> <tr> <th>Estación</th> <th>Impresora</th> <th>Imprime logo</th> <th>Estado</th> <th class="text-right">Acciones</th> </tr> </thead> <tbody> <tr ng-hide="vm.precuentaList.length != 0"> <td colspan="10"> <em> <span>No hay precuentas registradas</span> </em> </td> </tr> <tr ng-repeat="precuenta in vm.precuentaList"> <td> <div ng-if="!precuenta.editando">{{precuenta.precuenta_nombre}}</div> <div ng-if="precuenta.editando" class="form-group" ng-class="{'has-error': !precuenta.precuenta_nombre && form.$dirty}"> <div class="checkbox is-icheck"> <label> <input class="form-control" placeholder="Nombre de la precuenta" name="precuenta_nombre" ng-model="precuenta.precuenta_nombre" required> <div ng-if="form.precuenta_nombre.$dirty" ng-messages="form.precuenta_nombre.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> </label> </div> </div> </td> <td> <div ng-if="!precuenta.editando"> <strong>{{precuenta.impresora.impresora_nombre}}</strong> <small class="display-block">{{precuenta.impresora.impresora_ip}}</small> <small class="display-block" ng-if="!precuenta.impresora">Ninguna impresora</small> </div> <div ng-if="precuenta.editando"> <ui-select ng-model="precuenta.impresora" theme="bootstrap" append-to-body="true"> <ui-select-match placeholder="Selecciona una impresora">{{$select.selected.impresora_nombre}}</ui-select-match> <ui-select-choices repeat="impresora in vm.impresoraListCombo | filter: $select.search"> <div ng-bind-html="impresora.impresora_nombre | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> </td> <td> <div ng-if="!precuenta.editando"> <span class="text-primary" ng-if="precuenta.imprimeLogo()"><i class="fa fa-check"></i> Sí</span> <span class="text-danger" ng-if="!precuenta.imprimeLogo()"><i class="fa fa-close"></i> No</span> </div> <div ng-if="precuenta.editando"> <div class="checkbox is-icheck"> <label> <input type="checkbox" icheck ng-model="precuenta.precuenta_imprimelogo" ng-true-value="'1'" ng-false-value="'0'"> ¿Imprimir logo? </label> </div> </div> </td> <td> <div ng-if="precuenta.editando"> <input type="checkbox" id="precuenta_estado" icheck ng-model="precuenta.precuenta_estado" ng-true-value="'1'" ng-false-value="'0'"> ¿Activa? </div> <div ng-if="!precuenta.editando"> <span ng-if="precuenta.estaActivo()" class="label label-primary">Activa</span> <span ng-if="!precuenta.estaActivo()" class="label label-danger">Inactiva</span> </div> </td> <td class="text-right"> <span ng-if="precuenta.getPrecuenta_id()"> <button class="btn btn-danger btn-xs" ng-click="vm.fnEliminarImpresoraPrecuenta(precuenta)"><i class="fa fa-trash"></i> Eliminiar</button> </span> <span ng-if="!precuenta.editando"> <button class="btn btn-success btn-xs" ng-click="precuenta.editando = !precuenta.editando"><i class="fa fa-edit"></i> Editar</button> </span> <span ng-if="precuenta.editando"> <button ng-disabled="form.$invalid" class="btn btn-primary btn-xs" ng-click="precuenta.editando = !precuenta.editando;vm.fnVincularGuardarPrecuentaImpresora(precuenta)"><i class="fa fa-save"></i> Guardar</button> </span> <button class="btn btn-default btn-xs" ng-click="vm.fnTestImpresora(precuenta.impresora)"><i class="fa fa-print"></i> Probar</button> </td> </tr> </tbody> </table> </div> </div> <button class="btn btn-primary btn-sm m-t" ng-click="vm.nuevaPrecuenta()"> <i class="fa fa-plus-circle"></i> Nueva estación </button>
