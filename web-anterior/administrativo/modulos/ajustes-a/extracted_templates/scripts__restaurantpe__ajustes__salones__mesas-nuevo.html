 <div sticky-kit="globalStickyOpts"> <div class="ibox"> <div class="ibox-title"> <h5><i class="fa fa-plus-circle"></i> Añadir Mesa(s)</h5> </div> <div class="ibox-content"> <ng-form name="form"> <div class="tabs-container m-b-md"> <uib-tabset active="vm.tabActiva"> <uib-tab heading="Una mesa"> <div class="panel-body"> <div class="row"> <div class="col-sm-6" ng-if="vm.tabActiva == 0"> <div class="form-group" ng-class="{'has-error': !vm.mesa.mesa_descripcion && form.$dirty}"> <label class="control-label" for="mesa_descripcion" uib-tooltip="Hasta {{Security.esDominioParaPardos() ? 5 : 3}} caracteres"> Nombre <i class="icon-help"></i> </label> <input colocar-focus capitalize class="form-control" name="mesa_descripcion" id="mesa_descripcion" ui-mask="*?*?*?" capitalize ng-model="vm.mesa.mesa_descripcion" ng-minlength="3" required ng-if="!Security.esDominioParaPardos()"> <input colocar-focus capitalize class="form-control" name="mesa_descripcion" id="mesa_descripcion" ui-mask="*?*?*?*?*?" capitalize ng-model="vm.mesa.mesa_descripcion" ng-minlength="3" required ng-if="Security.esDominioParaPardos()"> <div ng-if="form.mesa_descripcion.$dirty" ng-messages="form.mesa_descripcion.$error"> <div class="help-block" ng-message="required">Campo requerido</div> <div class="help-block" ng-message="minlength">Nombre muy corto (minimo 3 caracteres)</div> </div> </div> </div> </div> </div> </uib-tab> <uib-tab heading="Varias mesas"> <div class="panel-body"> <div class="row"> <div class="col-sm-6" ng-if="vm.tabActiva == 1"> <div class="form-group" ng-class="{'has-error': !vm.mesa.salon_prefijomesas && form.$dirty}"> <label class="control-label" for="salon_prefijomesas" uib-tooltip="El nombre de la mesa iniciará con este prefijo"> Prefijo <i class="icon-help"></i> </label> <input colocar-focus capitalize class="form-control" name="salon_prefijomesas" id="salon_prefijomesas" placeholder="Una letra o un número" ui-mask-placeholder ui-mask="*" capitalize ng-model="vm.mesa.salon_prefijomesas" required> <div ng-if="form.salon_prefijomesas.$dirty" ng-messages="form.salon_prefijomesas.$error"> <div class="help-block" ng-message="required">Campo requerido</div> <div class="help-block" ng-message="minlength">Nombre muy corto (minimo 3 caracteres)</div> </div> </div> </div> <div class="col-sm-6" ng-if="vm.tabActiva == 1"> <div class="form-group"> <label class="control-label" for="cantidad" uib-tooltip="Un número entre 1 y 99"> Cantidad de mesas <i class="icon-help"></i> </label> <input class="form-control" type="text" name="cantidad" id="cantidad" min="0" max="99" solo-numeros-sin-decimal ng-model="vm.mesa.salon_nmesas" required> </div> </div> </div> <p ng-if="!vm.mesa.salon_nmesas" class="alert alert-warning m-b-none"> <i class="fa fa-info-circle"></i> No se crearán mesas. </p> <p ng-if="vm.mesa.salon_nmesas" class="alert alert-warning m-b-none"> <i class="fa fa-info-circle"></i> Ejemplo de mesas: <span ng-repeat="x in repetirN(vm.mesa.salon_nmesas) track by $index"> {{vm.mesa.salon_prefijomesas | uppercase}}{{$index + 1 | numberLZero: 2}}<span ng-if="!$last">, </span><span ng-if="$last && vm.mesa.salon_nmesas > 4">...</span> </span> </p> </div> </uib-tab> </uib-tabset> </div> <div class="row"> <div class="col-sm-6"> <div class="form-group"> <label class="control-label">Forma</label> <ui-select ng-model="vm.formMesaSeleccionado" theme="bootstrap" search-enabled="false" ng-required="true"> <ui-select-match placeholder="Selecciona una forma">{{$select.selected.nombre}}</ui-select-match> <ui-select-choices repeat="item in vm.tiposDeMesa | filter: $select.search"> <div ng-bind-html="item.nombre | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> </div> </div> <div class="form-group"> <label class="control-label">Estado</label> <div class="checkbox is-icheck"> <label> <input type="checkbox" icheck ng-model="vm.mesa.mesa_estado" ng-true-value="'1'" ng-false-value="'0'"> Mesa(s) activa(s) </label> </div> </div> <div class="float-e-margins"> <button ladda="btnCargandoMesaGuardar" ng-disabled="form.$invalid" class="btn btn-primary" ng-if="$state.is('ajustes.salones.ver.nuevaMesa')" id="btnRegistrar" ng-click="vm.fnAgregarMesa()"><i class="fa fa-save"></i> Guardar</button> <button ladda="btnCargandoMesaModificar" ng-disabled="form.$invalid" class="btn btn-success" ng-if="$state.is('ajustes.salones.ver.editarMesa')" id="btnModificar" ng-click="vm.fnActualizarMesa()"><i class="fa fa-refresh"></i> Modificar</button> <button ladda="btnCargandoMesaEliminar" class="btn btn-danger" ng-if="$state.is('ajustes.salones.ver.editarMesa')" id="btnEliminar" ng-click="vm.fnEliminarMesa()"><i class="fa fa-trash"></i> Eliminar</button> <button class="btn btn-default" ng-click="$state.go('ajustes.salones.ver')">Cancelar</button> </div> </ng-form> </div> </div> </div>
