<div class="ibox no-margins"> <div class="ibox-content"> <ng-form name="form"> <div class="row"> <div class="col-sm-12"> <div class="form-group"> <h3 class="text-primary">Comprobante: {{vm.comprobante.comprobante_tipo}} </h3> <div class="row"> <div class="col-sm-12"> <div class="form-group"> <label for="comprobante_serie" class="control-label">Serie</label> <input colocar-focus capitalize type="text" class="form-control" id="comprobante_serie" name="comprobante_serie" required ng-model="vm.comprobante.comprobante_serie"> <div ng-if="form.comprobante_serie.$dirty" ng-messages="form.comprobante_serie.$error"> <div ng-message="required">Campo requerido</div> </div> </div> </div> </div> <div class="row"> <div class="col-sm-12"> <div class="form-group"> <label for="comprobante_numero" class="control-label" uib-tooltip="Por ejemplo: Si eliges como correlativo anterior el número 0; el documento iniciará en 1.">Número correlativo anterior <i class="icon-help fa fa-question-circle"></i></label> <input type="text" class="form-control" id="comprobante_numero" name="comprobante_numero" required ng-model="vm.comprobante.comprobante_numero" placeholder="Número correlativo anterior"> <div ng-if="form.comprobante_numero.$dirty" ng-messages="form.comprobante_numero.$error"> <div ng-message="required">Campo requerido</div> </div> </div> </div> </div> <div class="row"> <div class="col-sm-12"> <div class="form-group"> <label>Estado</label> <div class="checkbox is-icheck"> <label> <input type="checkbox" id="estado" icheck ng-model="vm.comprobante.comprobante_estado" ng-true-value="'1'" ng-false-value="'0'"> Activo </label> </div> </div> </div> </div> <div class="row"> <div class="col-sm-12"> <div class="form-group"> <label>Predeterminada</label> <div class="checkbox is-icheck"> <label> <input type="checkbox" id="predeterminado" icheck ng-model="vm.comprobante.comprobante_predeterminado" ng-true-value="'1'" ng-false-value="'0'"> Es predeterminada </label> </div> </div> </div> </div> </div> </div> </div> <div class="text-right"> <button class="btn btn-default" type="button" ng-click="vm.fnCancel()">Cancelar</button> <button class="btn btn-primary ladda-button" ladda="vm.btnCargandoGuardar" data-style="expand-left" ng-click="vm.fnGuardar()" ng-disabled="form.$invalid" type="none"> <i class="fa fa-save"></i> Guardar </button> </div> </ng-form> </div> </div>
