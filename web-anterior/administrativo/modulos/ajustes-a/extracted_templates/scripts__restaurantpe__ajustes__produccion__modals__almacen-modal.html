<form name="frmAlmacen"> <div class="modal-header"> <h4 class="modal-title"><i class="fa fa-plus-circle"></i> Nuevo almacén</h4> </div> <ng-form name="formAlmacen"> <div class="modal-body"> <div class="form-group" ng-class="{'has-error': !vm.almacen.almacen_descripcion && formAlmacen.$dirty}"> <label class="control-label" for="almacen_descripcion">Nombre</label> <input class="form-control" id="almacen_descripcion" name="almacen_descripcion" required ng-model="vm.almacen.almacen_descripcion" minlength="3"> <div ng-if="formAlmacen.almacen_descripcion.$dirty" ng-messages="formAlmacen.almacen_descripcion.$error"> <div class="help-block" ng-message="required">Campo requerido</div> <div class="help-block" ng-message="minlength">Nombre muy corto (minimo 3 letras)</div> </div> </div> </div> <div class="modal-footer"> <button class="btn btn-default" type="button" ng-click="vm.cerrarModal()">Cancelar</button> <button ladda="btnCargandoModalGuardar" ng-disabled="formAlmacen.$invalid" class="btn btn-primary" id="btnRegistrar" ng-click="vm.fnAgregar()"><i class="fa fa-save"></i> Guardar</button> </div> </ng-form> </form>
