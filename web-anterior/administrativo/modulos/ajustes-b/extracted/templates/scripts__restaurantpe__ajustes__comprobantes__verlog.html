<div class="ibox"> <div class="ibox-title"> <h5 ng-if="$state.is('ajustes.comprobantes.verlog')"><i class="fa fa-edit"></i> <strong>Comprobante:</strong> {{vm.comprobante.comprobante_tipo}}</h5> </div> <div class="ibox-content"> <ng-form name="form"> <div class="table-responsive restloader-remote-el" ng-class="{'is-loading': cargando}"> <table class="table table-condensed table-text-13 table-middle table-hover m-b-none"> <div class="form-group"> <label for="comprobante_serie" class="control-label">Serie</label> <input colocar-focus capitalize type="text" class="form-control" id="comprobante_serie" name="comprobante_serie" required ng-model="vm.comprobante.comprobante_serie"> <div ng-if="form.comprobante_serie.$dirty" ng-messages="form.comprobante_serie.$error"> <div ng-message="required">Campo requerido</div> </div> </div> <div class="form-group"> <label for="numeracion" class="control-label" uib-tooltip="Por ejemplo: Si eliges como correlativo anterior el número 0; el documento iniciará en 1.">Número correlativo anterior <i class="icon-help fa fa-question-circle"></i></label> <input type="text" class="form-control" id="numeracion" name="numeracion" required ng-model="vm.comprobante.comprobante_numero" placeholder="Número correlativo anterior"> <div ng-if="form.comprobante_numero.$dirty" ng-messages="form.comprobante_numero.$error"> <div ng-message="required">Campo requerido</div> </div> </div> <thead> <tr> <th>Fecha cambio</th> <th>Usuario</th> <th>Comentario</th> <th>Opcion</th> </tr> <tr> <td> 2012-03-24 17:45:12 </td> <td>rgarciag</td> <td>Modifiqué el campo : YY</td> <td> <button class="btn btn-link btn-sm p-l-none" ng-click="vm.abrirNuevaImpresora()"><i class="fa fa-plus-circle"></i> Ver detalle log</button> </td> </tr> </thead> <tbody> <tr ng-repeat="logtabla in vm.logsTablaList "> <td>{{logtabla.logtabla_fecharegistro}}</td> <td>{{logtabla.usuario_id }}</td> <td>{{logtabla.logtabla_campoalterado}}</td> </tr> </tbody> </table> </div> <br> <div class="float-e-margins"> <button class="btn btn-default" ng-click="$state.go('ajustes.comprobantes')">Cancelar</button> </div> </ng-form> </div> </div>
