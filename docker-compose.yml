services:
  postgres:
    image: postgres:16-alpine
    container_name: caprichos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: caprichos
      POSTGRES_PASSWORD: caprichos_dev
      POSTGRES_DB: caprichos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caprichos -d caprichos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: caprichos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: caprichos-api
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: postgresql://caprichos:caprichos_dev@postgres:5432/caprichos?schema=public # ejemplo local (placeholder)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_VERSION: 0.1.0
      GIT_COMMIT: dev-local
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: caprichos-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
