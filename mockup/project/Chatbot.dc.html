<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Chatbot de Caprichos en WhatsApp</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#EFEAE2;color:#111B21;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:20px;display:flex;flex-direction:column">

  <!-- Cabecera de WhatsApp -->
  <div style="background:#008069;color:#FFFFFF;padding:10px 12px;display:flex;align-items:center;gap:10px">
    <span aria-hidden="true" style="font-size:22px;line-height:22px">←</span>
    <img src="{{logoSrc}}" alt="{{botName}}" style="width:40px;height:40px;border-radius:20px;object-fit:cover">
    <div style="flex:1;min-width:0">
      <div style="font-weight:600;font-size:16px;line-height:20px">{{botName}}</div>
      <div style="font-size:12px;line-height:16px;color:#D9F2EC">Cuenta de empresa · en línea</div>
    </div>
    <span aria-hidden="true" style="font-size:20px;letter-spacing:6px">⋮</span>
  </div>

  <!-- Controles de la maqueta (acta 02): no es parte de WhatsApp -->
  <sc-if value="{{hideCtl}}" hint-placeholder-val="{{ false }}"><button onClick="{{toggleCtl}}" style="margin:6px 8px 0;min-height:44px;padding:0 10px;border:1px dashed #667781;border-radius:8px;background:#F7F5F0;color:#54656F;font-weight:700;font-size:12px">Mostrar controles</button></sc-if>
  <sc-if value="{{showCtl}}" hint-placeholder-val="{{ true }}"><div style="margin:6px 8px 0;padding:4px 6px 6px;border:1px dashed #667781;border-radius:8px;background:#F7F5F0">
    <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;line-height:14px;letter-spacing:0.6px;font-weight:700;color:#54656F">CONTROLES DE LA MAQUETA</span><button onClick="{{toggleCtl}}" style="min-height:28px;padding:0 8px;border:1px solid #667781;border-radius:8px;background:transparent;color:#54656F;font-weight:700;font-size:12px">Ocultar</button></div>
    <div style="display:flex;gap:6px;margin-top:2px;flex-wrap:wrap">
      <sc-for list="{{controls}}" as="c" hint-placeholder-count="3">
        <button onClick="{{c.pick}}" style="flex:1 1 30%;min-height:44px;padding:2px 4px;border:1px solid #667781;border-radius:8px;background:{{c.bg}};color:{{c.fg}};font-size:12px;line-height:14px;font-weight:600">{{c.n}}</button>
      </sc-for>
    </div>
  </div></sc-if>

  <!-- Conversación -->
  <div role="log" aria-live="polite" aria-label="Conversación con el asistente" style="flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column-reverse;gap:6px">
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="3">
      <div style="display:flex;flex-direction:column;align-items:{{m.align}};gap:4px">
        <sc-if value="{{m.isSys}}" hint-placeholder-val="{{ false }}">
          <!-- Etiqueta de sistema, estilo pildora (acta 02) -->
          <div style="align-self:center;background:#FFF3C4;color:#54656F;font-size:12px;line-height:16px;font-weight:700;padding:4px 12px;border-radius:12px;box-shadow:0 1px 0.5px rgba(11,20,26,0.13)">{{m.text}}</div>
        </sc-if>
        <sc-if value="{{m.isMsg}}" hint-placeholder-val="{{ true }}">
        <div style="max-width:80%;padding:6px 8px 4px 9px;border-radius:8px;background:{{m.bg}};box-shadow:0 1px 0.5px rgba(11,20,26,0.13)">
          <div style="white-space:pre-line">{{m.text}}</div>
          <div style="text-align:right;font-size:12px;line-height:14px;color:#667781">{{m.time}}<span style="color:{{m.tickColor}}">{{m.ticks}}</span></div>
        </div>
        </sc-if>
        <sc-if value="{{m.hasButtons}}" hint-placeholder-val="{{ false }}">
          <div style="width:80%;display:flex;flex-direction:column;gap:4px">
            <sc-for list="{{m.buttons}}" as="b" hint-placeholder-count="2">
              <button onClick="{{b.pick}}" style="width:100%;min-height:44px;border:0;border-radius:8px;background:#FFFFFF;color:#0B6FB3;font-weight:600;font-size:15px;box-shadow:0 1px 0.5px rgba(11,20,26,0.13)">{{b.n}}</button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{m.hasList}}" hint-placeholder-val="{{ false }}">
          <div style="width:80%">
            <button onClick="{{openSheet}}" style="width:100%;min-height:44px;border:0;border-radius:8px;background:#FFFFFF;color:#0B6FB3;font-weight:600;font-size:15px;box-shadow:0 1px 0.5px rgba(11,20,26,0.13)">☰  Ver opciones</button>
          </div>
        </sc-if>
      </div>
    </sc-for>
    <div style="align-self:center;background:#FFFFFF;color:#54656F;font-size:12px;line-height:16px;font-weight:600;padding:4px 10px;border-radius:8px;box-shadow:0 1px 0.5px rgba(11,20,26,0.13)">HOY</div>
  </div>

  <!-- Barra de escritura: el cliente puede escribir libre; el bot entiende lo básico y si no, pasa a una persona -->
  <div style="padding:8px;display:flex;align-items:center;gap:8px;background:#EFEAE2">
    <input type="text" value="{{txt}}" onChange="{{setTxt}}" placeholder="Mensaje" aria-label="Escribe tu mensaje" style="flex:1;min-width:0;box-sizing:border-box;min-height:44px;border-radius:22px;border:0;background:#FFFFFF;padding:0 14px;font-size:15px;color:#111B21">
    <button onClick="{{sendTxt}}" aria-label="Enviar mensaje" style="width:44px;height:44px;border:0;border-radius:22px;background:#008069;color:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 20l18-8L3 4v6l11 2-11 2z" fill="#fff"></path></svg></button>
  </div>

  <!-- Hoja de opciones (mensaje de lista) -->
  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ false }}">
    <div onClick="{{closeSheet}}" style="position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(11,20,26,0.5)"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;max-height:70%;background:#FFFFFF;border-radius:16px 16px 0 0;display:flex;flex-direction:column">
      <div style="padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E9EDEF">
        <div style="font-weight:600;font-size:16px">{{sheetTitle}}</div>
        <button onClick="{{closeSheet}}" aria-label="Cerrar" style="width:44px;height:44px;border:0;background:transparent;color:#54656F;font-size:22px">×</button>
      </div>
      <div style="flex:1;min-height:0;overflow-y:auto">
        <sc-for list="{{sheetRows}}" as="r" hint-placeholder-count="4">
          <button onClick="{{r.pick}}" style="width:100%;min-height:52px;border:0;border-bottom:1px solid #F0F2F5;background:#FFFFFF;color:#111B21;padding:0 16px;display:flex;align-items:center;gap:12px;text-align:left;font-size:15px">
            <span style="flex:1">{{r.n}}</span>
            <span style="width:20px;height:20px;border-radius:10px;border:2px solid #667781;background:{{r.dot}};flex:none"></span>
          </button>
        </sc-for>
      </div>
      <div style="padding:12px 16px 16px">
        <button onClick="{{sendSheet}}" style="width:100%;min-height:48px;border:0;border-radius:24px;background:{{sendBg}};color:#FFFFFF;font-weight:600;font-size:15px">Enviar</button>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>

  orderReply(kind, msgs, raw) {

  sendTxt() {
    const s = this.state; const raw = String(s.txt || '').trim(); if (!raw) { return; }
    const n = raw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    const kind = /(cancel|anul|ya no quiero|quitar|quita |agreg|anadir|cambiar? (el |mi )?(pedido|producto|orden)|cambio de (pedido|producto))/.test(n) ? 'ped'
      : /((cambi|otra|nueva|mal).*(direcci|ubicaci|lugar)|(direcci|ubicaci).*(cambi|mal|equivo[cq]|error)|(equivo[cq]|error|incorrect).*(direcci|ubicaci|lugar)|me mude|llevalo a|en otro lado)/.test(n) ? 'dir'
      : /(cuanto (falta|demora|tarda|tiempo)|ya sale|donde esta|demora|tarda|tiempo (de entrega|estimado)|a que hora (llega|sale))/.test(n) ? 'eta'
      : /(asesor|persona|humano|alguien|reclamo|queja|ayuda)/.test(n) ? 'persona'
      : /(quiero|quisiera|pedir|pedido|ordenar|me das|me regalas|antoj|tienen|carta|menu)/.test(n) ? 'pedir'
      : /^(hola|holi|buenas|buen dia|buenos dias|buenas tardes|buenas noches|hey)\b/.test(n) ? 'saludo' : 'otro';

    if (kind === 'dir' || kind === 'ped' || kind === 'eta') {
      if (!s.hasOrder) { this.setState({ msgs: this.say(msgs, 'bot', 'No encuentro un pedido activo con tu número. ¿Quieres hacer uno ahora?'), step: 'start', txt: '', unk: 0 }); return; }
      this.orderReply(kind, msgs, raw); return; }
    if (kind === 'persona') { this.handoff(msgs, 'Pidió hablar con una persona', raw, HUMAN, raw); return; }
    if (kind === 'pedir') { this.setState({ txt: '' }); this.choose({ id: 'pedir', say: raw }); return; }
    if (kind === 'saludo') { this.setState({ msgs: this.say(msgs, 'bot', HELLO), step: 'start', txt: '', unk: 0 }); return; }
    if ((s.unk || 0) >= 1) { this.handoff(msgs, 'Mensaje que el bot no entendió', raw, 'No logro entender bien tu mensaje, mejor te paso con una persona del equipo para ayudarte.', raw); return; }
    this.setState({ msgs: this.say(msgs, 'bot', 'No estoy seguro de haber entendido. ¿Qué necesitas? Puedes elegir una opción o escribirme de otra forma.'), step: 'start', txt: '', unk: 1 });
  }

  // resumen del pedido; antes ofrece una promoción si el pedido califica (o le falta poco). Nada cambia sin que el cliente acepte
  toSummary(msgs0, patch0) {
    const s = Object.assign({}, this.state, patch0 || {}); let msgs = msgs0; const bot = (tt) => { msgs = this.say(msgs, 'bot', tt); return msgs; };

    const pdS0 = s.pd.reduce((a, e) => a + e.v, 0); const au0 = autoDesc(s.items); const acu = !!(cfgAll().reglas || {}).acumula;

    const feeLine = s.modal === 'delivery' ? '\nEnvío: ' + (feePend ? 'lo confirma un asesor al ubicarte' : (fee ? fmt(fee) : 'gratis')) : '';
    this.setState(Object.assign({ sheet: false, sel: -1 }, patch0 || {}, { msgs: bot('Este es tu resumen:\n' + lines + feeLine + '\nTotal: ' + fmt(sub - pdS - au.disc + fee) + '\n\n¿Confirmo tu pedido?'), step: 'summary' }));

  choose(opt) {
    const s = this.state;
    let msgs = this.say(s.msgs, 'user', opt.say || opt.n);
    const bot = (t) => { msgs = this.say(msgs, 'bot', t); return msgs; };

      else if (opt.id === 'persona') { done({ msgs: this.say(bot(HUMAN), 'sys', SYS), step: 'human' }); }

      done({ msgs: bot(opt.ans), step: 'askAns' });
    } else if (s.step === 'resPeople') {

    } else if (s.step === 'resTime') {
      done({ msgs: bot('Recibí tu solicitud de reserva para ' + s.people + ' personas a las ' + opt.n + '. Todavía no está confirmada: una persona del equipo la revisa y te responde por aquí. Si se confirma, guardamos la mesa ' + tolOf() + ' minutos de tolerancia.'), step: 'resDone' });
    } else if (s.step === 'web') {

    } else if (s.step === 'rep1' || s.step === 'rep2') {
      // acta 03 (DT-74): si el cliente responde, no se envían los avisos siguientes
      done({ msgs: this.say(bot(opt.id === 'no' ? 'Gracias por avisar. Le digo al repartidor y una persona del equipo te escribe para coordinar.' : '¡Gracias! Le avisamos al repartidor que estás atenta.'), 'sys', 'El cliente respondió: ya no se envían más avisos. El repartidor lo ve en su pantalla.'), step: 'end', repResp: true });
    } else if (s.step === 'post') {

      else { this.toSummary(msgs, { declined: s.declined.concat(of ? [ of.id ] : []) }); }

    } else if (s.step === 'cash') {

    } else {

    }
  }

    }
    else if (s.step === 'more') { options = [ { n: 'Agregar otro producto', id: 'otro' }, { n: 'Ver resumen', id: 'resumen' } ]; }
    else if (s.step === 'promo') { options = [ { n: 'Sí, aplicar la promoción', say: 'Sí, aplícala', id: 'si' }, { n: 'No, gracias', id: 'no' } ]; }
    else if (s.step === 'promoMiss') { options = [ { n: 'Agregar otro producto', id: 'otro' }, { n: 'Seguir sin la promoción', id: 'seguir' } ]; }
    else if (s.step === 'summary') { options = [ { n: 'Confirmar pedido', id: 'ok' }, { n: 'Empezar de nuevo', id: 'nuevo' } ]; }
    else { options = [ { n: 'Hacer otro pedido', id: 'nuevo' } ]; }
    return { options: options, title: title };
  }

  renderVals() {
    const s = this.state;
    const cur = this.optionsNow();
    const asList = cur.options.length > 3;
    const lastIdx = s.msgs.length - 1;
    const msgs = s.msgs.map((m, i) => {
      const isLastBot = i === lastIdx && m.from !== 'user';
      return { text: m.text, isSys: m.from === 'sys', isMsg: m.from !== 'sys', align: m.from === 'user' ? 'flex-end' : 'flex-start', bg: m.from === 'bot' ? '#FFFFFF' : '#D9FDD3',
        time: timeOf(i), ticks: m.from === 'user' ? ' ✓✓' : '', tickColor: '#53BDEB',
        hasButtons: isLastBot && !asList, hasList: isLastBot && asList,
        buttons: isLastBot && !asList ? cur.options.map((o) => ({ n: o.n, pick: () => this.choose(o) })) : [] };
    }).reverse();
    const chip = (on) => ({ bg: on ? '#008069' : '#FFFFFF', fg: on ? '#FFFFFF' : '#111B21' });
    // (acta 02) Chips de la maqueta que disparan escenarios simulados
    const controls = [
      Object.assign({ n: 'Entra un pedido web', pick: () => this.scenario('web', '¡Hola, Ana! Recibimos tu pedido CP-0110 por la carta web. Total: s/ 52.50 · Método de pago: Yape. Tu pedido ya está en cocina 👩‍🍳 y te llega de ' + (tBaseOf() + extraOf(s.demand)) + ' a ' + (tMaxOf() + extraOf(s.demand)) + ' minutos. Un asesor te escribe por aquí para coordinar el pago y pedirte la captura. ¿Todo bien con tu pedido?') }, chip(s.step === 'web')),
      Object.assign({ n: 'Repartidor: «En camino»', pick: () => this.setState({ hasOrder: true, ordCode: 'CP-0110', ordSt: 'ruta', repResp: false, rep3: false, sheet: false, sel: -1, step: 'rep1', msgs: [ { from: 'sys', text: 'El repartidor pulsó «En camino». Mensaje 1 automático (plantilla de Meta):' }, { from: 'bot', text: repTxt(1) } ] }) }, chip(s.step === 'rep1' && s.ordSt === 'ruta')),
      Object.assign({ n: 'Repartidor: «He llegado»', pick: () => this.setState({ hasOrder: true, ordCode: 'CP-0110', ordSt: 'llego', repResp: false, rep3: false, sheet: false, sel: -1, step: 'rep2', msgs: [ { from: 'sys', text: 'El repartidor pulsó «He llegado». Mensaje 2:' }, { from: 'bot', text: repTxt(2) } ] }) }, chip(s.step === 'rep2' && !s.rep3)),
      Object.assign({ n: 'Minuto y medio sin respuesta', pick: () => { if (s.step !== 'rep2') { return; } this.setState({ rep3: true, msgs: this.say(this.say(s.msgs, 'sys', 'Pasó minuto y medio sin respuesta. Mensaje 3:'), 'bot', repTxt(3)) }); } }, chip(!!s.rep3 && s.step === 'rep2')),
      Object.assign({ n: 'Pasaron ' + (Number(tx('encMin', '120')) >= 60 ? (Math.round(Number(tx('encMin', '120')) / 6) / 10) + ' h' : tx('encMin', '120') + ' min'), pick: () => this.scenario('post', tx('encPregunta', 'Hola, ¿tu pedido llegó bien y en orden? Cuéntanos cómo te fue')) }, chip(s.step === 'post')),
      Object.assign({ n: 'Cliente escribe tras pedir', pick: () => this.setState({ hasOrder: true, ordCode: 'CP-0110', ordSt: s.ordSt, step: 'start', unk: 0, txt: '', msgs: [ { from: 'sys', text: 'Hace ' + s.ordMin + ' min Ana Pérez hizo el pedido CP-0110 (delivery, s/ 52.50). Ahora escribe:' }, { from: 'user', text: 'Hola' }, { from: 'bot', text: HELLO } ] }) }, chip(s.hasOrder)),
      Object.assign({ n: 'Estado del pedido: ' + ({ nuevo: 'en cocina', prep: 'en cocina', listo: 'listo', ruta: 'en camino', llego: 'el repartidor llegó', entregado: 'entregado' })[s.ordSt], pick: () => this.setState({ ordSt: ({ nuevo: 'listo', prep: 'listo', listo: 'ruta', ruta: 'llego', llego: 'entregado', entregado: 'prep' })[s.ordSt] }) }, chip(false)),
      Object.assign({ n: 'Pasaron ' + s.ordMin + ' min', pick: () => this.setState({ ordMin: ({ 0: 10, 10: 20, 20: 36, 36: 10 })[s.ordMin] || 10 }) }, chip(false)),
      Object.assign({ n: 'Alta demanda: ' + (s.demand ? 'Encendida' : 'Apagada'), pick: () => this.setState({ demand: !s.demand }) }, chip(s.demand))
    ];
    return {
      botName: CINFO.nombre, logoSrc: (cfgAll().info || {}).logo || '/_blob/6d6aa5696913688bb2235a49f1133c2a', showCtl: !s.ctlHide, hideCtl: !!s.ctlHide, toggleCtl: () => this.setState({ ctlHide: !this.state.ctlHide }), controls: controls,
      msgs: msgs, txt: s.txt, setTxt: (e) => this.setState({ txt: e.target.value }), sendTxt: () => this.sendTxt(),
      openSheet: () => this.setState({ sheet: true, sel: -1 }), closeSheet: () => this.setState({ sheet: false }),
      sheetOpen: s.sheet, sheetTitle: cur.title,
      sheetRows: cur.options.map((o, i) => ({ n: o.n, dot: s.sel === i ? '#008069' : 'transparent', pick: () => this.setState({ sel: i }) })),
      sendBg: s.sel >= 0 ? '#008069' : '#B7C0C4',
      sendSheet: () => { if (s.sel >= 0) { this.choose(cur.options[s.sel]); } }
    };
  }
}
</script>
