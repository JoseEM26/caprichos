          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${SSH_USER:-deploy}@${SSH_HOST}" \
            "/opt/caprichos/scripts/preparar-produccion.sh $MODO" 2>&1 | tee preparar.log

      - name: Borrar la llave del ejecutor
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # Roles y primer ADMIN de producción (seed.ts). La clave queda en un archivo 600 del servidor, nunca en el log.
  crear-admin-produccion:
    name: Crear administrador inicial de PRODUCCIÓN
    needs: validar-y-determinar
    if: needs.validar-y-determinar.outputs.accion == 'crear-admin-produccion'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: prod
    concurrency:
      group: crear-admin-produccion
      cancel-in-progress: false
    steps:
      - name: Checkout (scripts del tag validado)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validar-y-determinar.outputs.ref }}
          sparse-checkout: infra/compose

      - name: Configurar llave y huella SSH (sin StrictHostKeyChecking=no)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          for v in SSH_KEY SSH_HOST SSH_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then
              echo "::error::Falta el secreto $v en GitHub (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sincronizar scripts en el VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes ${SSH_USER:-deploy}@${SSH_HOST}"
          tar -czf - -C infra/compose scripts | $SSH 'mkdir -p /opt/caprichos && tar -xzf - -C /opt/caprichos && chmod +x /opt/caprichos/scripts/*'

      - name: Crear administrador inicial
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DNI: ${{ github.event.inputs.dni_admin }}
        run: |
          set -o pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${SSH_USER:-deploy}@${SSH_HOST}" \
            "/opt/caprichos/scripts/crear-admin-produccion.sh '${DNI}'" 2>&1 | tee admin.log

      - name: Borrar la llave del ejecutor
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # Importa un paquete a PRODUCCIÓN. Solo workflow_dispatch; ambiente prod (aprobación del entorno);
  # tag en main y confirmación PRODUCCION (validado arriba) + frase IMPORTAR DATOS DE LA EMPRESA.
  # simulacro=true por defecto: no escribe. Con simulacro=false: respaldo completo de prod y luego importa.
  importar-datos-produccion:
    name: Importar datos de la empresa a PRODUCCIÓN
    needs: validar-y-determinar
    if: needs.validar-y-determinar.outputs.accion == 'importar-datos-produccion'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: prod
    concurrency:
      group: importar-datos-produccion
      cancel-in-progress: false
    steps:
      - name: Checkout (scripts del tag validado)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validar-y-determinar.outputs.ref }}
          sparse-checkout: infra/compose

      - name: Configurar llave y huella SSH (sin StrictHostKeyChecking=no)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          for v in SSH_KEY SSH_HOST SSH_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then
              echo "::error::Falta el secreto $v en GitHub (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sincronizar scripts en el VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes ${SSH_USER:-deploy}@${SSH_HOST}"
          tar -czf - -C infra/compose scripts | $SSH 'mkdir -p /opt/caprichos && tar -xzf - -C /opt/caprichos && chmod +x /opt/caprichos/scripts/*'

      - name: Importar el paquete a producción (simulacro por defecto)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SIMULACRO: ${{ github.event.inputs.simulacro }}
          PAQUETE: ${{ github.event.inputs.paquete }}
        run: |
          set -o pipefail
          if [ "$SIMULACRO" = "false" ]; then MODO=real; else MODO=simulacro; fi
          echo "==> Modo: ${MODO} (paquete: ${PAQUETE})"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${SSH_USER:-deploy}@${SSH_HOST}" \
            "/opt/caprichos/scripts/importar-datos-empresa.sh prod '${PAQUETE}' ${MODO}" 2>&1 | tee importar.log

      - name: Resumen de la importación (sin secretos)
        if: always()
        run: |
          {
            echo "## Importación de datos de la empresa a PRODUCCIÓN"
            echo ""
            echo "Paquete: \`${{ github.event.inputs.paquete }}\` · simulacro: \`${{ github.event.inputs.simulacro }}\` · tag: \`${{ needs.validar-y-determinar.outputs.tag }}\`"
            echo ""
            echo '```'
            tail -n 120 importar.log 2>/dev/null || echo "(sin log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Borrar la llave del ejecutor
        if: always()
        run: rm -f ~/.ssh/deploy_key
