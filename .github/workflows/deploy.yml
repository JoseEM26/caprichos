          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes ${SSH_USER:-deploy}@${SSH_HOST}"
          tar -czf - -C infra/compose scripts | $SSH 'mkdir -p /opt/caprichos && tar -xzf - -C /opt/caprichos && chmod +x /opt/caprichos/scripts/*'

      - name: Restaurar el último respaldo en una base temporal
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          AMBIENTE: ${{ needs.validar-y-determinar.outputs.ambiente }}
        run: |
          set -o pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${SSH_USER:-deploy}@${SSH_HOST}" \
            "/opt/caprichos/scripts/probar-restauracion.sh $AMBIENTE" 2>&1 | tee restauracion.log

      - name: Resumen (solo conteos)
        if: always()
        run: |
          {
            echo "## Prueba de restauración"
            echo ""
            echo '```'
            grep -E "^(Respaldo|AVISO|Tablas|Filas|OK|FALLA|ERROR)" restauracion.log || echo "(sin datos: revise el log del paso anterior)"
            echo '```'
