            if [ "${{ needs.validar-y-determinar.outputs.ambiente }}" = "prod" ]; then
              echo "> **Aviso:** lo normal es NO cargar reseñas en producción; los datos de la empresa llegan con importar-datos-produccion."
              echo ""
            fi
            echo '```'
            tail -n 120 resenas-carga.log 2>/dev/null || echo "(sin salida: revise el log del paso anterior)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Borrar la llave del ejecutor
        if: always()
        run: rm -f ~/.ssh/deploy_key

