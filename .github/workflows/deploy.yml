          {
            echo "## Respaldo manual de la demo"
            echo ""
            echo "Carpeta en el VPS: \`/opt/caprichos/respaldos/demo\`"
            echo ""
            echo '```'
            grep -E "respaldada|Volumen uploads|Directorio de almacenamiento|Se eliminaron|No hay archivos antiguos" respaldo.log || echo "(sin datos del respaldo: revise el log del paso anterior)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Borrar la llave del ejecutor
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # Cambia los dominios de la demo a demo.caprichos.pe (conservando caprichos.pe). Simulacro por defecto.
  configurar-dominios-demo:
    name: Configurar dominios de la demo
    needs: validar-y-determinar
    if: needs.validar-y-determinar.outputs.accion == 'configurar-dominios-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: demo
    concurrency:
      group: configurar-dominios-demo
      cancel-in-progress: false
    steps:
      - name: Checkout (scripts de esta versión)
