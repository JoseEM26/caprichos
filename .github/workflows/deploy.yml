            echo "::error::Falta el secreto RESEND_API_KEY. Guárdelo con: gh secret set RESEND_API_KEY --env ${AMBIENTE} --repo JoseEM26/caprichos"
            exit 1
          fi
          printf '%s' "$CLAVE" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${SSH_USER:-deploy}@${SSH_HOST}" \
            "/opt/caprichos/scripts/configurar-correo.sh '${AMBIENTE}'" 2>&1 | tee correo.log

      - name: Resumen (sin secretos)
        if: always()
        run: |
          {
            echo "## Correo de avisos (Resend)"
            echo ""
            echo '```'
            grep -E "^(== |RESEND|TAG=|OK|ERROR|AVISO|Copia|Se restauró)" correo.log || echo "(sin datos: revise el log del paso anterior)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Borrar la llave del ejecutor
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # Copia la clave de la IA (OpenAI) de la demo al .env de producción, dentro del servidor, y redespliega prod con el mismo tag.
