    concurrency:
      group: sanear-clientes-demo
      cancel-in-progress: false
    steps:
      - name: Checkout (scripts de esta versión)
        uses: actions/checkout@v4
        with:
          sparse-checkout: infra/compose

      - name: Configurar llave y huella SSH (sin StrictHostKeyChecking=no)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          for v in SSH_KEY SSH_HOST SSH_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then
              echo "::error::Falta el secreto $v en GitHub (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sincronizar scripts en el VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes ${SSH_USER:-deploy}@${SSH_HOST}"
          tar -czf - -C infra/compose scripts | $SSH 'mkdir -p /opt/caprichos && tar -xzf - -C /opt/caprichos && chmod +x /opt/caprichos/scripts/*'

      - name: Sanear clientes de la demo (simulacro primero; real solo si se desmarcó simulacro)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SIMULACRO: ${{ github.event.inputs.simulacro }}
        run: |
          if [ "$SIMULACRO" = "false" ]; then MODO=real; else MODO=simulacro; fi
          echo "==> Modo: ${MODO}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${SSH_USER:-deploy}@${SSH_HOST}" \
            "/opt/caprichos/scripts/sanear-clientes-demo.sh '${MODO}'"

      - name: Borrar la llave del ejecutor
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # Copia manual de la demo (sin programación). Solo demo, rama preprod y confirmación RESPALDAR DEMO.
  respaldar-demo:
    name: Respaldo manual de la demo
    needs: validar-y-determinar
