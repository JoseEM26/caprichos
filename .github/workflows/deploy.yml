          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes ${SSH_USER:-deploy}@${SSH_HOST}"
          tar -czf - -C infra/compose scripts | $SSH 'mkdir -p /opt/caprichos && tar -xzf - -C /opt/caprichos && chmod +x /opt/caprichos/scripts/*'

      - name: Guardar la clave y redesplegar (sin mostrar la clave)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          AMBIENTE: ${{ needs.validar-y-determinar.outputs.ambiente }}
          CLAVE: ${{ secrets.OPENWEBNINJA_API_KEY }}
        run: |
          set -o pipefail
          if [ -z "$CLAVE" ]; then
            echo "::error::Falta el secreto OPENWEBNINJA_API_KEY. Guárdelo con: gh secret set OPENWEBNINJA_API_KEY"
