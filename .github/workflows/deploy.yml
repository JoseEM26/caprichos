name: Deploy Caprichos por SSH

on:
  push:
    branches:
      - main
      - preprod
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente a desplegar (demo o prod)'
        required: true
        default: 'demo'
        type: choice
        options:
          - demo
          - prod
      tag:
        description: 'Tag de versión (obligatorio para prod, ej. v0.3.0)'
        required: false
        type: string
      confirmacion:
        description: 'Producción: escriba PRODUCCION. Sanear: SANEAR CLIENTES DE LA DEMO. Respaldo: RESPALDAR DEMO. Exportar: EXPORTAR DATOS DE LA DEMO. Dominios: CONFIGURAR DOMINIOS DE LA DEMO. Proxy: ACTUALIZAR PROXY. Monitor: INSTALAR MONITOR. Respaldos: PROGRAMAR RESPALDOS'
        required: false
        type: string
      accion:
        description: 'Acción: desplegar (normal), sanear-demo (borra cuentas de clientes, SOLO demo), respaldar-demo (copia manual de la demo), exportar-datos-demo (paquete de configuración y contenido de la demo), importar-datos-produccion (importa el paquete a PRODUCCIÓN), configurar-dominios-demo (la demo pasa a demo.caprichos.pe y conserva el dominio adicional), configurar-resenas (guarda el secreto OPENWEBNINJA_API_KEY en el .env del ambiente y redespliega con el mismo tag; demo o prod, prod exige PRODUCCION), cargar-resenas (carga inicial de reseñas de Google del local buscado en consulta_resenas; demo o prod, prod exige PRODUCCION y no es lo normal), configurar-sunat (guarda los secretos SUNAT_AMBIENTE, SUNAT_SOL_USUARIO, SUNAT_SOL_CLAVE, SUNAT_CERT_P12_B64 y SUNAT_CERT_CLAVE en el .env del ambiente y redespliega con el mismo tag; demo o prod, prod exige PRODUCCION), configurar-correo (guarda el secreto RESEND_API_KEY en el .env del ambiente y redespliega con el mismo tag; demo o prod, prod exige PRODUCCION), copiar-ia-a-prod (copia la clave de la IA OpenAI de la demo al .env de PRODUCCIÓN dentro del servidor, sin mostrarla, y redespliega prod con el mismo tag; solo prod, exige PRODUCCION), configurar-whatsapp (guarda los secretos WHATSAPP_VERIFY_TOKEN, WHATSAPP_PHONE_ID, WHATSAPP_TOKEN y WHATSAPP_APP_SECRET que existan en el entorno, en el .env del ambiente y redespliega con el mismo tag; demo o prod, prod exige PRODUCCION), preparar-produccion (crea el .env de PRODUCCIÓN con claves aleatorias; no despliega), crear-admin-produccion (roles y primer administrador de PRODUCCIÓN; la clave queda en un archivo del servidor), sincronizar-proxy (actualiza los middlewares de Traefik; simulacro por defecto), probar-restauracion (restaura el último respaldo en una base temporal; demo o prod), probar-restauracion-externa (baja el último respaldo del repositorio externo restic/Backblaze y lo restaura en una base temporal; solo lectura; demo o prod, prod exige PRODUCCION), instalar-monitor (Uptime Kuma solo local en el servidor), ver-estado-servidor (consumo del VPS y respaldos; solo lectura), consultar-pedido (dónde quedó un pedido; solo lectura, demo), programar-respaldos (cron diario de prod, copia cifrada en R2 y aviso a Uptime Kuma; simulacro por defecto)'
        required: false
        default: 'desplegar'
        type: choice
        options:
          - desplegar
          - sanear-demo
          - respaldar-demo
          - exportar-datos-demo
          - configurar-dominios-demo
          - configurar-resenas
          - cargar-resenas
          - configurar-sunat
          - configurar-correo
          - copiar-ia-a-prod
          - configurar-whatsapp
          - preparar-produccion
          - crear-admin-produccion
          - sincronizar-proxy
          - probar-restauracion
          - probar-restauracion-externa
          - instalar-monitor
          - ver-estado-servidor
          - consultar-pedido
          - programar-respaldos
          - importar-datos-produccion
          - importar-personal
      paquete:
        description: 'Solo importar-datos-produccion: carpeta del paquete exportado (fecha, p. ej. 20261030_120000, o ruta dentro de /opt/caprichos/respaldos/datos-empresa)'
        required: false
        type: string
      frase_datos:
        description: 'Solo importar-datos-produccion: escriba IMPORTAR DATOS DE LA EMPRESA'
        required: false
        type: string
      dni_admin:
        description: 'Solo crear-admin-produccion: DNI (8 dígitos) del administrador inicial'
        required: false
        type: string
      excluir_productos:
        description: 'Solo exportar-datos-demo: nombres de productos que NO viajan, separados por coma (p. ej. ASDSADASD)'
        required: false
        default: 'ASDSADASD'
        type: string
      sin_personal:
        description: 'Solo exportar-datos-demo: true = no exporta las cuentas del personal (se crean a mano en producción)'
        required: false
        default: true
        type: boolean
      codigo_pedido:
        description: 'Solo consultar-pedido: código del pedido, p. ej. CP-W014'
        required: false
        type: string
      dominio_adicional:
        description: 'Solo configurar-dominios-demo: segundo dominio que atiende la demo (por defecto caprichos.pe; escriba ninguno para quitarlo cuando producción lo use)'
        required: false
        default: 'caprichos.pe'
        type: string
      simulacro:
        description: 'Solo para sanear-demo, configurar-dominios-demo, sincronizar-proxy, programar-respaldos, preparar-produccion e importar-datos-produccion: true = simulacro (no escribe); false = real (con respaldo previo)'
        required: false
        default: true
        type: boolean

      consulta_resenas:
        description: 'Solo cargar-resenas: Texto para buscar el local o business_id; ej. Caprichos Campoy'
        required: false
        default: ''
        type: string
      repetir_resenas:
        description: 'Solo cargar-resenas: true = vuelve a cargar aunque ya haya reseñas'
        required: false
        default: false
        type: boolean
      aplicar_personal:
        description: 'Solo importar-personal: false = simulacro (no escribe, por defecto); true = crea las cuentas. El CSV sale del secreto PERSONAL_CSV_B64 (base64)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  validar-y-determinar:
    name: Validar autorización y parámetros
    runs-on: ubuntu-latest
    outputs:
      ambiente: ${{ steps.evaluar.outputs.ambiente }}
      tag: ${{ steps.evaluar.outputs.tag }}
      ref: ${{ steps.evaluar.outputs.ref }}
      short_sha: ${{ steps.evaluar.outputs.short_sha }}
      accion: ${{ steps.evaluar.outputs.accion }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar condiciones de despliegue
        id: evaluar
        env:
          EVENTO: ${{ github.event_name }}
          IN_AMBIENTE: ${{ github.event.inputs.ambiente }}
          IN_TAG: ${{ github.event.inputs.tag }}
          IN_CONFIRMACION: ${{ github.event.inputs.confirmacion }}
          IN_ACCION: ${{ github.event.inputs.accion }}
          REF_NAME: ${{ github.ref_name }}
          IN_FRASE: ${{ github.event.inputs.frase_datos }}
          IN_PAQUETE: ${{ github.event.inputs.paquete }}
          IN_DNI: ${{ github.event.inputs.dni_admin }}
          IN_CONSULTA: ${{ github.event.inputs.consulta_resenas }}
          IN_REPETIR: ${{ github.event.inputs.repetir_resenas }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          ACCION="desplegar"
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$IN_ACCION" = "sanear-demo" ]; then
            ACCION="sanear-demo"
            echo "==> Saneamiento de clientes de la DEMO (jamás producción)..."
            if [ "$IN_AMBIENTE" != "demo" ]; then
              echo "::error::El saneamiento solo existe para el ambiente demo."
              exit 1
            fi
            if [ "$REF_NAME" != "preprod" ]; then
              echo "::error::El saneamiento de la demo solo se lanza desde la rama preprod."
              exit 1
            fi
            if [ "$IN_CONFIRMACION" != "SANEAR CLIENTES DE LA DEMO" ]; then
              echo "::error::Escriba exactamente 'SANEAR CLIENTES DE LA DEMO' en confirmacion."
              exit 1
            fi
          fi
          # Respaldo y exportación de la DEMO: manuales, solo demo y solo rama preprod
          if [ "$EVENTO" = "workflow_dispatch" ] && { [ "$IN_ACCION" = "respaldar-demo" ] || [ "$IN_ACCION" = "exportar-datos-demo" ] || [ "$IN_ACCION" = "configurar-dominios-demo" ]; }; then
            ACCION="$IN_ACCION"
            echo "==> Acción ${ACCION} (solo demo, solo rama preprod)..."
            if [ "$IN_AMBIENTE" != "demo" ]; then
              echo "::error::Esta acción solo existe para el ambiente demo."
              exit 1
            fi
            if [ "$REF_NAME" != "preprod" ]; then
              echo "::error::Esta acción solo se lanza desde la rama preprod."
              exit 1
            fi
            if [ "$ACCION" = "respaldar-demo" ] && [ "$IN_CONFIRMACION" != "RESPALDAR DEMO" ]; then
              echo "::error::Escriba exactamente 'RESPALDAR DEMO' en confirmacion."
              exit 1
            fi
            if [ "$ACCION" = "exportar-datos-demo" ] && [ "$IN_CONFIRMACION" != "EXPORTAR DATOS DE LA DEMO" ]; then
              echo "::error::Escriba exactamente 'EXPORTAR DATOS DE LA DEMO' en confirmacion."
              exit 1
            fi
            if [ "$ACCION" = "configurar-dominios-demo" ] && [ "$IN_CONFIRMACION" != "CONFIGURAR DOMINIOS DE LA DEMO" ]; then
              echo "::error::Escriba exactamente 'CONFIGURAR DOMINIOS DE LA DEMO' en confirmacion."
              exit 1
            fi
          fi

          # Proxy (Traefik) y prueba de restauración: manuales. El proxy es de la demo/rama preprod; la prueba de
          # restauración en prod pasa por la validación de producción (PRODUCCION + tag en main) de más abajo.
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$IN_ACCION" = "sincronizar-proxy" ]; then
            ACCION="sincronizar-proxy"
            if [ "$IN_AMBIENTE" != "demo" ] || [ "$REF_NAME" != "preprod" ]; then
              echo "::error::sincronizar-proxy se lanza con ambiente demo desde la rama preprod."
              exit 1
            fi
            if [ "$IN_CONFIRMACION" != "ACTUALIZAR PROXY" ]; then
              echo "::error::Escriba exactamente 'ACTUALIZAR PROXY' en confirmacion."
              exit 1
            fi
          fi
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$IN_ACCION" = "programar-respaldos" ]; then
            ACCION="programar-respaldos"
            if [ "$IN_AMBIENTE" != "demo" ] || [ "$REF_NAME" != "preprod" ]; then
              echo "::error::programar-respaldos se lanza con ambiente demo desde la rama preprod."
              exit 1
            fi
            if [ "$IN_CONFIRMACION" != "PROGRAMAR RESPALDOS" ]; then
              echo "::error::Escriba exactamente 'PROGRAMAR RESPALDOS' en confirmacion."
              exit 1
            fi
          fi
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$IN_ACCION" = "consultar-pedido" ]; then
            ACCION="consultar-pedido"
            if [ "$IN_AMBIENTE" != "demo" ] || [ "$REF_NAME" != "preprod" ]; then
              echo "::error::consultar-pedido se lanza con ambiente demo desde la rama preprod."
              exit 1
            fi
          fi
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$IN_ACCION" = "ver-estado-servidor" ]; then
            ACCION="ver-estado-servidor"
            if [ "$IN_AMBIENTE" != "demo" ] || [ "$REF_NAME" != "preprod" ]; then
              echo "::error::ver-estado-servidor se lanza con ambiente demo desde la rama preprod."
              exit 1
            fi
          fi
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$IN_ACCION" = "instalar-monitor" ]; then
            ACCION="instalar-monitor"
            if [ "$IN_AMBIENTE" != "demo" ] || [ "$REF_NAME" != "preprod" ]; then
              echo "::error::instalar-monitor se lanza con ambiente demo desde la rama preprod."
              exit 1
            fi
            if [ "$IN_CONFIRMACION" != "INSTALAR MONITOR" ]; then
              echo "::error::Escriba exactamente 'INSTALAR MONITOR' en confirmacion."
              exit 1
            fi
          fi
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$IN_ACCION" = "probar-restauracion" ]; then
            ACCION="probar-restauracion"
            if [ "$IN_AMBIENTE" = "demo" ] && [ "$REF_NAME" != "preprod" ]; then
              echo "::error::probar-restauracion en demo se lanza desde la rama preprod."
              exit 1
            fi
          fi
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$IN_ACCION" = "probar-restauracion-externa" ]; then
            ACCION="probar-restauracion-externa"
            if [ "$IN_AMBIENTE" = "demo" ] && [ "$REF_NAME" != "preprod" ]; then
              echo "::error::probar-restauracion-externa en demo se lanza desde la rama preprod."
              exit 1
            fi
          fi

          # Claves de reseñas (OpenWebNinja): manual; producción pasa por la validación de prod (PRODUCCION + tag en main) de más abajo
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$IN_ACCION" = "configurar-resenas" ]; then
            ACCION="configurar-resenas"
            if [ "$IN_AMBIENTE" = "demo" ] && [ "$REF_NAME" != "preprod" ]; then
              echo "::error::configurar-resenas en demo se lanza desde la rama preprod."
              exit 1
            fi
          fi

          # Facturación electrónica SUNAT directo: manual; producción pasa por la validación de prod de más abajo
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$IN_ACCION" = "configurar-sunat" ]; then
            ACCION="configurar-sunat"
            if [ "$IN_AMBIENTE" = "demo" ] && [ "$REF_NAME" != "preprod" ]; then
              echo "::error::configurar-sunat en demo se lanza desde la rama preprod."
              exit 1
            fi
          fi

          # Clave de Resend (avisos por correo): manual; producción pasa por la validación de prod de más abajo
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$IN_ACCION" = "configurar-correo" ]; then
            ACCION="configurar-correo"
            if [ "$IN_AMBIENTE" = "demo" ] && [ "$REF_NAME" != "preprod" ]; then
              echo "::error::configurar-correo en demo se lanza desde la rama preprod."
              exit 1
            fi
          fi

          # Clave de la IA (OpenAI): se copia de la demo a PRODUCCIÓN dentro del servidor; solo prod (validación de prod de más abajo)
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$IN_ACCION" = "copiar-ia-a-prod" ]; then
            ACCION="copiar-ia-a-prod"
            if [ "$IN_AMBIENTE" != "prod" ]; then
              echo "::error::copiar-ia-a-prod solo existe para el ambiente prod."
              exit 1
            fi
          fi

          # Datos de WhatsApp (Meta): manual; producción pasa por la validación de prod de más abajo
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$IN_ACCION" = "configurar-whatsapp" ]; then
            ACCION="configurar-whatsapp"
            if [ "$IN_AMBIENTE" = "demo" ] && [ "$REF_NAME" != "preprod" ]; then
              echo "::error::configurar-whatsapp en demo se lanza desde la rama preprod."
              exit 1
            fi
          fi

          # Carga inicial de reseñas (comando de la API): manual; producción pasa por la validación de prod de más abajo
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$IN_ACCION" = "cargar-resenas" ]; then
            ACCION="cargar-resenas"
            if [ "$IN_AMBIENTE" = "demo" ] && [ "$REF_NAME" != "preprod" ]; then
              echo "::error::cargar-resenas en demo se lanza desde la rama preprod."
              exit 1
            fi
            if [ -z "$IN_CONSULTA" ]; then
              echo "::error::Indique en consulta_resenas el local a buscar (ej. Caprichos Campoy) o su business_id."
              exit 1
            fi
            if [ "${#IN_CONSULTA}" -gt 120 ]; then
              echo "::error::consulta_resenas tiene más de 120 caracteres."
              exit 1
            fi
            case "$IN_CONSULTA" in
              *\"*|*\'*|*\\*|*\$*|*\`*) echo "::error::consulta_resenas no puede llevar comillas, barra invertida, \$ ni acento grave."; exit 1 ;;
            esac
            if [[ "$IN_CONSULTA" =~ [[:cntrl:]] ]]; then
              echo "::error::consulta_resenas no puede llevar caracteres de control ni saltos de línea."
              exit 1
            fi
          fi

          # Importación de personal (script de consola de la API): manual; la validación de prod (PRODUCCION + tag en main) va abajo
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$IN_ACCION" = "importar-personal" ]; then
            ACCION="importar-personal"
            if [ "$IN_AMBIENTE" = "demo" ] && [ "$REF_NAME" != "preprod" ]; then
              echo "::error::importar-personal en demo se lanza desde la rama preprod."
              exit 1
            fi
          fi

          # Preparar PRODUCCIÓN (crea su .env): manual; la validación de prod (PRODUCCION + tag en main) va abajo
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$IN_ACCION" = "preparar-produccion" ]; then
            ACCION="preparar-produccion"
            if [ "$IN_AMBIENTE" != "prod" ]; then
              echo "::error::Preparar producción solo existe para el ambiente prod."
              exit 1
            fi
          fi

          # Crear el primer administrador de PRODUCCIÓN: manual; la validación de prod (PRODUCCION + tag en main) va abajo
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$IN_ACCION" = "crear-admin-produccion" ]; then
            ACCION="crear-admin-produccion"
            if [ "$IN_AMBIENTE" != "prod" ]; then
              echo "::error::Esta acción solo existe para el ambiente prod."
              exit 1
            fi
            if [[ ! "$IN_DNI" =~ ^[0-9]{8}$ ]]; then
              echo "::error::dni_admin debe tener exactamente 8 dígitos."
              exit 1
            fi
          fi

          # Importación a PRODUCCIÓN de los datos de la empresa: manual, con paquete y frase; la validación de prod va abajo
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$IN_ACCION" = "importar-datos-produccion" ]; then
            ACCION="importar-datos-produccion"
            echo "==> Importación de datos de la empresa a PRODUCCIÓN (manual, con respaldo previo)..."
            if [ "$IN_AMBIENTE" != "prod" ]; then
              echo "::error::La importación de datos solo existe para el ambiente prod."
              exit 1
            fi
            if [ "$IN_FRASE" != "IMPORTAR DATOS DE LA EMPRESA" ]; then
              echo "::error::Escriba exactamente 'IMPORTAR DATOS DE LA EMPRESA' en frase_datos."
              exit 1
            fi
            if [ -z "$IN_PAQUETE" ] || [[ ! "$IN_PAQUETE" =~ ^[A-Za-z0-9_./-]+$ ]] || [[ "$IN_PAQUETE" == *".."* ]]; then
              echo "::error::El paquete debe ser una fecha o una ruta simple (sin espacios, comillas ni '..')."
              exit 1
            fi
          fi

          echo "accion=${ACCION}" >> "$GITHUB_OUTPUT"

          if [ "$EVENTO" = "workflow_dispatch" ]; then
            ENV_DEST="$IN_AMBIENTE"
            TAG_DEST="$IN_TAG"
            CONFIRMACION="$IN_CONFIRMACION"

            if [ "$ENV_DEST" = "prod" ]; then
              echo "==> Validando despliegue deliberado a PRODUCCIÓN..."

              # 1. Validación de confirmación explícita
              if [ "$CONFIRMACION" != "PRODUCCION" ]; then
                echo "::error::Para desplegar a producción debe escribir exactamente 'PRODUCCION' en el campo de confirmación."
                exit 1
              fi

              # 2. Validación de formato de tag
              if [[ -z "$TAG_DEST" || ! "$TAG_DEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::En producción es obligatorio indicar un tag semántico válido (ej. v0.3.0). Recibido: '$TAG_DEST'."
                exit 1
              fi

              # 3. Validación de existencia del tag en el repositorio
              if ! git rev-parse "refs/tags/${TAG_DEST}" >/dev/null 2>&1; then
                echo "::error::El tag '${TAG_DEST}' no existe en el repositorio."
                exit 1
              fi

              TAG_COMMIT=$(git rev-list -n 1 "refs/tags/${TAG_DEST}")
              echo "    ✓ Tag ${TAG_DEST} localizado en commit ${TAG_COMMIT}."

              # 4. Validación de que el commit del tag esté integrado en main
              git fetch origin main:refs/remotes/origin/main
              if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
                echo "::error::El commit ${TAG_COMMIT} correspondiente al tag ${TAG_DEST} NO está integrado en la rama 'main'."
                exit 1
              fi
              echo "    ✓ El commit del tag está verificado y presente en la rama main."

            else
              # Modo manual para demo
              if [ -z "$TAG_DEST" ]; then
                TAG_DEST="$SHORT_SHA"
              fi
            fi

          else
            # Disparado por push a ramas (preprod o main)
            ENV_DEST="demo"
            TAG_DEST="$SHORT_SHA"
          fi

          echo "ambiente=${ENV_DEST}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_DEST}" >> "$GITHUB_OUTPUT"
          if [ "$ENV_DEST" = "prod" ]; then echo "ref=refs/tags/${TAG_DEST}" >> "$GITHUB_OUTPUT"; else echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"; fi

  # Decide qué imágenes hay que construir. Push a demo: solo las que cambiaron respecto del
  # commit anterior (la otra se re-etiqueta en GHCR con el tag nuevo). Manual/producción: todo.
  detectar-cambios:
    name: Detectar imágenes a reconstruir
    needs: validar-y-determinar
    if: needs.validar-y-determinar.outputs.accion == 'desplegar'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cambios: ${{ steps.dif.outputs.cambios }}
      owner: ${{ steps.dif.outputs.owner }}
      base7: ${{ steps.dif.outputs.base7 }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Comparar con el commit anterior desplegado
        id: dif
        env:
          EVENTO: ${{ github.event_name }}
          AMBIENTE: ${{ needs.validar-y-determinar.outputs.ambiente }}
          BEFORE: ${{ github.event.before }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          API=true; WEB=true; BASE7=""
          # Solo en push a demo; manual y producción construyen todo siempre.
          if [ "$EVENTO" = "push" ] && [ "$AMBIENTE" = "demo" ] \
             && [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BASE7="${BEFORE::7}"
            CAMBIOS=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            echo "$CAMBIOS"
            COMUN='^(packages/compartido/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|tsconfig\.base\.json$|\.dockerignore$)'
            echo "$CAMBIOS" | grep -Eq "${COMUN}|^(apps/api/|mockup/|docs/analisis/|infra/docker/Dockerfile\.api$)" || API=false
            echo "$CAMBIOS" | grep -Eq "${COMUN}|^(apps/web/|infra/docker/(Dockerfile\.web|nginx-caprichos\.conf|demo-aviso\.html)$)" || WEB=false
            # Una imagen sin cambios solo se re-etiqueta si la del commit anterior existe en GHCR
            if [ "$API" = false ] && ! docker buildx imagetools inspect "ghcr.io/${OWNER}/caprichos-api:${BASE7}" >/dev/null 2>&1; then
              echo "No hay imagen API del commit anterior: se construye."; API=true
            fi
            if [ "$WEB" = false ] && ! docker buildx imagetools inspect "ghcr.io/${OWNER}/caprichos-web:${BASE7}" >/dev/null 2>&1; then
              echo "No hay imagen Web del commit anterior: se construye."; WEB=true
            fi
          fi
          echo "base7=${BASE7}" >> "$GITHUB_OUTPUT"
          echo "cambios={\"api\":${API},\"web\":${WEB}}" >> "$GITHUB_OUTPUT"
          echo "Reconstruir -> api=${API} web=${WEB}"

  # API y Web se construyen a la vez (matriz). Sin Trivy: build y push en un solo paso.
  imagenes:
    name: Imagen ${{ matrix.imagen }}
    needs: [validar-y-determinar, detectar-cambios]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Trivy (solo CRITICAL con corrección disponible) escanea lo que llega a main y a producción;
      # preprod sigue por el camino rápido sin escaneo.
      ESCANEAR_IMAGENES: ${{ github.ref_name == 'main' && 'true' || 'false' }}
      CAMBIO: ${{ fromJSON(needs.detectar-cambios.outputs.cambios)[matrix.imagen] }}
      IMAGE: ghcr.io/${{ needs.detectar-cambios.outputs.owner }}/caprichos-${{ matrix.imagen }}
      TAG: ${{ needs.validar-y-determinar.outputs.tag }}
      SHORT_SHA: ${{ needs.validar-y-determinar.outputs.short_sha }}
    strategy:
      fail-fast: true
      matrix:
        imagen: [api, web]
    steps:
      - name: Checkout del repositorio (el commit exacto a desplegar)
        if: env.CAMBIO == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validar-y-determinar.outputs.ref }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sin cambios en esta imagen: se re-etiqueta la del commit anterior (sin construir)
      - name: Re-etiquetar la imagen del commit anterior
        if: env.CAMBIO != 'true'
        env:
          BASE7: ${{ needs.detectar-cambios.outputs.base7 }}
        run: |
          docker buildx imagetools create -t "${IMAGE}:${TAG}" -t "${IMAGE}:${SHORT_SHA}" "${IMAGE}:${BASE7}"

      # Camino rápido (Trivy apagado): construir y publicar en un solo paso
      - name: Construir y publicar
        if: env.CAMBIO == 'true' && env.ESCANEAR_IMAGENES != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.imagen }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=${{ matrix.imagen }}
          cache-to: type=gha,scope=${{ matrix.imagen }},mode=max

      # Camino con escaneo (ESCANEAR_IMAGENES='true'): construir, escanear y publicar lo escaneado
      - name: Construir imagen para escaneo
        if: env.CAMBIO == 'true' && env.ESCANEAR_IMAGENES == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.imagen }}
          push: false
          load: true
          tags: |
            caprichos-${{ matrix.imagen }}:test
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=${{ matrix.imagen }}
          cache-to: type=gha,scope=${{ matrix.imagen }},mode=max

      - name: Escanear imagen con Trivy
        if: env.CAMBIO == 'true' && env.ESCANEAR_IMAGENES == 'true'
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          version: 'v0.75.0'
          image-ref: caprichos-${{ matrix.imagen }}:test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Publicar la imagen escaneada
        if: env.CAMBIO == 'true' && env.ESCANEAR_IMAGENES == 'true'
        run: |
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:${SHORT_SHA}" || true

  deploy-ssh:
    name: Despliegue por SSH en VPS
    needs: [validar-y-determinar, detectar-cambios, imagenes]
    if: needs.validar-y-determinar.outputs.accion == 'desplegar'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ needs.validar-y-determinar.outputs.ambiente }}
    concurrency:
      group: deploy-${{ needs.validar-y-determinar.outputs.ambiente }}
      cancel-in-progress: false
    steps:
      - name: Checkout (scripts y archivos compose de esta versión)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validar-y-determinar.outputs.ref }}
          sparse-checkout: infra/compose

      - name: Configurar llave y huella SSH (sin StrictHostKeyChecking=no)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          for v in SSH_KEY SSH_HOST SSH_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then
              echo "::error::Falta el secreto $v en GitHub (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sincronizar scripts y compose en el VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes ${SSH_USER:-deploy}@${SSH_HOST}"
          tar -czf - -C infra/compose scripts | $SSH 'mkdir -p /opt/caprichos && tar -xzf - -C /opt/caprichos && chmod +x /opt/caprichos/scripts/* /opt/caprichos/scripts/docker-rollout'
          tar -czf - -C infra/compose docker-compose.base.yml docker-compose.demo.yml docker-compose.staging.yml docker-compose.prod.yml | $SSH 'mkdir -p /opt/caprichos/compose && tar -xzf - -C /opt/caprichos/compose'

      - name: Ejecutar despliegue sin corte (rolling rollout) en el VPS vía SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          AMBIENTE: ${{ needs.validar-y-determinar.outputs.ambiente }}
          TAG: ${{ needs.validar-y-determinar.outputs.tag }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          echo "==> Desplegando [${AMBIENTE}] con la versión ${TAG} mediante rolling rollout (sin corte)..."
          # El token viaja por la entrada estándar: no queda en la línea de comandos ni en los procesos del servidor
          printf '%s' "$GHCR_READ_TOKEN" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${SSH_USER:-deploy}@${SSH_HOST}" \
            "IFS= read -r GHCR_READ_TOKEN; export GHCR_READ_TOKEN; /opt/caprichos/scripts/desplegar.sh '${AMBIENTE}' '${TAG}'"

      - name: Borrar la llave del ejecutor
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Registrar resumen del despliegue en Job Summary
        if: always()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Resumen de Despliegue por SSH — Caprichos

          | Parámetro | Detalle |
          |---|---|
          | **Ambiente** | `${{ needs.validar-y-determinar.outputs.ambiente }}` |
          | **Versión (Tag)** | `${{ needs.validar-y-determinar.outputs.tag }}` |
          | **Commit SHA** | `${{ github.sha }}` |
          | **Disparado por** | `@${{ github.actor }}` (`${{ github.event_name }}`) |
          | **Entorno GitHub** | `${{ needs.validar-y-determinar.outputs.ambiente }}` |
          | **Imágenes GHCR** | `ghcr.io/${{ needs.detectar-cambios.outputs.owner }}/caprichos-api:${{ needs.validar-y-determinar.outputs.tag }}` <br> `ghcr.io/${{ needs.detectar-cambios.outputs.owner }}/caprichos-web:${{ needs.validar-y-determinar.outputs.tag }}` |

          ### 🔒 Seguridad y Garantías del Proceso
          - **Aprobación deliberada de Producción:** Ejecución manual exclusiva por `workflow_dispatch` con confirmación literal y verificación de tag y commit en `main`.
          - **Despliegue sin corte (Rolling Rollout):** Despliegue con docker-rollout para api y web; el nuevo contenedor arranca junto al viejo, espera a estar sano antes de recibir tráfico de Traefik y se mantiene la versión previa si el nuevo falla.
          - **Migraciones aditivas (Expand/Contract):** Migraciones de base de datos ejecutadas en contenedor efímero antes del cambio, compatibles hacia atrás durante la convivencia de versiones.
          - **Arranque seguro:** Verificación de healthcheck posterior y vuelta atrás automática ante anomalías.
          - **SSH endurecido:** Autenticación por llave ed25519 dedicada y verificación de host fingerprint.
          EOF

  # Saneamiento manual de clientes/DNI de la DEMO (jamás producción). Solo con workflow_dispatch,
  # accion=sanear-demo, ambiente=demo, rama preprod y la confirmación literal (validada arriba).
  sanear-demo:
    name: Sanear clientes de la demo (manual)
    needs: validar-y-determinar
    if: needs.validar-y-determinar.outputs.accion == 'sanear-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
