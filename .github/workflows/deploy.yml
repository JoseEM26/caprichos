  # Guarda la clave de OpenWebNinja (secreto OPENWEBNINJA_API_KEY) en el .env del ambiente y redespliega con el mismo tag.
  # La clave viaja por la entrada estándar del ssh: no aparece en la línea de comandos ni en el log.
  configurar-resenas:
    name: Configurar reseñas de Google (clave OpenWebNinja)
    needs: validar-y-determinar
    if: needs.validar-y-determinar.outputs.accion == 'configurar-resenas'
    runs-on: ubuntu-latest
    timeout-minutes: 30
