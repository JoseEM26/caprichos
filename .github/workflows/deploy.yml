          CONSULTA: ${{ github.event.inputs.consulta_resenas }}
          REPETIR: ${{ github.event.inputs.repetir_resenas }}
        run: |
          set -o pipefail
          if [ "$REPETIR" = "true" ]; then SI_NO=si; else SI_NO=no; fi
          if [ "$AMBIENTE" = "prod" ]; then
            echo "::warning::Lo normal es NO cargar reseñas en producción; los datos de la empresa llegan con importar-datos-produccion. Se ejecuta porque se pidió."
          fi
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${SSH_USER:-deploy}@${SSH_HOST}" \
            "/opt/caprichos/scripts/cargar-resenas.sh '${AMBIENTE}' '${CONSULTA}' '${SI_NO}'" 2>&1 | tee resenas-carga.log

      - name: Resumen (salida del comando; sin secretos)
        if: always()
        run: |
