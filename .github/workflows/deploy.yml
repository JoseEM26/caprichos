          SUNAT_AMBIENTE_VALOR: ${{ secrets.SUNAT_AMBIENTE }}
          SUNAT_USUARIO_VALOR: ${{ secrets.SUNAT_SOL_USUARIO }}
          SUNAT_CLAVE_VALOR: ${{ secrets.SUNAT_SOL_CLAVE }}
          SUNAT_P12_VALOR: ${{ secrets.SUNAT_CERT_P12_B64 }}
          SUNAT_CLAVE_P12_VALOR: ${{ secrets.SUNAT_CERT_CLAVE }}
        run: |
          set -o pipefail
          faltan=""
          for v in SUNAT_AMBIENTE SUNAT_SOL_USUARIO SUNAT_SOL_CLAVE SUNAT_CERT_P12_B64 SUNAT_CERT_CLAVE; do
            case "$v" in
              SUNAT_AMBIENTE) valor="$SUNAT_AMBIENTE_VALOR" ;;
              SUNAT_SOL_USUARIO) valor="$SUNAT_USUARIO_VALOR" ;;
              SUNAT_SOL_CLAVE) valor="$SUNAT_CLAVE_VALOR" ;;
              SUNAT_CERT_P12_B64) valor="$SUNAT_P12_VALOR" ;;
              SUNAT_CERT_CLAVE) valor="$SUNAT_CLAVE_P12_VALOR" ;;
            esac
            if [ -z "$valor" ]; then faltan="$faltan $v"; fi
          done
          if [ -n "$faltan" ]; then
            echo "::error::Faltan los secretos:$faltan. Guárdelos con: gh secret set NOMBRE --repo JoseEM26/caprichos (pegue el valor y pulse Enter)."
            exit 1
          fi
          printf '%s\n%s\n%s\n%s\n%s\n' "$SUNAT_AMBIENTE_VALOR" "$SUNAT_USUARIO_VALOR" "$SUNAT_CLAVE_VALOR" "$SUNAT_P12_VALOR" "$SUNAT_CLAVE_P12_VALOR" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${SSH_USER:-deploy}@${SSH_HOST}" \
            "/opt/caprichos/scripts/configurar-sunat.sh '${AMBIENTE}'" 2>&1 | tee sunat.log

      - name: Resumen (sin secretos)
        if: always()
        run: |
          {
            echo "## Facturación electrónica (SUNAT directo)"
            echo ""
            echo '```'
            grep -E "^(== |SUNAT|TAG=|OK|ERROR|AVISO|Copia|Se restauró)" sunat.log || echo "(sin datos: revise el log del paso anterior)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Borrar la llave del ejecutor
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # Guarda la clave de Resend (avisos por correo) en el .env del ambiente y redespliega con el mismo tag.
  # La clave viaja por la entrada estándar del ssh: no aparece en la línea de comandos ni en el log.
  configurar-correo:
    name: Configurar correo de avisos (Resend)
    needs: validar-y-determinar
    if: needs.validar-y-determinar.outputs.accion == 'configurar-correo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ needs.validar-y-determinar.outputs.ambiente }}
    concurrency:
      group: configurar-correo
      cancel-in-progress: false
    steps:
      - name: Checkout (scripts del commit o del tag validado)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validar-y-determinar.outputs.ref }}
          sparse-checkout: infra/compose

      - name: Configurar llave y huella SSH (sin StrictHostKeyChecking=no)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          for v in SSH_KEY SSH_HOST SSH_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then
              echo "::error::Falta el secreto $v en GitHub (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sincronizar scripts en el VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes ${SSH_USER:-deploy}@${SSH_HOST}"
          tar -czf - -C infra/compose scripts | $SSH 'mkdir -p /opt/caprichos && tar -xzf - -C /opt/caprichos && chmod +x /opt/caprichos/scripts/*'

      - name: Guardar la clave de Resend y redesplegar (sin mostrar la clave)
        env:
