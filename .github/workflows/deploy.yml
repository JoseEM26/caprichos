  # Guarda los datos de WhatsApp (Meta) en el .env del ambiente y redespliega con el mismo tag.
  # Los valores viajan por la entrada estándar del ssh: no aparecen en la línea de comandos ni en el log.
  configurar-whatsapp:
    name: Configurar WhatsApp (webhook y número)
    needs: validar-y-determinar
    if: needs.validar-y-determinar.outputs.accion == 'configurar-whatsapp'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ needs.validar-y-determinar.outputs.ambiente }}
    concurrency:
      group: configurar-whatsapp
      cancel-in-progress: false
    steps:
      - name: Checkout (scripts del commit o del tag validado)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validar-y-determinar.outputs.ref }}
          sparse-checkout: infra/compose

      - name: Configurar llave y huella SSH (sin StrictHostKeyChecking=no)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          for v in SSH_KEY SSH_HOST SSH_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then
              echo "::error::Falta el secreto $v en GitHub (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sincronizar scripts en el VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes ${SSH_USER:-deploy}@${SSH_HOST}"
          tar -czf - -C infra/compose scripts | $SSH 'mkdir -p /opt/caprichos && tar -xzf - -C /opt/caprichos && chmod +x /opt/caprichos/scripts/*'

      - name: Guardar los datos de WhatsApp y redesplegar (sin mostrar valores)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          AMBIENTE: ${{ needs.validar-y-determinar.outputs.ambiente }}
          W_VERIFY: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          W_PHONE: ${{ secrets.WHATSAPP_PHONE_ID }}
          W_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          W_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
        run: |
          set -o pipefail
          # Por si algún valor llegara a imprimirse, GitHub lo oculta en el log
          for v in "$W_VERIFY" "$W_PHONE" "$W_TOKEN" "$W_SECRET"; do
            [ -n "$v" ] && echo "::add-mask::$v"
          done
          if [ -z "$W_VERIFY$W_PHONE$W_TOKEN$W_SECRET" ]; then
            echo "::error::No hay ningún secreto de WhatsApp en el entorno ${AMBIENTE}. Guárdelos con: gh secret set WHATSAPP_VERIFY_TOKEN --env ${AMBIENTE} --repo JoseEM26/caprichos (y lo mismo con WHATSAPP_PHONE_ID, WHATSAPP_TOKEN y WHATSAPP_APP_SECRET)"
            exit 1
          fi
          {
            [ -n "$W_VERIFY" ] && printf 'WHATSAPP_VERIFY_TOKEN=%s\n' "$W_VERIFY"
            [ -n "$W_PHONE" ]  && printf 'WHATSAPP_PHONE_ID=%s\n' "$W_PHONE"
            [ -n "$W_TOKEN" ]  && printf 'WHATSAPP_TOKEN=%s\n' "$W_TOKEN"
            [ -n "$W_SECRET" ] && printf 'WHATSAPP_APP_SECRET=%s\n' "$W_SECRET"
            true
          } | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${SSH_USER:-deploy}@${SSH_HOST}" \
            "/opt/caprichos/scripts/configurar-whatsapp.sh '${AMBIENTE}'" 2>&1 | tee whatsapp.log

      - name: Resumen (sin secretos)
        if: always()
        run: |
          {
            echo "## WhatsApp (webhook y número)"
            echo ""
            echo '```'
            grep -E "^(== |WHATSAPP_|TAG=|OK|ERROR|AVISO|Webhook|Copia|Se restauró)" whatsapp.log || echo "(sin datos: revise el log del paso anterior)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Borrar la llave del ejecutor
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # Carga inicial de reseñas: ejecuta en el contenedor de la API el comando resenas-carga-inicial (demo o prod).
