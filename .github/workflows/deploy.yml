          chmod 644 ~/.ssh/known_hosts

      - name: Subir scripts al VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes ${SSH_USER:-deploy}@${SSH_HOST}"
          tar -czf - -C infra/compose scripts | $SSH 'mkdir -p /opt/caprichos && tar -xzf - -C /opt/caprichos && chmod +x /opt/caprichos/scripts/*'

      - name: Programar respaldos (simulacro primero; real solo si se desmarcó simulacro)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SIMULACRO: ${{ github.event.inputs.simulacro }}
          RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          KUMA_PUSH_PROD: ${{ secrets.KUMA_PUSH_PROD }}
          KUMA_PUSH_DEMO: ${{ secrets.KUMA_PUSH_DEMO }}
        run: |
          set -o pipefail
          if [ "$SIMULACRO" = "false" ]; then MODO=real; else MODO=simulacro; fi
          {
            for v in RESTIC_REPOSITORY RESTIC_PASSWORD AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY KUMA_PUSH_PROD KUMA_PUSH_DEMO; do
              printf '%s=%s\n' "$v" "${!v}"
            done
          } | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${SSH_USER:-deploy}@${SSH_HOST}" \
            "/opt/caprichos/scripts/programar-respaldos.sh $MODO" 2>&1 | tee respaldos.log

      - name: Borrar la llave del ejecutor
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # Restaura el último respaldo en una base temporal aislada y cuenta filas clave. No toca la base real.
  probar-restauracion:
