  # Actualiza los middlewares dinámicos de Traefik (límite de intentos por usuario real). Simulacro por defecto.
  sincronizar-proxy:
    name: Sincronizar proxy (Traefik)
    needs: validar-y-determinar
    if: needs.validar-y-determinar.outputs.accion == 'sincronizar-proxy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: demo
    concurrency:
      group: sincronizar-proxy
      cancel-in-progress: false
    steps:
      - name: Checkout (configuración de esta versión)
        uses: actions/checkout@v4
        with:
          sparse-checkout: infra/compose

      - name: Validar los YAML del proxy
        run: python3 -c "import sys,yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('infra/compose/proxy/dynamic/*.yml')]; print('YAML correcto')"

      - name: Configurar llave y huella SSH (sin StrictHostKeyChecking=no)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          for v in SSH_KEY SSH_HOST SSH_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then
              echo "::error::Falta el secreto $v en GitHub (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Subir scripts y la configuración nueva al VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes ${SSH_USER:-deploy}@${SSH_HOST}"
          tar -czf - -C infra/compose scripts | $SSH 'mkdir -p /opt/caprichos && tar -xzf - -C /opt/caprichos && chmod +x /opt/caprichos/scripts/*'
          tar -czf - -C infra/compose/proxy dynamic | $SSH 'rm -rf /opt/caprichos/proxy-nuevo && mkdir -p /opt/caprichos/proxy-nuevo && tar -xzf - -C /opt/caprichos/proxy-nuevo'

      - name: Sincronizar proxy (simulacro primero; real solo si se desmarcó simulacro)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SIMULACRO: ${{ github.event.inputs.simulacro }}
        run: |
          set -o pipefail
          if [ "$SIMULACRO" = "false" ]; then MODO=real; else MODO=simulacro; fi
