  # Respaldos automáticos: cron (prod diario 3:00, demo domingo 4:00), copia cifrada en R2 y latido a Uptime Kuma.
  # Los secretos (opcionales) viven en el ambiente demo de GitHub y viajan por stdin; nunca se imprimen.
  programar-respaldos:
    name: Programar respaldos
    needs: validar-y-determinar
    if: needs.validar-y-determinar.outputs.accion == 'programar-respaldos'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: demo
    concurrency:
      group: programar-respaldos
      cancel-in-progress: false
    steps:
      - name: Checkout (scripts de esta versión)
        uses: actions/checkout@v4
        with:
          sparse-checkout: infra/compose

      - name: Configurar llave y huella SSH (sin StrictHostKeyChecking=no)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          for v in SSH_KEY SSH_HOST SSH_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then
              echo "::error::Falta el secreto $v en GitHub (Settings > Secrets and variables > Actions)."
              exit 1
            fi
