name: Deploy Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Publicar en pruebas (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Obtener propietario del repositorio en minúsculas para GHCR
        id: repo-owner
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen API en GHCR (Staging)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/caprichos-api:staging
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/caprichos-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir y publicar imagen Web en GHCR (Staging)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/caprichos-web:staging
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/caprichos-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Disparar publicación en Dokploy (Webhook Staging)
        run: |
          if [ -z "${{ secrets.DOKPLOY_STAGING_WEBHOOK_URL }}" ]; then
            echo "::error::El secreto DOKPLOY_STAGING_WEBHOOK_URL no está configurado en GitHub Secrets."
            exit 1
          fi

          echo "Disparando webhook de Dokploy para el ambiente de pruebas (staging)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.DOKPLOY_STAGING_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"branch\": \"main\", \"commit\": \"${{ github.sha }}\", \"actor\": \"${{ github.actor }}\"}")

          echo "Respuesta del webhook de Dokploy: HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Publicación en pruebas disparada exitosamente en Dokploy."
          else
            echo "::error::Fallo al disparar webhook en Dokploy. Código de respuesta: HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Registrar auditoría de publicación
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### 🚀 Publicación en Pruebas (Staging) disparada exitosamente (RQ-PLA-01-05)
          - **Commit**: `${{ github.sha }}`
          - **Autor**: `${{ github.actor }}`
          - **Imágenes en GHCR**:
            - `ghcr.io/${{ steps.repo-owner.outputs.owner }}/caprichos-api:staging`
            - `ghcr.io/${{ steps.repo-owner.outputs.owner }}/caprichos-web:staging`
          - **URL de pruebas**: [https://staging.caprichos.pe](https://staging.caprichos.pe)
          - **Verificación de versión**: [https://staging.caprichos.pe/version](https://staging.caprichos.pe/version)
          EOF
