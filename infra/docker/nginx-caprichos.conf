# SEO: solo caprichos.pe (y www) se indexa; cualquier otro host (demo, staging, admin.*) queda cerrado.
# Se decide por el Host que llega al nginx (Traefik/Cloudflare lo conservan); misma imagen en todos los ambientes.
map $host $robots_host {
    default            cerrado;
    caprichos.pe       abierto;
    www.caprichos.pe   abierto;
}

# Cabecera X-Robots-Tag: en host cerrado, siempre; en caprichos.pe, solo rutas privadas.
# Se usa $request_uri (no $uri: try_files lo reescribe a /index.html).
map "$robots_host:$request_uri" $x_robots {
    default "";
    ~^cerrado: "noindex, nofollow, noarchive";
    ~^abierto:/(admin|pantalla|asistencia|seguimiento|api)(/|\?|$) "noindex, nofollow, noarchive";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para alto rendimiento
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Cabeceras de seguridad HTTP (la demo las sirve nginx; Traefik solo enruta)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
    add_header X-Robots-Tag $x_robots always;

    # robots.txt y sitemap por host (archivos en /usr/share/nginx/seo)
    location = /robots.txt {
        root /usr/share/nginx/seo;
        default_type text/plain;
        rewrite ^ /robots-$robots_host.txt break;
    }

    location = /sitemap.xml {
        if ($robots_host = cerrado) { return 404; }
        root /usr/share/nginx/seo;
        default_type application/xml;
    }

    # Aviso discreto de versión de demostración
    location = /demo {
        try_files /demo.html =404;
    }

    # Enrutamiento de Single Page Application (SPA / React)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché inmutable para activos estáticos con hash de Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # PWA: el service worker se pide siempre al servidor (sin caché del navegador)
    # para que un despliegue nuevo se aplique. try_files sin index.html: un archivo que falta da 404.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest-admin.webmanifest {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Íconos de la app instalable: archivos reales o 404, nunca index.html
    location ^~ /icons/ {
        try_files $uri =404;
        expires 7d;
    }

    # Endpoint de verificación de salud para Dokploy y Uptime Kuma
    location /salud {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","app":"caprichos-web"}';
    }
}
