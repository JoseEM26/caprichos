server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para alto rendimiento
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Cabeceras de seguridad HTTP (la demo las sirve nginx; Traefik solo enruta)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # La demo no se indexa en buscadores
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Aviso discreto de versión de demostración
    location = /demo {
        try_files /demo.html =404;
    }

    # Enrutamiento de Single Page Application (SPA / React)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché inmutable para activos estáticos con hash de Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Endpoint de verificación de salud para Dokploy y Uptime Kuma
    location /salud {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","app":"caprichos-web"}';
    }
}
