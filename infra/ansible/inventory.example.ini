# ==============================================================================
# Inventario de ejemplo para el despliegue del VPS de Caprichos (Lima, Perú)
# ==============================================================================
# NOTA DE SEGURIDAD:
# No coloques IPs públicas reales ni llaves privadas en este archivo.
# Para desplegar en un servidor real, copia este archivo:
#   cp inventory.example.ini inventory.ini
# y reemplaza los valores de ejemplo con la IP real y la ruta a tu llave SSH.
# ==============================================================================

[vps]
vps-caprichos-prod ansible_host=203.0.113.10 ansible_user=deploy ansible_ssh_private_key_file=~/.ssh/id_ed25519

[prod]
vps-caprichos-prod

[all:vars]
ansible_python_interpreter=/usr/bin/python3
