---
# ==============================================================================
# Rol: docker
# Propósito: Instalar Docker CE oficial y plugins compose/buildx
# Ref: ADR-011, DT-30, DT-40
# ==============================================================================

- name: Instalar paquetes necesarios para configurar repositorios HTTPS
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Asegurar existencia del directorio de keyrings de apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Descargar llave GPG oficial de Docker
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/ubuntu/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
    force: false

- name: Configurar repositorio oficial de Docker CE
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ('arm64' if ansible_architecture == 'aarch64' else 'amd64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Instalar paquetes Docker CE, CLI, containerd y plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Agregar al grupo docker el usuario {{ deploy_user }}
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true

- name: Asegurar que el servicio Docker esté iniciado y habilitado
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
