---
# ==============================================================================
# Rol: parches
# Propósito: Configurar actualizaciones automáticas de seguridad (unattended-upgrades)
# Ref: DT-40, DT-47, FT-PLA-05
# ==============================================================================

- name: Instalar paquetes para parches automáticos
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present

- name: Configurar frecuencia de actualización periódica en /etc/apt/apt.conf.d/20auto-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";
  notify: Reiniciar servicio unattended-upgrades

- name: Configurar política de parches de seguridad en /etc/apt/apt.conf.d/50unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Package-Blacklist {
      };
      Unattended-Upgrade::AutoFixInterruptedDpkg "true";
      Unattended-Upgrade::MinimalSteps "true";
      Unattended-Upgrade::InstallOnShutdown "false";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "{{ 'true' if unattended_automatic_reboot else 'false' }}";
      Unattended-Upgrade::Automatic-Reboot-Time "{{ unattended_reboot_time }}";
  notify: Reiniciar servicio unattended-upgrades

- name: Habilitar y arrancar el servicio unattended-upgrades
  ansible.builtin.service:
    name: unattended-upgrades
    state: started
    enabled: true
