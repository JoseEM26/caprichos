# ==============================================================================
# Configuración dinámica de certificados TLS (Opcional / Certificado de Origen)
# ==============================================================================
# Si se utiliza Cloudflare en modo Full (Strict) con Certificado de Origen
# de Cloudflare (ADR-011 / RB-CAP-004), coloque los archivos en ./certs:
#   - certs/caprichos_origin_cert.pem
#   - certs/caprichos_origin_key.pem
#
# Y descomente el bloque siguiente:
#
# tls:
#   certificates:
#     - certFile: /etc/traefik/certs/caprichos_origin_cert.pem
#       keyFile: /etc/traefik/certs/caprichos_origin_key.pem
#       stores:
#         - default
#
# Si este bloque permanece comentado, Traefik utilizará automáticamente
# el certResolver 'letsencrypt' definido en traefik.yml.
# ==============================================================================
tls:
  options:
    default:
      minVersion: "VersionTLS12"
      cipherSuites:
        - "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256"
        - "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"
        - "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
        - "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384"
        - "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305"
        - "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305"
