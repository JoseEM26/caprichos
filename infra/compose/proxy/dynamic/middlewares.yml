# ==============================================================================
# Middlewares dinámicos de Traefik para Caprichos
# ==============================================================================

http:
  middlewares:
    # Cabeceras de seguridad para Producción (indexable)
    sec-headers-prod:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        browserXssFilter: true
        frameDeny: false
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "camera=(self), microphone=(), geolocation=(self)"

    # Cabeceras de seguridad para Demo y Staging (bloquea indexación de buscadores)
    sec-headers-demo:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        browserXssFilter: true
        frameDeny: false
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow, noarchive"

    # Rate limiting para endpoint de autenticación (/auth/ingresar)
    # El contador es por usuario real: detrás de Cloudflare, la IP de la conexión es la del nodo de Cloudflare
    # y agruparía a todos los clientes de ese nodo. Cloudflare agrega la IP del usuario al final de X-Forwarded-For.
    rate-limit-login:
      rateLimit:
        average: 10
        burst: 20
        period: "1s"
        sourceCriterion:
          ipStrategy:
            depth: 1

    # Rate limiting general para rutas públicas
    rate-limit-public:
      rateLimit:
        average: 60
        burst: 100
        period: "1s"
        sourceCriterion:
          ipStrategy:
            depth: 1

    # Compresión gzip/brotli
    compress-resp:
      compress: {}

    # Eliminación de prefijo /api para compatibilidad
    strip-api-prefix:
      stripPrefix:
        prefixes:
          - "/api"
