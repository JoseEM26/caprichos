# ==============================================================================
# Caprichos — Docker Compose Base Común
# ==============================================================================
# Definición base compartida para los ambientes (demo, staging, prod).
# Establece:
# - Límites de recursos (memoria).
# - Políticas de reinicio.
# - Healthchecks formales para cada componente.
# - Aislamiento estricto de red: postgres y redis solo en red interna, sin puertos publicados.
# - Red perimetral para exposición mediante el proxy Traefik autónomo.
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-postgres}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - red_interna

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - red_interna

  api:
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/salud || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/data/uploads
      # .exe del programa de impresión que sube el workflow agente-windows (la API lo sirve en /api/agente-impresion/descargar/windows)
      - ${DESCARGAS_DIR:-/home/deploy/caprichos-descargas}:/data/descargas:ro
    networks:
      - red_interna
      - caprichos-proxy-net

  web:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/salud || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - red_interna
      - caprichos-proxy-net

networks:
  red_interna:
    driver: bridge
    internal: true
  caprichos-proxy-net:
    name: caprichos-proxy-net
    external: true
