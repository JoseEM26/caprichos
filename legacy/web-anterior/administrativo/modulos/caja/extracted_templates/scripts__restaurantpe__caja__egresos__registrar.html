quien.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> </div> </div> <div class="col-sm-6"> <div class="form-group"> <label class="control-label">Monto</label> <div class="input-group" ng-class="{\'has-error\': !vm.egreso.egreso_monto && form.$dirty}"> <div class="input-group-btn"> <button type="button" class="btn btn-default dropdown-toggle" data-toggle="dropdown" ng-disabled="vm.egreso.debitoList"> {{vm.monedaSeleccionada.moneda_simbolo}} <span class="caret"></span></button> <ul class="dropdown-menu"> <li ng-repeat="moneda in vm.monedaList" ng-click="vm.seleccionarMoneda(moneda)"><a href="">{{moneda.moneda_simbolo}} {{moneda.moneda_descripcion}}</a></li> </ul> </div> <input solo-numeros type="text" class="form-control" name="egreso_monto" ng-disabled="vm.egreso.debitoList" ng-model="vm.egreso.egreso_monto" required> <div ng-if="form.egreso_monto.$dirty" ng-messages="form.egreso_monto.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> </div> </div> </div> </div> <div class="float-e-margins"> <button class="btn btn-primary" id="btnRegistrar" ladda="btnCargandoGuardar" ng-disabled="form.$invalid" ng-click="vm.fnAgregar()"> <i class="fa fa-save"></i> Guardar </button> <a class="btn btn-default" ui-sref="caja.egresos">Cancelar</a> </div> </ng-form> </div> </div>
