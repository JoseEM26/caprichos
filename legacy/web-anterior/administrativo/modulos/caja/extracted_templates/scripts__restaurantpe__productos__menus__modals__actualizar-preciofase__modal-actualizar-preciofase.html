<div class="ibox no-margins"> <div class="ibox-title"> <h5>Fase {{vm.fasesmenu.fasesmenu_descripcion}}</h5> </div> <div class="ibox-content"> <p class="m-b"><em>Actualizar todos los precios de los productos de esta fase.</em></p> <ng-form name="form"> <div class="form-group" ng-class="{\'has-error\': !vm.fasesmenu.precioactualizar && form.$dirty}"> <label for="" class="control-label">Precio a actualizar</label> <input type="text" class="form-control" name="precioactualizar" colocar-focus solo-numeros decimal-cantidad="2" required ng-model="vm.fasesmenu.precioactualizar"> <div ng-if="form.precioactualizar.$dirty" ng-messages="form.precioactualizar.$error"> <div class="help-block" ng-message="required">Campo requerido </div> </div> </div> </ng-form> <div class="text-right"> <button class="btn btn-default" type="button" ng-click="vm.fnCancel()">Cancelar</button> <button class="btn btn-primary ladda-button" ladda="vm.btnCargandoGuardar" data-style="expand-left" ng-click="vm.fnGuardar()" ng-disabled="form.$invalid" type="none"> <i class="fa fa-save"></i> Guardar </button> </div> </div> </div>
