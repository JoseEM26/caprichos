<div class="ibox"> <div class="ibox-title"> <h5>Registrar ingreso extra</h5> </div> <div class="ibox-content"> <ng-form name="form "> <div class="row"> <div class="col-sm-12"> <div class="form-group"> <label class="control-label">Categoria</label> <div class="input-group" ng-class="{\'has-error\': !vm.ingreso.categoriaingreso_id && form.$dirty}"> <select ng-if="vm.listaCategoriasIngresos.length" ng-options="item.categoriaingreso_id as item.categoriaingreso_descripcion for item in vm.listaCategoriasIngresos" class="form-control" name="categoriaingreso_id" ng-model="vm.ingreso.categoriaingreso_id" required> </select> <p class="form-control-static" ng-if="!vm.listaCategoriasIngresos.length">No hay categorias registradas.</p> <span class="input-group-btn"> <button type="button" class="btn btn-primary" ng-click="vm.fnAbrirModalCategorias()"> <i class="fa fa-plus-circle"></i> Categorias </button> </span> </div> </div> </div> </div> <div class="row"> <div class="col-sm-12"> <div class="form-group" ng-class="{\'has-error\': !vm.ingreso.ingreso_motivo && form.$dirty}"> <label class="control-label">Motivo</label> <textarea class="form-control" name="ingreso_motivo" id="" rows="1" msd-elastic ng-model="vm.ingreso.ingreso_motivo" required></textarea> <div ng-if="form.ingreso_motivo.$dirty" ng-messages="form.ingreso_motivo.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> </div> </div> </div> <div class="row"> <div class="col-sm-6"> <div class="form-group" ng-class="{\'has-error\': !vm.ingreso.ingreso_aquien && form.$dirty}"> <label class="control-label">Recibido de</label> <input type="text" autocomplete="off" class="form-control" name="ingreso_aquien" ng-model="vm.ingreso.ingreso_aquien" required> <div ng-if="form.ingreso_aquien.$dirty" ng-messages="form.ingreso_aquien.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> </div> </div> <div class="col-sm-6"> <div class="form-group"> <label class="control-label">Monto</label> <div class="input-group" ng-class="{\'has-error\': !vm.ingreso.ingreso_monto && form.$dirty}"> <div class="input-group-btn"> <button type="button" class="btn btn-default dropdown-toggle" data-toggle="dropdown">{{vm.monedaSeleccionada.moneda_simbolo}} <span class="caret"></span></button> <ul class="dropdown-menu"> <li ng-repeat="moneda in vm.monedaList" ng-click="vm.seleccionarMoneda(moneda)"><a href="">{{moneda.moneda_simbolo}} {{moneda.moneda_descripcion}}</a></li> </ul> </div> <input solo-numeros type="text" class="form-control" name="ingreso_monto" ng-model="vm.ingreso.ingreso_monto" required> <div ng-if="form.ingreso_monto.$dirty" ng-messages="form.ingreso_monto.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> </div> </div> </div> </div> <div class="float-e-margins"> <button class="btn btn-primary" id="btnRegistrar" ladda="btnCargandoGuardar" ng-disabled="form.$invalid" ng-click="vm.fnAgregar()"> <i class="fa fa-save"></i> Guardar </button> <a class="btn btn-default" ui-sref="caja.ingresos">Cancelar</a> </div> </ng-form> </div> </div>
