<div class="ibox"> <div class="ibox-title"> <h5>Registrar ingreso extra</h5> </div> <div class="ibox-content"> <ng-form name="form "> <div class="row"> <div class="col-md-12"> <div class="form-inline my-input"> <div class="form-group"> <label class="control-label">Cliente:</label> </div> <div class="input-group customer-finder"> <ui-select class="customer-selector text-bold" ng-model="vm.ingreso.cliente" theme="bootstrap" tagging="vm.customerTransform" on-select="vm.fnSeleccionarCliente($item)" required> <ui-select-match placeholder="Buscar cliente"> <strong>{{$select.selected.getTipoAndDocumento()}}</strong> - {{$select.selected.getNombres()}} </ui-select-match> <ui-select-choices refresh="vm.buscarClientes($select.search)" refresh-delay="0" repeat="item in vm.clientes | propsFilter: {cliente_telefono:$select.search,cliente_dniruc: $select.search, cliente_nombres: $select.search,cliente_apellidos: $select.search,_cliente_nombres:$select.search,nombreapellido:$select.search}"> <div ng-if="!(item.cliente_id*1>0)" ng-bind-html="$select.search +\' <small>Añadir nuevo cliente</small>\'| highlight: $select.search"></div> <div ng-if="item.cliente_id*1>0" ng-bind-html="item.getCliente_dniruc()+\' \'+ item.getNombres()+\' \'+ item.getCliente_telefono() | highlight: $select.search"></div> </ui-select-choices> </ui-select> <span class="input-group-btn"> <button ng-click="vm.ingreso.cliente = undefined" class="btn btn-default"> <span class="fa fa-close"></span> </button> </span> </div> </div> </div> </div> <div class="row"> <div class="col-sm-12"> <div class="form-group" ng-class="{\'has-error\': !vm.ingreso.ingreso_motivo && form.$dirty}"> <label class="control-label">Motivo</label> <textarea class="form-control" name="ingreso_motivo" id="" rows="1" msd-elastic ng-model="vm.ingreso.ingreso_motivo" required></textarea> <div ng-if="form.ingreso_motivo.$dirty" ng-messages="form.ingreso_motivo.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> </div> </div> </div> <div class="row"> <div class="col-sm-4"> <div class="form-group"> <label class="control-label">Monto</label> <div class="input-group" ng-class="{\'has-error\': !vm.ingreso.tarjeta_efectivo && form.$dirty}"> <select type="text" class="form-control" name="tarjeta_efectivo" ng-model="vm.ingreso.tarjeta_efectivo" ng-change="vm.seleccionarEfectivoTarjeta()" required> <option value="1">Efectivo</option> <option value="2">Tarjeta</option> </select> </div> </div> </div> <div class="col-sm-8"> <div class="form-group"> <label class="control-label">Monto</label> <div class="input-group" ng-class="{\'has-error\': !vm.ingreso.ingreso_monto && form.$dirty}"> <div class="input-group-btn" ng-if="vm.ingreso.tarjeta_efectivo==\'1\'"> <button type="button" class="btn btn-default dropdown-toggle" data-toggle="dropdown">{{vm.monedaSeleccionada.moneda_simbolo}} <span class="caret"></span></button> <ul class="dropdown-menu"> <li ng-repeat="moneda in vm.monedaList" ng-click="vm.seleccionarMoneda(moneda)"><a href="">{{moneda.moneda_simbolo}} {{moneda.moneda_descripcion}}</a></li> </ul> </div> <div class="input-group-btn" ng-if="vm.ingreso.tarjeta_efectivo==\'2\'"> <button type="button" class="btn btn-default dropdown-toggle" data-toggle="dropdown">{{vm.tarjetaSeleccionada.tarjeta_descripcion}} <span class="caret"></span></button> <ul class="dropdown-menu"> <li ng-repeat="tarjeta in vm.tarjetaList" ng-click="vm.seleccionarTarjeta(tarjeta)"><a href="">{{tarjeta.tarjeta_descripcion}}</a></li> </ul> </div> <input solo-numeros type="text" class="form-control" name="ingreso_monto" ng-model="vm.ingreso.ingreso_monto" required> <div ng-if="form.ingreso_monto.$dirty" ng-messages="form.ingreso_monto.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> </div> </div> </div> </div> <div class="float-e-margins"> <button class="btn btn-primary" id="btnRegistrar" ladda="btnCargandoGuardar" ng-disabled="form.$invalid" ng-click="vm.fnAgregar()"> <i class="fa fa-save"></i> Guardar </button> <a class="btn btn-default" ui-sref="caja.ingresos">Cancelar</a> </div> </ng-form> </div> </div>
