<form name="frmAlmacen"> <div class="modal-header"> <h4 class="modal-title"><i class="fa fa-print"></i> Seleccionar una impresora</h4> </div> <ng-form name="form"> <div class="modal-body"> <div class="form-group"> <label class="control-label">Impresora</label> <ui-select ng-model="vm.impresoraSeleccionada" theme="bootstrap" search-enabled="false"> <ui-select-match placeholder="Impresora"> Impresora: <strong>{{$select.selected.impresora_nombre}}</strong> </ui-select-match> <ui-select-choices repeat="item in vm.impresoraList | filter: $select.search"> <div ng-bind-html="item.impresora_nombre | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> </div> <div class="modal-footer"> <button class="btn btn-default" type="button" ng-click="vm.cerrarModal()">Cancelar</button> <button ng-disabled="form.$invalid" class="btn btn-primary" ng-click="vm.fnReimprimir()"><i class="fa fa-print"></i> Imprimir</button> </div> </ng-form> </form>
