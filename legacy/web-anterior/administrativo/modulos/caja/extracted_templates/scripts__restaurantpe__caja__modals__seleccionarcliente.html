<div class="modal-header"> <h3 class="modal-title">Seleccionar cliente</h3> </div> <div class="modal-body"> <div class="alert alert-warning" role="alert"> <strong>NO</strong> es posible emitir una nota de crédito para un cliente <strong>CONSUMIDOR FINAL</strong>. Para continuar, debes seleccionar un cliente válido. </div> <div class="row"> <div class="col-sm-12"> <div class="input-group customer-finder w-full"> <ui-select class="customer-selector" ng-model="vm.clienteSeleccionado" theme="bootstrap" on-select="vm.fnSeleccionarCliente($item)"> <ui-select-match placeholder="Buscar cliente..."> <strong>{{$select.selected.getAnyTipoDocumento()}}: {{$select.selected.cliente_dniruc}}</strong> {{$select.selected.cliente_nombres}} </ui-select-match> <ui-select-choices refresh="vm.buscarClientes($select.search)" refresh-delay="0" repeat="item in vm.clientes | filter: $select.search"> <div style="line-height:normal!important" ng-bind-html="\'<strong>\' + item.getAnyTipoDocumento() + \': \' + item.getCliente_dniruc() + \'</strong><br>\' + item.getNombres() | highlight: $select.search"></div> </ui-select-choices> </ui-select> <span class="input-group-btn"> <button class="btn btn-success" type="button" ng-disabled="!vm.clienteSeleccionado" ng-click="vm.fnEditarCliente()"> <i class="fa fa-edit"></i> </button> </span> <span class="input-group-btn"> <button class="btn btn-primary" type="button" ng-click="vm.fnNuevoCliente(null)"> <i class="fa fa-plus"></i> Nuevo </button> </span> </div> </div> </div> </div> <div class="modal-footer"> <button class="btn btn-default" ng-click="$dismiss()">Cancelar</button> <button class="btn btn-primary" ng-disabled="!vm.clienteSeleccionado" ng-click="$close(vm.clienteSeleccionado)"> Continuar </button> </div>
