 <div class="full-height" ng-controller="UnirmesasCtrl as vm"> <div class="col-sm-8 p-t p-b full-height overflow-y-auto" ng-include="\'scripts/restaurantpe/caja/modals/demanda-salones.html\'"></div> <div class="col-sm-4 p-t p-b full-height"> <div class="ibox full-height m-n"> <div class="ibox-content full-height overflow-y-auto"> <div ng-if="vm.cantidadPedidosSeleccionados != 0"> <p><strong>Mesas seleccionadas:</strong></p> <div class="panel panel-default" ng-repeat="mesa in vm.mesasSeleccionadas"> <div class="panel-heading">Mesa {{mesa.mesa_descripcion}}</div> <div class="panel-body"> <p><strong>Salón {{mesa.salon.salon_descripcion}}</strong></p> <p>{{mesa.mesa_cantidadpedidos}} pedidos</p> <button class="btn btn-primary btn-block" ng-if="vm.mesasSeleccionadas.length>1" ng-click="vm.validacionUnirMesa(mesa)" ladda="vm.loadingUnirMesas"> <i class="fa fa-compress"></i> Unir todas a esta mesa </button> <button class="btn btn-success btn-block" ng-if="mesa.tieneSubmesas()" ng-click="vm.fnDesunir(mesa)" ladda="vm.loadingDesunirMesas"> <i class="fa fa-expand"></i> Desunir mesas </button> <button class="btn btn-danger btn-block" ng-click="vm.fnSeleccionarMesa(mesa,mesa.salon)">Deseleccionar</button> </div> </div> </div> <div ng-if="vm.cantidadPedidosSeleccionados == 0" class="panel panel-transparent panel-dashed tip-sales text-center"> <h2 class="m-t-none">Escoge las mesas</h2> <p>Selecciona por lo menos dos mesas para poder unirlas.</p> </div> </div> </div> </div> </div>
