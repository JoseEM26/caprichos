<form name="frmAlmacen"> <div class="modal-header"> <h4 class="modal-title"><i class="fa fa-print"></i> Seleccionar una impresora</h4> </div> <ng-form name="form"> <div class="modal-body"> <div class="form-group"> <label class="control-label">Impresora</label> <ui-select ng-model="vm.impresoraSeleccionada" theme="bootstrap" search-enabled="false"> <ui-select-match placeholder="Impresora"> Impresora: <strong>{{$select.selected.impresora_nombre}}</strong> </ui-select-match> <ui-select-choices repeat="item in vm.impresoraList | filter: $select.search"> <div ng-bind-html="item.impresora_nombre | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> <div class="form-group" ng-if="vm.imprimirproductos == \'1\'"> <label class="control-label">Ordenar por</label> <ui-select ng-model="vm.ordenSeleccionado" theme="bootstrap" search-enabled="false"> <ui-select-match placeholder="Orden"> Por: <strong>{{$select.selected.order}}</strong> </ui-select-match> <ui-select-choices repeat="item in vm.ordenSeleccion | filter: $select.search"> <div ng-bind-html="item.order | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> <div class="flex-col" ng-if="vm.mostrarOpciones"> <div class="form-group"> <div class="checkbox is-icheck"> <label> <input type="checkbox" icheck ng-model="vm.excluirNotasDeVenta" ng-true-value="\'1\'" ng-false-value="\'0\'"> Excluir las notas de venta </label> </div> </div> <div class="form-group"> <div class="checkbox is-icheck"> <label> <input type="checkbox" icheck ng-model="vm.imprimirventas" ng-true-value="\'1\'" ng-false-value="\'0\'"> Imprimir lista ventas </label> </div> </div> <div class="form-group"> <div class="checkbox is-icheck"> <label> <input type="checkbox" icheck ng-model="vm.imprimirproductos" ng-true-value="\'1\'" ng-false-value="\'0\'"> Imprimir consolidado de productos vendidos </label> </div> </div> <div class="form-group"> <div class="checkbox is-icheck"> <label> <input type="checkbox" icheck ng-model="vm.imprimirmodificadores" ng-true-value="\'1\'" ng-false-value="\'0\'"> Imprimir consolidado de modificadores vendidos </label> </div> </div> <div class="form-group"> <div class="checkbox is-icheck"> <label> <input type="checkbox" icheck ng-model="vm.excluirVentasPorUsuario" ng-true-value="\'1\'" ng-false-value="\'0\'"> Excluir ventas por usuario </label> </div> </div> <div class="form-group"> <div class="checkbox is-icheck"> <label> <input type="checkbox" icheck ng-model="vm.excluirVentasPorArea" ng-true-value="\'1\'" ng-false-value="\'0\'"> Excluir ventas por área de producción </label> </div> </div> <div class="form-group"> <div class="checkbox is-icheck"> <label> <input type="checkbox" icheck ng-model="vm.excluirCuponesDeDescuento" ng-true-value="\'1\'" ng-false-value="\'0\'"> Excluir cupones de descuento </label> </div> </div> <div class="form-group"> <div class="checkbox is-icheck"> <label> <input type="checkbox" icheck ng-model="vm.imprimirDetallesVentasPorMarca" ng-true-value="\'1\'" ng-false-value="\'0\'"> Imprimir detalles de marca </label> </div> </div> <div class="form-group"> <div class="checkbox is-icheck"> <label> <input type="checkbox" icheck ng-model="vm.imprimirDetallePropina" ng-true-value="\'1\'" ng-false-value="\'0\'"> Imprimir detalles de propina </label> </div> </div> </div> </div> <div class="modal-footer"> <button class="btn btn-default" type="button" ng-click="vm.cerrarModal()">Cancelar</button> <button ng-disabled="form.$invalid" class="btn btn-primary" ng-click="vm.imprimirResumenCaja()"><i class="fa fa-print"></i> Imprimir resumen</button> </div> </ng-form> </form>
