<div class="page-heading row text-right p-t-none fadeInDown"> <div class="wrapper page-heading-inner p-t-sm p-b-sm"> </div> </div> <div class="wrapper wrapper-content animated fadeIn"> <div class="ibox"> <div class="ibox-title"> <div class="ibox-title-buttons pull-right"> <button class="btn btn-success ladda-button" ng-click="vm.fnObtenerProductosConPrecioPLP()" data-style="expand-left" ladda="vm.btnCargando"> <i class="fa fa-refresh"></i> Generar informe <span ng-if="vm.totalRegistros > 0 && vm.lista.length < vm.totalRegistros"> {{vm.lista.length}}/{{vm.totalRegistros}}</span> </button> </div> <h5>Productos con precio</h5> </div> <div class="ibox-content"> <div class="row m-b"> <div class="col-sm-4 pull-right"> <div class="input-group customer-finder"> <input class="form-control" ng-model="vm.valBusqueda" placeholder="Filtrar o buscar un producto" ng-change="vm.fnBuscarProductosConPrecioPLP()"> <span class="input-group-btn"> <button ng-click="vm.valBusqueda = \'\'; vm.fnBuscarProductosConPrecioPLP();" class="btn btn-default"> <span class="fa fa-close"></span> </button> </span> </div> </div> </div> <div class="table-responsive restloader-remote-el"> <table class="table table-hover table-text-13 table-striped table-middle"> <thead> <tr> <th class="text-left">ID</th> <th class="text-left">Codigo</th> <th class="text-left">Producto</th> <th class="text-left">Precio</th> </tr> </thead> <tbody> <tr ng-repeat="v in vm.filteredList | limitTo: vm.itemsPerPage : ((vm.currentPage - 1) * vm.itemsPerPage)"> <td class="text-left">{{v.producto_id}}</td> <td class="text-left">{{v.producto_codigo}}</td> <td class="text-left">{{v.producto_descripcion}}</td> <td class="text-right">{{Utility.getSimboloMoneda()}} {{v.producto_precio | roundPriceFinanzasFilter}}</td> </tr> <tr ng-hide="vm.filteredList.length != 0"> <td colspan="10"> <em> <span>No hay resultados</span> </em> </td> </tr> </tbody> </table> </div> <nav class="b-t-gray-l1 text-right" ng-if="vm.filteredList.length > 0"> <uib-
