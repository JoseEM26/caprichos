<div class="ibox ng-scope m-b-none"> <div class="ibox-title"> <h5 class=""><i class="fa fa-ticket"></i> Buscar debitos por cliente</h5> </div> <div class="ibox-content"> <div class="row p-t-sm"> <div class="col-md-12"> <div class="form-group"> <label class="control-label" uib-tooltip="Selecciona el tipo de vale que vas a usar"> Selecciona un cliente <i class="icon-help"></i> </label> <div class="input-group customer-finder"> <ui-select class="customer-selector text-bold" ng-model="vm.cliente" theme="bootstrap" tagging="vm.customerTransform" on-select="vm.fnSeleccionarCliente($item)" ng-required="vm.venta.venta_tipodoc==\'Factura\'"> <ui-select-match placeholder="Público general"> <strong>{{$select.selected.getTipoAndDocumento()}}</strong> - {{$select.selected.getNombres()}} </ui-select-match> <ui-select-choices refresh="vm.buscarClientes($select.search)" refresh-delay="0" repeat="item in vm.clientes | propsFilter: {cliente_telefono:$select.search,cliente_dniruc: $select.search, cliente_nombres: $select.search,cliente_apellidos: $select.search,_cliente_nombres:$select.search,nombreapellido:$select.search}"> <div ng-if="item.cliente_id != 0" ng-bind-html="item.getCliente_dniruc()+\' \'+ item.getNombres()+\' \'+ item.getCliente_telefono() | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> </div> </div> </div> <div rest-loader-model="vm.cargando" ng-class="{\'is-loading\': vm.cargando}"></div> <div class="row restloader-remote-el" ng-class="{\'is-loading\': vm.cargando}"> <div class="col-md-12"> <div class="payment-cards"> <p> <strong> Lista de debitos del cliente. <label class="text-danger" ng-hide="vm.listaDebitosclienteDisponible.length>0"><em>(La lista se encuentra vacía)</em></label> <i class="icon-help fa fa-question-circle"></i> </strong> </p> <table class="table table-striped table-hover table-middle" ng-show="vm.listaDebitosclienteDisponible.length>0"> <thead> <tr> <th>#</th> <th class="text-right">Monto disponible</th> <th class="text-right">Monto a usar</th> <th class="text-right">Usar</th> </tr> </thead> <tbody> <tr ng-repeat="debito in vm.listaDebitosclienteDisponible"> <td><p class="form-control-static no-margins">Débito N° {{debito.debito_id}}</td> <td class="text-right"> <p class="form-control-static no-margins">{{debito.debito_montodisponible | roundPriceFinanzasFilter}}</p> </td> <td class="text-right"> <div class="form-group"> <input type="text" autocomplete="off" class="form-control" solo-numeros ng-disabled="debito.debito_usar == \'0\'" maxlength="5" validate-max-value="{{debito.debito_montodisponible}}" ng-model="debito.debito_montoausar" required> </div> </td> <td class="text-right"> <div class="checkbox is-icheck"> <label> <input type="checkbox" icheck ng-model="debito.debito_usar" ng-true-value="\'1\'" ng-false-value="\'0\'"> </label> </div> </td> </tr> </tbody> </table> </div> </div> </div> </div> <div class="ibox-footer text-right"> <button class="btn btn-default" type="button" ng-click="vm.fnCancelar()">Cancelar</button> <button class="btn btn-primary" ladda="vm.loading" ng-disabled="!vm.listaDebitosclienteDisponible.length" ng-click="vm.fnSeleccionarDebitos()"><i class="fa fa-ticket"></i> Seleccionar débitos </button> </div> </div>
