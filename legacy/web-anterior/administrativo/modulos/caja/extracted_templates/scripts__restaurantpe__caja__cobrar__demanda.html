\'">{{table.notes}}</span> <span class="resttable-description" ng-if="table.type === \'round\'" arc-text>{{table.notes}}</span> </div> <div class="resttable resttable-multi occupied" tabindex="0"> <div class="resttable-body"> <span class="top-data">8 pedidos</span> <span class="name">P09</span> <span class="name">P10</span> <span class="name">P11</span> <span class="bottom-data"><i class="fa fa-clock-o"></i> 1:36 h</span> </div> <span class="resttable-description">JAVICHO</span> </div> </div> <div class="resttables-view form-inline"> <div class="form-group"> <label for="resttables-view-options">Ver en la mesa: </label> <select class="form-control" id="resttables-view-options" name="resttables-view-options"> <option>Tiempo</option> <option>Personas</option> </select> </div> </div> </div> </uib-tab> </uib-tabset> </div> </div> </div>
