<form ng-controller="BuscadorController as vmb" ng-if="!vm.venta.debeMostrarDetalleConsumo() && vm.fnEsModoCorregir()" class="product-search form-inline form-inline-stretched border-dashed border-dashed-bottom p-b-xs p-t-xs" ng-submit="vmb.fnAgregarPedido()"> <div class="form-group all-space"> <input class="form-control" type="search" id="product-search-name" placeholder="Buscar producto" ng-model="vmb.productoBuscado" ng-focus="vmb.productoBuscado = \'\'" autocomplete="off" uib-typeahead="prod as prod.toStringBuscador() for prod in vmb.productos | propsFilter:{producto_codigo:$viewValue,producto_descripcion:$viewValue,_producto_stringbuscador:$viewValue} | limitTo:10" typeahead-on-select="vmb.fnSeleccionarProductoBuscado($item, $model, $label, $event)" typeahead-focus-first="true" typeahead-append-to-body="true" ng-change="vmb.fnScanner()"> </div> <div class="form-group col-md-3"> <input class="form-control" type="text" size="6" placeholder="Cantidad" id="pedidoBuscadoCantidad" ng-model="vmb.productoBuscadoCantidad"> </div> <div class="form-group"> <ui-select class="inline-block" ng-model="vmb.mozoSeleccionado" theme="bootstrap"> <ui-select-match placeholder="Selecciona un {{ \'MOZO\' | translate | lowercase }}"> {{ \'MOZO\' | translate }}: {{$select.selected.toString()}} </ui-select-match> <ui-select-choices repeat="item in vmb.mozos | filter: $select.search"> <div ng-bind-html="item.toString() | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> <div class="form-group"> <button class="btn btn-primary" type="submit"> <i class="fa fa-plus-circle"></i> Agregar </button> </div> </form> <div class="alert alert-warning alert-min-padding" ng-if="vm.configuracionPreciosSinImpuestos && (vm.fnEsModoCorregir() || vm.fnEsModoModificacionPagos())"> <h3 class="no-margins"><strong>Nota:</strong></h3> <p>Cuando corriges una venta no aplica la configuracion de precio sin impuestos</p> </div> <table class="product-board order-list table table-condensed table-hover table-body-no-border"> <thead> <tr> <th class="" title="Cantidad" ng-if="!vm.venta.debeMostrarDetalleConsumo()">Cant.</th> <th title="Producto y presentación">Descripción</th> <th class="is-number is-amount has-input" title="Precio final" class="is-number">Importe</th> <th class="" ng-if="vm.venta.debeMostrarDetalleConsumo()"></th> <th class="" ng-if="!vm.venta.debeMostrarDetalleConsumo() && vm.fnEsModoCorregir()"></th> </tr> </thead> <tbody> <tr ng-repeat="pedido in vm.pedidos" ng-if="!vm.venta.debeMostrarDetalleConsumo()"> <td class=""> <div class="input-group numeric-control numeric-control-limited" ng-if="!pedido.tieneModificadores() && !pedido.esCombo() && vm.fnEsModoCorregir()"> <span class="input-group-btn"> <button class="btn btn-default btn-sm" type="button" ng-click="pedido.disminuir()"> <i class="fa fa-minus"></i> </button> </span> <input type="text" autocomplete="off" class="form-control input-sm" ng-model="pedido.pedido_cantidad"> <span class="input-group-btn"> <button class="btn btn-default btn-sm" type="button" ng-click="pedido.aumentar()"> <i class="fa fa-plus"></i> </button> </span> </div> <span ng-if="(pedido.esCombo() || pedido.tieneModificadores()) || !vm.fnEsModoCorregir()">{{pedido.pedido_cantidad | number:2}}</span> </td> <td ng-include="\'scripts/restaurantpe/ventas/td.\'+pedido.getTipo()+\'.\'+\'1\'+\'.view.html\'"> </td> <td class="is-number has-input">{{pedido.getPedido_importe()|roundPriceFinanzasFilter}}</td> <td ng-if="!vm.venta.debeMostrarDetalleConsumo() && vm.fnEsModoCorregir()" class="is-number has-input"><button class="btn btn-danger" ng-click="vm.eliminarPedidoPorEnviar($index)"><i class="fa fa-trash"></i></button></td> </tr> <tr ng-repeat="pedido in vm.listaConsumosDetalle" ng-if="vm.venta.debeMostrarDetalleConsumo()"> <td class="is-number" ng-if="!vm.venta.debeMostrarDetalleConsumo()">1</td> <td> <input type="text" ng-model="pedido.detalleconsumo" class="form-control"> </td> <td class="is-number has-input"> <input type="text" ng-model="pedido.importe" class="form-control" id="detalleconsumoimporte{{$index}}"> </td> <td> <a href="" tabindex="-1" ng-click="vm.fnAgregarDetalleConsumo()" class="btn btn-sm btn-success" ng-show="$index==0"> <i class="fa fa-plus"></i> </a> <a href="" tabindex="-1" ng-click="vm.fnEliminarDetalleConsumo($index)" class="btn btn-sm btn-danger"> <i class="fa fa-minus"></i> </a> </td> </tr> </tbody> </table>
