<div class="ibox no-margins"> <div class="ibox-title"> <h5>Costo base del insumo / producto</h5> </div> <div class="ibox-content"> <p class="m-b"><em>Ingresar un costo base.</em></p> <ng-form name="form"> <div class="form-group" ng-class="{'has-error': !vm.costo && form.$dirty}"> <label for="" class="control-label">Costo base</label> <input class="form-control" name="costo" colocar-focus solo-numeros decimal-cantidad="4" required ng-model="vm.costo"> <div ng-if="form.costo.$dirty" ng-messages="form.costo.$error"> <div class="help-block" ng-message="required">Campo requerido </div> </div> </div> </ng-form> <div class="text-right"> <button class="btn btn-default" type="button" ng-click="vm.fnCancel()">Cancelar</button> <button class="btn btn-primary ladda-button" ladda="vm.btnCargandoGuardar" data-style="expand-left" ng-click="vm.fnGuardar()" ng-disabled="form.$invalid" type="none"> <i class="fa fa-save"></i> Guardar </button> </div> </div> </div>
