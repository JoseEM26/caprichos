<form name="frmImpresora"> <div class="modal-header"> <h4 class="modal-title"><i class="fa fa-plus-circle"></i> Registrar impresora</h4> </div> <ng-form name="formImpresora"> <div class="modal-body"> <div class="row"> <div class="col-sm-6"> <div class="form-group" ng-class="{'has-error': !vm.impresora.impresora_nombre && formImpresora.$dirty}"> <label class="control-label" for="impresora_nombre">Nombre</label> <input class="form-control" type="text" id="impresora_nombre" name="impresora_nombre" required minlength="3" ng-model="vm.impresora.impresora_nombre"> <div ng-if="formImpresora.impresora_nombre.$dirty" ng-messages="formImpresora.impresora_nombre.$error"> <div class="help-block" ng-message="required">Campo requerido</div> <div class="help-block" ng-message="minlength">Nombre muy corto (minimo 3 letras)</div> <div class="help-block" ng-message="uniqueNombrecaja">Se econtraron coincidencias</div> </div> </div> </div> <div class="col-sm-6"> <div class="form-group" ng-class="{'has-error': !vm.impresora.impresora_ip && formImpresora.$dirty}"> <label class="control-label" for="impresora_ip">IP</label> <input class="form-control" type="text" required id="impresora_ip" name="impresora_ip" placeholder="Ej. 192.168.1.100" ng-model="vm.impresora.impresora_ip"> <div ng-if="formImpresora.impresora_ip.$dirty" ng-messages="formImpresora.impresora_ip.$error"> <div class="help-block" ng-message="required">Campo requerido</div> <div class="help-block" ng-message="pattern">La IP no es correcta.</div> </div> </div> </div> </div> <div class="row"> <div class="col-sm-6"> <div class="form-group" ng-class="{'has-error': !vm.impresora.impresora_serie && formImpresora.$dirty}"> <label class="control-label" for="impresora_serie">Serie</label> <input class="form-control" type="text" id="impresora_serie" name="impresora_serie" required ng-model="vm.impresora.impresora_serie"> <div ng-if="formImpresora.impresora_serie.$dirty" ng-messages="formImpresora.impresora_serie.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> </div> </div> <div class="col-sm-6"> <div class="form-group"> <label class="control-label">Tipo</label> <ui-select ng-model="vm.tipoImpresoraSeleccionada" theme="bootstrap" search-enabled="false" ng-required="true"> <ui-select-match placeholder="Selecciona un tipo">{{$select.selected.nombre}}</ui-select-match> <ui-select-choices repeat="item in vm.tipoImpresoras | filter: $select.search"> <div ng-bind-html="item.nombre | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> </div> </div> </div> <div class="modal-footer"> <button class="btn btn-default" type="button" ng-click="vm.emitEvent();vm.cerrarModal()">Cancelar</button> <button ladda="btnCargandoModalGuardar" ng-disabled="formImpresora.$invalid" class="btn btn-primary" id="btnRegistrar" ng-click="vm.fnAgregar()"><i class="fa fa-save"></i> Guardar</button> </div> </ng-form> </form>
