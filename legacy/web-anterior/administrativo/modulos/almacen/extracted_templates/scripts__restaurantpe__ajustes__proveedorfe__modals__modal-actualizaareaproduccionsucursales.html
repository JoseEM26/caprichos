<div class="ibox no-margins"> <div class="ibox-title"> <h5>Actualizar areas de producción en sucursales</h5> </div> <div class="ibox-content"> <p class="m-b-md">Seleccione las areas de producción por las distintas sucursales.</p> <div class="row"> <div class="col-sm-12"> <div class="form-group"> <table class="table table-bordered table-shadow"> <thead> <tr> <th>Sucursal</th> <th class="text-center">Area producción principal</th> </tr> </thead> <tbody> <tr ng-repeat="localareaproduccionprincipal in vm.localareaproduccionprincipalList" ng-if="vm.localareaproduccionprincipalList.length>0"> <td> {{localareaproduccionprincipal.local_descripcion}} </td> <td class="text-center"> <ui-select on-select="vm.fnObtenerAlmacenPorId($localareaproduccionlocal, $model)" ng-model="localareaproduccionprincipal.areaproduccionprincipalObj" theme="bootstrap"> <ui-select-match placeholder="Selecciona un área"> {{$select.selected.areaproduccion_descripcion}} </ui-select-match> <ui-select-choices repeat="localareaproduccionlocal in localareaproduccionprincipal.areaproduccionlocalList | filter: $select.search"> <div ng-bind-html="localareaproduccionlocal.areaproduccion_descripcion | highlight: $select.search"></div> </ui-select-choices> </ui-select> </td> </tr> <tr ng-if="vm.localareaproduccionprincipalList.length==0"> <td colspan="2"> <em> <span> No existen locales. </span> </em> </td> </tr> </tbody> </table> </div> </div> </div> <div class="text-right"> <button class="btn btn-default" type="button" ng-click="vm.fnCancel()">Cancelar</button> <button class="btn btn-primary ladda-button" ladda="vm.btnCargandoGuardar" data-style="expand-left" ng-click="vm.fnGuardar()" ng-disabled="form.$invalid" type="none"> <i class="fa fa-save"></i> Guardar </button> </div> </div> </div>
