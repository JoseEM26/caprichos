<div ng-controller="CategoriasInsumosCtrl as vm"> <div rest-loader-model="vm.cargandoCategorias" ng-class="{'is-loading': vm.cargandoCategorias}"></div> <div class="restloader-remote-el" ng-class="{'is-loading': vm.cargandoCategorias}"> <div class="module-header"> <h2><i class="fa fa-tasks"></i> Categorías</h2> <input class="form-control m-t-md m-b-md" ng-model="vm.filtroCategorias" type="text" placeholder="Filtrar mis categorias"> </div> <div class="miniform-on-list m-l-md"> <div ng-if="!vm.agregandoCategoria"> <button class="btn btn-default" ng-click="vm.fnNuevaCategoria()"> <i class="fa fa-plus-circle"></i> Añadir nueva categoría </button> <div class="pull-right"> <label> <small>Ver Anuladas</small> </label> <input class="form-control input-sm" icheck ng-change="vm.fnObtenercategorias()" type="checkbox" ng-true-value="'1'" ng-false-value="'0'" ng-model="vm.verAnulados"> </div> </div> <span class="" ng-if="vm.agregandoCategoria"> <form name="form" novalidate> <div class="form-group m-b-xs" ng-class="{'has-error': !vm.categoriaInsumo.categoriainsumo_descripcion && form.$dirty}"> <label for="cat-name"> <small>Nombre</small> </label> <input id="cat-name" class="form-control input-sm" type="text" name="categoriainsumo_descripcion" ng-model="vm.categoriaInsumo.categoriainsumo_descripcion" required> <div ng-if="form.categoriainsumo_descripcion.$dirty" ng-messages="form.categoriainsumo_descripcion.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> </div> <div class="form-group m-b-xs"> <label for="cat-name"> <small>Cuenta</small> </label> <input class="form-control input-sm" type="text" name="categoriainsumo_cuenta" ng-model="vm.categoriaInsumo.categoriainsumo_cuenta"> </div> <div class="form-group m-b-xs"> <label for="cat-name"> <small>Código familia</small> </label> <input class="form-control input-sm" type="text" name="categoriainsumo_codigofamilia" ng-model="vm.categoriaInsumo.categoriainsumo_codigofamilia"> </div> <div class="form-group m-b-xs"> <label for="cat-name"> <small>Código de existencia</small> </label> <input class="form-control input-sm" type="text" name="categoriainsumo_codigoexistencia" ng-model="vm.categoriaInsumo.categoriainsumo_codigoexistencia"> </div> <div class="ibox" ng-if="vm.gestionImpuestosActiva == true"> <div class="ibox-title"> <h5><i class="icon-help"></i> Gestión de impuestos</h5> </div> <div class="ibox-content"> <div class="alert alert-info alert-min-padding" ng-if="vm.categoriaInsumo.categoriainsumo_id"> Ahora puedes gestionar los impuestos aplicados a esta categoría, <a class="alert-link" href="" ng-click="vm.fnActualizarImpuestosCategoria(vm.categoriaInsumo.categoriainsumo_id,vm.categoriaInsumo.categoriainsumo_descripcion);">haciendo clic aqui</a>. </div> <div class="alert alert-info alert-min-padding" ng-if="!vm.categoriaInsumo.categoriainsumo_id"> Recuerda editar la nueva categoría para poder gestionar los impuestos que se le aplicarán. </div> </div> </div> <div class="form-group m-b-xs"> <label for="cat-name"> <small>¿Se aplica en Food-Cost?</small> </label> <input autocomplete="off" class="form-control input-sm" icheck type="checkbox" ng-true-value="'1'" ng-false-value="'0'" ng-model="vm.categoriaInsumo.categoriainsumo_controlfoodcost"> </div> <div class="form-group m-b-xs"> <label for="cat-name"> <small>Activa</small> </label> <input class="form-control input-sm" ng-true-value="'1'" ng-false-value="'0'" icheck type="checkbox" ng-model="vm.categoriaInsumo.categoriainsumo_estado"> </div> <button class="btn btn-default btn-sm" ng-click="vm.fnCancelarForm()">Cancelar </button> <button ng-disabled="form.$invalid" type="none" ng-if="!vm.categoriaInsumo.categoriainsumo_id" ladda="vm.btnCargandoGuardarCategoria" class="ladda-button btn btn-primary" data-style="expand-left" ng-click="vm.fnAgregarCategoria()"> <i class="fa fa-save"></i> Guardar </button> <button ng-disabled="form.$invalid" type="submit" ng-if="vm.categoriaInsumo.categoriainsumo_id * 1 > 0" ladda="vm.btnCargandoActualizarCategoria" class="ladda-button btn btn-primary" data-style="expand-left" ng-click="vm.fnActualizarCategoria()"> <i class="fa fa-save"></i> Actualizar </button> </form> </span> </div> <br> <div class="module-body"> <ul class="list-simple-menu"> <li class="list-item" ng-class="{'active':'All'==$state.params.idCategoriaInsumo}"> <span class="arrow"></span> <span class="title-wrapper"> <a class="title not-underline" ui-sref="productos.insumos.categoria({idCategoriaInsumo: 'All',tipoinsumo: '1', pagina: '1', orden: '1'})"> <span>TODAS</span> </a> </span> </li> <li class="list-item" ng-class="{'active':cat.categoriainsumo_id==$state.params.idCategoriaInsumo}" ng-repeat="cat in vm.listaCategoriasActivas  | filter:vm.filtroCategorias"> <span class="arrow"></span> <span class="title-wrapper"> <a href class="action" ng-click="vm.fnPreActualizarCategoria(cat)"> <i class="fa fa-pencil"></i> </a> <a class="title not-underline" ui-sref="productos.insumos.categoria({idCategoriaInsumo: cat.categoriainsumo_id,tipoinsumo: '1', pagina: '1', orden: '1'})"> <span>{{cat.categoriainsumo_descripcion}} </span> </a> </span> </li> </ul> </div> <div class="module-footer" ng-show="1==2"> <a ui-sref="productos.categorias" class="btn btn-default"><i class="fa fa-gear"></i> Configuración avanzada</a> </div> </div> </div>
