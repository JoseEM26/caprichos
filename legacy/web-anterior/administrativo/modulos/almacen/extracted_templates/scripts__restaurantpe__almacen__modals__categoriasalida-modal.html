<div class="ibox no-margins"> <div class="ibox-title text-danger"><h5>Lista de categorias</h5></div> <div class="ibox-content"> <ng-form name="form"> <div class="row"> <div class="col-sm-6"> <div class="form-group" ng-class="{'has-error': !vm.categoriasalida.categoriasalida_descripcion && form.$dirty}"> <label class="control-label">Descripción</label> <input type="text" class="form-control" name="categoriasalida_descripcion" ng-model="vm.categoriasalida.categoriasalida_descripcion" required> <div ng-if="form.categoriasalida_descripcion.$dirty" ng-messages="form.categoriasalida_descripcion.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> </div> </div> <div class="col-sm-6"> <div class="form-group" ng-class="{'has-error': !vm.categoriasalida.categoriasalida_estado && form.$dirty}"> <label class="control-label">Estado</label> <div class="checkbox is-icheck"> <label> <input type="checkbox" id="categoriasalida_estado" icheck ng-model="vm.categoriasalida.categoriasalida_estado" ng-true-value="'1'" ng-false-value="'0'"> Categoria activa </label> </div> <div ng-if="form.categoriasalida_estado.$dirty" ng-messages="form.categoriasalida_estado.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> </div> </div> </div> </ng-form> <hr> <div rest-loader-model="vm.cargandoDetalle" ng-class="{'is-loading': vm.cargandoDetalle}"></div> <div class="restloader-remote-el" ng-class="{'is-loading': vm.cargandoDetalle}"> <div class="table-responsive"> <table class="table table-hover table-condensed"> <thead> <tr> <th>Descripción</th> <th class="text-center">Estado</th> <th></th> </tr> </thead> <tbody> <tr ng-repeat="d in vm.listaCategoriasalida" ng-show="($index)>=((vm.paginaActual-1)*vm.cantidadPorPagina) && ($index+1)<=((vm.paginaActual)*vm.cantidadPorPagina)"> <td>{{d.categoriasalida_descripcion}}</td> <td class="text-center"> <span class="label label-primary" ng-show="d.categoriasalida_estado=='1'"> Activo </span> <span class="label label-danger" ng-show="d.categoriasalida_estado!='1'"> Anulado </span> </td> <td> <button class="btn btn-success btn-xs" ng-click="vm.categoriasalida=d;vm.seleccionarTipo(d);"> <i class="fa fa-edit"></i> Editar </button> </td> </tr> <tr ng-if="vm.listaCategoriasalida.length==0"> <td colspan="3"> <em> <span>No existen categorias</span> </em> </td> </tr> </tbody> </table> <nav class="b-t-gray-l1 text-right"> <uib-pagination class="m-sm m-b-xs" ng-model="vm.paginaActual" total-items="vm.listaCategoriasalida.length" items-per-page="vm.cantidadPorPagina" previous-text="Anterior" next-text="Siguiente" first-text="Primera" last-text="Último" max-size="8"> </uib-pagination> </nav> </div> </div> <div class="float-e-margins text-right"> <button class="btn btn-primary" ng-show="!vm.categoriasalida.categoriasalida_id" ladda="vm.btnGuardando" ng-disabled="form.$invalid" ng-click="vm.fnAgregarCategoria()"> <i class="fa fa-save"></i> Guardar </button> <button class="btn btn-primary" ng-show="vm.categoriasalida.categoriasalida_id" ladda="vm.btnGuardando" ng-disabled="form.$invalid" ng-click="vm.fnActualizarCategoria()"> <i class="fa fa-save"></i> Actualizar </button> <button class="btn btn-default" ng-click="vm.fnCancel()">Cerrar</button> </div> </div> </div>
