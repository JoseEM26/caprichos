<div class="wrapper wrapper-content"> <div class="row"> <div class="col-sm-8" equalizer="'theColumns'"> <div class="ibox"> <div class="ibox-title"> <h5><i class="fa fa-laptop"></i> Categorias registradas</h5> </div> <div class="ibox-content"> <div class="row"> <div class="col-sm-7"> <div class="input-group m-b" ng-class="{'has-warning': vm.valBusqueda}"> <div class="input-group-addon"> <i class="fa fa-search"></i> </div> <input type="text" autocomplete="off" class="form-control" placeholder="Buscar..." ng-model="vm.valBusqueda"> </div> </div> <div class="col-sm-3"> <ui-select ng-model="vm.paginacionSeleccionada" ng-change="vm.fnCargarCategoriaAnularVenta()" theme="bootstrap" search-enabled="false"> <ui-select-match placeholder="Paginación"> <span ng-if="$select.selected.paginacion_valor != 'Todos'"> Por: <strong>{{$select.selected.paginacion_valor}}</strong> registros </span> <span ng-if="$select.selected.paginacion_valor == 'Todos'"> Por: <strong>{{$select.selected.paginacion_valor}}</strong> los registros </span> </ui-select-match> <ui-select-choices repeat="item in vm.cantidadesPorPagina | filter: $select.search"> <div ng-if="item.paginacion_valor != 'Todos'" ng-bind-html="item.paginacion_valor + ' registros' | highlight: $select.search"></div> <div ng-if="item.paginacion_valor == 'Todos'" ng-bind-html="item.paginacion_valor + ' los registros' | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> <div class="col-sm-2" uib-tooltip="Volver a cargar los datos"> <button ng-click="vm.fnCargarCategoriaAnularVenta()" class="btn btn-default btn-icon btn-block"><i class="fa fa-refresh"></i></button> </div> </div> <div rest-loader-model="cargando" ng-class="{'is-loading': cargando}"></div> <div class="table-responsive restloader-remote-el" ng-class="{'is-loading': cargando}"> <table class="table table-condensed table-hover table-text-13 table-middle table-hover m-b-none"> <thead> <tr> <th>Descripción</th> <th>Estado</th> <th class="text-right">Acciones</th> </tr> </thead> <tbody> <tr ng-repeat="categoriaanularventa in vm.categoriaanularventaList | filter:vm.valBusqueda" ng-class="{'disabled': !categoriaanularventa.estaActivo(), 'active': categoriaanularventa.categoriaanularventa_id == $state.params.idCategoriaanularventa}"> <td> <label class="text-black">{{categoriaanularventa.categoriaanularventa_descripcion}}</label> </td> <td> <span ng-if="categoriaanularventa.categoriaanularventa_estado=='1'" class="label label-primary">Activa</span> <span ng-if="categoriaanularventa.categoriaanularventa_estado=='0'" class="label label-danger">Inactiva</span> </td> <td class="text-right"> <button class="btn btn-success btn-xs" ng-click="vm.setCategoriaanularventa(categoriaanularventa);$state.go('ajustes.categoriaanularventa.editar', {idCategoriaanularventa: categoriaanularventa.categoriaanularventa_id})"> <i class="fa fa-edit"></i> Editar </button> </td> </tr> <tr ng-hide="(vm.categoriaanularventaList|filter:vm.valBusqueda).length != 0"> <td colspan="3"> <em> <span>No hay resultados</span> <span ng-if="vm.valBusqueda">para <strong>{{vm.valBusqueda}}</strong></span> </em> </td> </tr> </tbody> </table> </div> <nav class="b-t-gray-l1 text-right"> <uib-pagination class="m-sm m-b-xs" ng-model="vm.paginaActual" total-items="vm.totalRegistros" items-per-page="vm.paginacionSeleccionada.paginacion_id" previous-text="Anterior" next-text="Siguiente" first-text="Primera" last-text="Último" max-size="8" ng-change="vm.fnCargarCategoriaAnularVenta()"> </uib-pagination> </nav> </div> </div> </div> <div class="col-sm-4" equalizer="'theColumns'"> <div sticky-kit="globalStickyOpts"> <div class="m-b float-e-margins" ng-if="$state.is('ajustes.categoriaanularventa') || $state.is('ajustes.categoriaanularventa.editar')  || $state.is('ajustes.categoriaanularventa.nuevo')"> <button class="btn btn-primary btn-block" ng-if="! $state.is('ajustes.categoriaanularventa.nuevo')" ng-click="$state.go('ajustes.categoriaanularventa.nuevo');"> <i class="fa fa-plus-circle"></i> <span>Nueva categoria</span> </button> </div> <div ui-view="form"></div> </div> </div> </div> </div>
