<div class="ibox no-margins"> <div class="ibox-title text-danger"><h5>Lista de modificadores con receta</h5></div> <div class="ibox-content"> <div rest-loader-model="vm.cargandoSelecciones" ng-class="{'is-loading': vm.cargandoSelecciones}"></div> <div class="restloader-remote-el" ng-class="{'is-loading': vm.cargandoSelecciones}"> <div class="row"> <div class="col-md-12 col-xs-12"> <div class="input-group m-b" ng-class="{'has-warning': vm.filtroBusqueda}"> <div class="input-group-addon"> <i class="fa fa-search"></i> </div> <input type="text" class="form-control ng-valid ng-touched ng-not-empty ng-dirty ng-valid-parse" placeholder="Filtrar selecciones" ng-model="vm.filtroBusqueda" ng-change="vm.buscarPorFiltro()"> </div> </div> </div> <div class="table-responsive"> <table class="table table-hover table-condensed"> <thead> <tr> <th>Selección</th> <th>Precio</th> <th></th> </tr> </thead> <tbody> <tr ng-repeat="seleccion in vm.seleccionList"> <td>{{seleccion.seleccion_nombre}}</td> <td>{{Utility.getSimboloMoneda()}} {{seleccion.seleccion_precio | roundPriceFinanzasFilter}}</td> <td class="pull-right"> <button class="btn btn-success btn-xs" ng-click="vm.vincularModificadorseleccion(seleccion.seleccion_id)"> <i class="fa fa-edit"></i> Vincular </button> </td> </tr> <tr ng-if="vm.seleccionList.length==0"> <td colspan="3"> <em> <span>No existen selecciones</span> </em> </td> </tr> </tbody> </table> <nav class="b-t-gray-l1 text-right"> <uib-pagination class="m-sm m-b-xs" ng-model="vm.paginaActual" total-items="vm.totalRegistros" items-per-page="vm.cantidadPorPagina" previous-text="Anterior" next-text="Siguiente" first-text="Primera" last-text="Último" max-size="5" ng-change="vm.fnObtenerSelecciones()"> </uib-pagination> </nav> </div> </div> <div class="float-e-margins text-right"> <button class="btn btn-default" ng-click="vm.fnCancel()">Cerrar</button> </div> </div> </div>
