<div class="form-group"> <label class="control-label"> Busca los insumos y agrega los insumos al modificador </label> </div> <div restloader ng-class="{'is-loading': vm.cargandoProductosCombo}"></div> <div class="restloader-remote-el" ng-class="{'is-loading': vm.cargandoProductosCombo}"> <div class="form-group m-b-xxs"> <ui-select ng-model="vm.insumoParaReceta" theme="bootstrap" autocomplete="off" on-select="vm.fnAgregarASeleccionInsumo($item, $model)" tabindex="8"> <ui-select-match placeholder="Selecciona un insumo"> {{$select.selected.insumo_nombre}} </ui-select-match> <ui-select-choices repeat="item in vm.listaInsumosBusqueda track by $index" refresh="vm.fnRefrescarListaInsumos($select.search)" refresh-delay="100"> <div ng-if="item.insumo_recetabase!=1 && item.insumo_porcionable!=1" ng-bind-html="'<b>(Insumo) </b> ' + item.insumo_nombre | highlight: $select.search"></div> <div ng-if="item.insumo_recetabase==1" ng-bind-html="'<b>(Receta base) </b> ' + item.insumo_nombre | highlight: $select.search"></div> <div ng-if="item.insumo_porcionable==1" ng-bind-html="'<b>(Porcionable) </b> ' + item.insumo_nombre | highlight: $select.search"></div> </ui-select-choices> </ui-select> <table class="table table-bordered table-shadow table-hover m-t-sm m-b-none"> <thead> <tr> <th title="Cantidad">Cant.</th> <th title="Unidad de medida">Medida</th> <th title="Insumo">Insumo</th> <th class="is-number">Acciones</th> </tr> </thead> <tbody> <tr ng-repeat="seleccionInsumo in vm.seleccionInsumoList"> <td> <div ng-if="!seleccionInsumo.editando">{{seleccionInsumo.seleccioninsumo_cantidad}}</div> <div ng-if="seleccionInsumo.editando" class="form-group" ng-class="{'has-error': !precuenta.precuenta_nombre && form.$dirty}"> <div class="input-group numeric-control numeric-control-limited"> <input type="text" class="form-control input-cantidad-lg" ng-model="seleccionInsumo.seleccioninsumo_cantidad" solo-numeros> </div> </div> </td> <td> <ui-select ng-model="seleccionInsumo.unidadmedidainsumo_id" theme="bootstrap" search-enabled="false"> <ui-select-match placeholder="Selecciona una U.M."> {{$select.selected.unidadmedidainsumo_descripcion}} </ui-select-match> <ui-select-choices repeat="um.unidadmedidainsumo_id as um in Utility.getUmValidadas(vm.listaUnidadesMedida, seleccionInsumo.insumo_umid, seleccionInsumo.insumoequivalencia.unidadmedidainsumo_id) | filter: $select.search"> <div ng-bind-html="um.unidadmedidainsumo_descripcion | highlight: $select.search"></div> </ui-select-choices> </ui-select> </td> <td> <span class="label label-info label-7rem" ng-if="seleccionInsumo.insumo.insumo_recetabase != '1' && seleccionInsumo.insumo.insumo_porcionable != '1'"> Insumo </span> <span class="label label-warning label-7rem" ng-if="seleccionInsumo.insumo.insumo_recetabase == '1'"> Receta </span> <span class="label label-danger label-7rem" ng-if="seleccionInsumo.insumo.insumo_porcionable == '1'"> Porcionable </span> {{seleccionInsumo.insumo_nombre}} </td> <td class="text-right"> <span ng-if="!seleccionInsumo.editando"> <button class="btn btn-success btn-icon" ladda="vm.btnCargandoModificar" ng-click="seleccionInsumo.editando = !seleccionInsumo.editando"><i class="fa fa-edit"></i> </button> </span> <span ng-if="seleccionInsumo.editando"> <button class="btn btn-primary btn-icon" ladda="vm.btnCargandoModificar" ng-click="vm.fnActualizarSeleccioninsumo(seleccionInsumo.seleccioninsumo_id, seleccionInsumo)"> <i class="fa fa-save"></i> </button> </span> <button class="btn btn-danger btn-icon" ladda="vm.btnCargandoEliminar" ng-click="vm.fnEliminarSeleccioninsumo(seleccionInsumo.seleccioninsumo_id)"> <i class="fa fa-trash"></i> </button> </td> </tr> <tr ng-hide="(vm.seleccionInsumoList).length != 0"> <td colspan="3"> <em> <span>No hay insumos vinculados al modificador.</span> </em> </td> </tr> </tbody> </table> </div> </div>
