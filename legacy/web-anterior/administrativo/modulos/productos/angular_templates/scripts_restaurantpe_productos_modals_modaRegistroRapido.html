<div rest-loader-model="vm.cargandoProducto" ng-class="{'is-loading': vm.cargandoProducto}"></div> <div class="restloader-remote-el" ng-class="{'is-loading': vm.cargandoProducto}"> <div class="ibox no-margins"> <div class="ibox-title"> <h5>Nuevo producto</h5> </div> <div class="ibox-content p-t-sm p-b-sm"> <ng-form name="form"> <div class="form-group form-group-right-control m-b-md" ng-class="{'has-error': !vm.productogeneral.productogeneral_descripcion && form.$dirty}"> <div class="form-control-right" ng-click="vm.productogeneral.productogeneral_esfavorito = !vm.productogeneral.productogeneral_esfavorito"> <i class="fa fa-lg" ng-class="{'fa-star text-warning': vm.productogeneral.esFavorito(), 'fa-star-o': !vm.productogeneral.esFavorito()}"></i> </div> <input class="form-control input-lg titulo-producto" type="text" ng-model="vm.productogeneral.productogeneral_descripcion" autocomplete="off" placeholder="Nombre del producto" name="productogeneral_descripcion" colocar-focus required> <div ng-if="form.productogeneral_descripcion.$dirty" ng-messages="form.productogeneral_descripcion.$error"> <div ng-message="required">Campo requerido</div> </div> </div> <br> <div class="row"> <div class="col-sm-12" ng-if="vm.productogeneral.productogeneral_id*1>0"> <div class="alert alert-info alert-min-padding"> Ahora puedes modificar las areas de producción de otros locales, <a class="alert-link" href="" ng-click="vm.fnActualizarAreaproduccionSucursales(presentacion)">haciendo clic aqui</a>. </div> </div> <div class="col-sm-6"> <div class="form-group"> <label uib-tooltip="Area donde se elabora el Producto">Área de producción <i class="icon-help fa fa-question-circle"></i></label> <ui-select on-select="vm.fnObtenerAlmacenPorId($item, $model);vm.limpiarAreasExtras();" ng-model="vm.areaProduccionSeleccionada" theme="bootstrap"> <ui-select-match placeholder="Selecciona un área"> {{$select.selected.areaproduccion_descripcion}} </ui-select-match> <ui-select-choices repeat="item in vm.listaAreasproduccion | filter: $select.search"> <div ng-bind-html="item.areaproduccion_descripcion | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> </div> <div class="col-sm-6"> <div class="form-group"> <label uib-tooltip="Almacén ligado al Área de Producción">Almacén <i class="icon-help fa fa-question-circle"></i></label> <p class="form-control-static">{{vm.almacen.almacen_descripcion}}</p> </div> </div> </div> <div class="form-group"> <label uib-tooltip="Categoria del Producto">Categoría <i class="icon-help fa fa-question-circle"></i></label> <ui-select ng-model="vm.categoriaSeleccionada" theme="bootstrap"> <ui-select-match placeholder="Selecciona una categoría">{{$select.selected.categoria_descripcion}} </ui-select-match> <ui-select-choices repeat="item in vm.listaCategoriasActivas | filter: $select.search"> <div ng-bind-html="item.categoria_descripcion | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> <a class="btn btn-default" ng-click="vm.cerrarModal()">Cancelar</a> <button data-style="expand-left" ladda="vm.btnCargandoGuardarProductoGeneral" class="ladda-button btn btn-primary" ng-disabled="form.$invalid" ng-click="vm.fnPreAgregarGuardarProductoGeneral(false, true)"> <i class="fa fa-save"></i> Guardar </button> </ng-form> </div> </div> </div>
