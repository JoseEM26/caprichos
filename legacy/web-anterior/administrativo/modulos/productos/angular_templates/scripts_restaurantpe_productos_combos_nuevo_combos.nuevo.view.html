<div class="ibox float-e-margins"> <div class="ibox-title featured"> <h5><i class="fa fa-life-saver fa-lg"></i> ¿Que es combo?</h5> <div class="ibox-tools" attach-ibox-tools=""> <a class="collapse-link"><i class="fa fa-chevron-up"></i></a> <a class="close-link"><i class="fa fa-times"></i></a> </div> </div> <div class="ibox-content" equalizer="ayuda" style="min-height:81px;height:auto"> <p>Los <strong>pedidos</strong> se agrupan por las categorías que ves a continuación. Escoge una para ver sus opciones y luego podrás hacer pedidos.</p> </div> </div> <div id="editar-informacion" class="ibox"> <div class="ibox-title"> <h5>Nuevo Combo</h5> </div> <div class="ibox-content p-t-sm p-b-sm"> <ng-form name="form"> <div class="row"> <div class="col-sm-12"> <div class="form-group form-group-right-control" ng-class="{'has-error': !vm.productoGeneral.productogeneral_descripcion && form.$dirty}"> <div class="form-control-right" ng-click="vm.productoGeneral.productogeneral_esfavorito = !vm.productoGeneral.productogeneral_esfavorito"> <i class="fa fa-lg" ng-class="{'fa-star text-warning': vm.productoGeneral.esFavorito(), 'fa-star-o': !vm.productoGeneral.esFavorito()}"></i> </div> <input autocomplete="off" class="form-control input-lg titulo-producto" placeholder="Nombre del Combo" name="productogeneral_descripcion" colocar-focus ng-model="vm.productoGeneral.productogeneral_descripcion" tabindex="1" required> <div ng-if="form.productogeneral_descripcion.$dirty" ng-messages="form.productogeneral_descripcion.$error"> <div class="help-block" ng-message="required">Campo requerido </div> </div> </div> </div> </div> <div class="row"> <div class="col-sm-12"> <div class="form-group"> <label for="descripcion" class="control-label">Descripción</label> <textarea class="form-control" id="descripcion" rows="2" tabindex="2" ng-model="vm.productoGeneral.productogeneral_descripcionplato"></textarea> </div> </div> </div> <div class="row"> <div class="col-sm-6"> <div class="form-group"> <label for="codigoProducto" class="control-label">Código</label> <input class="form-control" type="text" id="codigoProducto" tabindex="3" ng-model="vm.producto.producto_codigo"> </div> </div> <div class="col-sm-6"> <div class="form-group"> <label>Categoría</label> <ui-select ng-model="vm.categoriaSeleccionada" theme="bootstrap" name="categoria_id" append-to-body="true" tabindex="4" required> <ui-select-match placeholder="Selecciona una categoría"> {{$select.selected.categoria_descripcion}} </ui-select-match> <ui-select-choices repeat="cat in vm.listaCategoriasActivas | filter: $select.search"> <div ng-bind-html="cat.categoria_descripcion | highlight: $select.search"></div> </ui-select-choices> </ui-select> <div ng-if="form.categoria_id.$dirty" ng-messages="form.categoria_id.$error"> <div class="help-block" ng-message="required">Campo requerido </div> </div> </div> </div> <div class="col-sm-4"> </div> </div> <div class="row"> <div class="col-sm-6"> <div class="form-group"> <label for="descripcion" class="control-label">Puntos</label> <input class="form-control" type="text" solo-numeros decimal-cantidad="0" tabindex="5" ng-model="vm.producto.producto_puntos"> </div> </div> <div class="col-sm-6"> <div class="form-group"> <label uib-tooltip="Código identificador para el ente tributario">Código tributario <i class="icon-help fa fa-question-circle"></i></label> <input class="form-control" ng-model="vm.producto.producto_codigosunat" placeholder="Código identificador para el ente tributario."> </div> </div> </div> <div class="row" ng-show="Utility.fnDebeMostrarCamposParaWSAHI()"> <div class="col-sm-6"> <div class="form-group"> <label uib-tooltip="Código de la Marca del producto">Cód Marca <i class="icon-help fa fa-question-circle"></i></label> <input class="form-control" type="text" ng-model="vm.productoGeneral.productogeneral_marca" autocomplete="off" placeholder="Código de marca del producto" name="productogeneral_marca"> </div> </div> <div class="col-sm-6"> <div class="form-group"> <label uib-tooltip="Código del producto en sistema contable">Código WSAHI <i class="icon-help fa fa-question-circle"></i></label> <input class="form-control" type="text" ng-model="vm.producto.producto_wsahi" autocomplete="off" placeholder="Código del producto en sistema contable" name="producto_wsahi"> </div> </div> </div> <div class="form-group" ng-if="Security.esDominioParaEdosushibar()"> <div> <label class="font-noraml" style="color:#363636"> <input id="insumo" icheck type="checkbox" ng-true-value="'1'" ng-false-value="'0'" ng-model="vm.productoGeneral.productogeneral_manejarporequivalencias"> Manejar combo por equivalencias </label> </div> </div> <div class="row"> <div class="col-sm-12"> <div class="form-group"> <a class="btn btn-default" ui-sref="productos.combos.categoria({idCategoria: $state.params.idCategoria})">Cancelar</a> <button ng-disabled="form.$invalid" type="submit" class="btn btn-primary ladda-button" ladda="vm.btnCargandoNuevoCombo" data-style="expand-left" ng-click="vm.fnGuardarCombo()"> <i class="fa fa-save"></i> Guardar Combo </button> </div> </div> </div> </ng-form> </div> </div>
