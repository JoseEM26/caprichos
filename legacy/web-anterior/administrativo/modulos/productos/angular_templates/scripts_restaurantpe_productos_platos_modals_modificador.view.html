<div class="ibox no-margins"> <div class="ibox-title text-danger"><h5>Lista de agrupadores</h5></div> <div class="ibox-content"> <ng-form name="form"> <div class="row"> <div class="col-sm-6"> <div class="form-group" ng-class="{'has-error': !vm.modificador.modificador_nombre && form.$dirty}"> <label class="control-label">Nombre</label> <input type="text" class="form-control" name="modificador_nombre" ng-model="vm.modificador.modificador_nombre" required> <div ng-if="form.modificador_nombre.$dirty" ng-messages="form.modificador_nombre.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> </div> </div> <div class="col-sm-6"> <div class="form-group" ng-class="{'has-error': !vm.modificador.tipomodificador && form.$dirty}"> <label class="control-label">Tipo de selección</label> <ui-select ng-model="vm.modificador.tipomodificador" theme="bootstrap" name="tipomodificador" required> <ui-select-match placeholder="Selecciona"> {{$select.selected.tipomodificador_descripcion}} </ui-select-match> <ui-select-choices repeat="um in vm.listaTipoModificador | filter: $select.search"> <div ng-bind-html="um.tipomodificador_descripcion | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> </div> </div> <div class="row"> <div class="col-sm-6"> <div class="form-group" ng-class="{'has-error': !vm.modificador.modificador_cantidadminima && form.$dirty}"> <label class="control-label">¿Es obligatorio?</label> <div class="checkbox is-icheck"> <label> <input type="checkbox" id="modificador_cantidadminima" icheck ng-model="vm.modificador.modificador_cantidadminima" ng-true-value="'1'" ng-false-value="'0'"> <span ng-if="vm.modificador.modificador_cantidadminima * 1 > 0">Si</span> <span ng-if="vm.modificador.modificador_cantidadminima * 1 == 0">No</span> </label> </div> <div ng-if="form.modificador_cantidadminima.$dirty" ng-messages="form.modificador_cantidadminima.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div>
