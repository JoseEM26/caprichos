<div rest-loader-model="vm.cargandoCategorias" ng-class="{'is-loading': vm.cargandoCategorias}"></div> <div class="restloader-remote-el" ng-class="{'is-loading': vm.cargandoCategorias}"> <div class="module-header"> <h2>Categorías</h2> <div class="input-group"> <input class="form-control" ng-model="vm.filtroCategorias" type="text" placeholder="Filtrar mis categorias"> <span class="input-group-addon"> <a class="not-underline" ng-click="vm.eliminarCategorias()"> <strong>Todas</strong> </a> </span> </div> </div> <div class="module-body"> <ul class="list-simple-menu" ng-show="vm.filtroCategorias!=''"> <li class="list-item" ng-class="{'active':cat.getCategoria_id()==$state.params.idCategoria}" ng-repeat="cat in vm.listaCategoriasActivas  | filter:vm.filtroCategorias"> <span class="arrow"></span> <span class="title-wrapper"> <a class="title" ng-click="vm.fnAgregarCategoriaFiltro(cat)"> <span>{{cat.getCategoria_descripcion()}}</span><span ng-if="cat._categoria_tieneoferta==1" class="label label-info pull-right m-r-sm">Tiene oferta</span> </a> </span> </li> <li ng-hide="(vm.listaCategoriasActivas | filter:vm.filtroCategorias).length != 0">No hay resultados</li> </ul> <ul class="list-simple-menu" ng-show="vm.filtroCategorias==''"> <li class="list-item" ng-class="{'has-children parent':cat.conHijos,'active':cat.categoria_id==$state.params.idCategoria}" ng-repeat="cat in vm.arbolCategorias"> <span class="arrow"></span> <span class="title-wrapper"> <a href class="title not-underline" ng-click="vm.fnAgregarCategoriaFiltro(cat)"> <span>{{cat.categoria_descripcion}}</span><span ng-if="cat._categoria_tieneoferta==1" class="label label-info pull-right m-r-sm">Tiene oferta</span> </a> </span> <ul class="children collapsed"> <li class="list-item" ng-class="{'has-children parent':hijo.conHijos,'active':hijo.categoria_id==$state.params.idCategoria}" ng-repeat="hijo in cat.hijos" ng-show="cat.abierta"> <span class="arrow"></span> <span class="title-wrapper"> <a class="title" ng-click="vm.fnClickCategoria(hijo)"> <span>{{hijo.categoria_descripcion}}</span><span ng-if="hijo._categoria_tieneoferta==1" class="label label-info pull-right m-r-sm">Tiene oferta</span> </a> </span> <ul class="children collapsed"> <li class="list-item" ng-class="{'has-children parent':subhijo.conHijos,'active':subhijo.categoria_id==$state.params.idCategoria}" ng-repeat="subhijo in hijo.hijos" ng-show="hijo.abierta"> <span class="arrow"></span> <span class="title-wrapper"> <a class="title" ng-click="vm.fnAgregarCategoriaFiltro(subhijo)"> <span>{{subhijo.categoria_descripcion}}</span><span ng-if="subhijo._categoria_tieneoferta==1" class="label label-info pull-right m-r-sm">Tiene oferta</span> </a> </span> </li> </ul> </li> </ul> </li> </ul> </div> </div>
