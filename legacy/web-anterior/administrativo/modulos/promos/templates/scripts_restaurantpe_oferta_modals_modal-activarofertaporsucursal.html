<div class="ibox no-margins"> <div class="ibox-title"> <h5>Agregar la oferta en otras sucursales</h5> </div> <div class="ibox-content"> <p class="m-b-md">Selecciona las sucursales donde deseas que se agregue la misma oferta.</p> <div class="row"> <div class="col-sm-12"> <div class="form-group"> <table class="table table-bordered table-shadow"> <thead> <tr> <th>Sucursal</th> <th class="text-center">Estado</th> </tr> </thead> <tbody> <tr ng-repeat="sucursal in vm.listaSucursales" ng-if="vm.listaSucursales.length>0"> <td> {{sucursal.local_descripcion}} </td> <td class="text-center"> <input type="checkbox" icheck ng-model="sucursal.seleccionado" ng-true-value="'1'" ng-false-value="'0'"> </td> </tr> <tr ng-if="vm.listaSucursales.length==0"> <td colspan="2"> <em> <span> No existen locales. </span> </em> </td> </tr> </tbody> </table> </div> </div> </div> <div class="text-right"> <button class="btn btn-default" type="button" ng-click="vm.fnCancel()">Cancelar</button> <button class="btn btn-primary ladda-button" ladda="vm.btnCargandoGuardar" data-style="expand-left" ng-click="vm.fnGuardar()" ng-disabled="form.$invalid" type="none"> <i class="fa fa-save"></i> Guardar </button> </div> </div> </div>
