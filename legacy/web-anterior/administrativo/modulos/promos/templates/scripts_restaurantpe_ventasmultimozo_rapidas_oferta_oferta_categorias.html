ductoList.length>1"> <li ng-repeat="producto in item.productoList" ng-class="{'border-left-3px':producto.producto_color}" ng-style="{'border-left-color': producto.producto_color}"> <a ng-click="vm.fnSeleccionarProducto(producto);vm.reiniciarTimerDesdeView();"> <i class="fa fa-plus-circle"></i> {{producto.producto_presentacion}} - {{producto.producto_precio|roundPriceFinanzasFilter}} </a> </li> </ul> </div> </div>
