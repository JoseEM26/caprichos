<div class="ibox ng-scope m-b-none"> <form name="form" class="" ng-submit="vm.fnGuardar()"> <div class="ibox-title"> <h5 class=""><i class="fa fa-sort-amount-desc"></i> Agregar descuento a mesa: {{vm.mesa.mesa_descripcion}}</h5> </div> <div class="ibox-content"> <div class="row p-t-sm" ng-if="!vm.descuentoAutorizado"> <div class="col-xs-4"> <div class="form-group" ng-class="{'has-error': form.mesa_tipodescuento.$invalid}"> <div class="checkbox-inline is-icheck"> <label class="control-label"> Aplicar un descuento </label> <input class="form-control input-sm" icheck type="checkbox" ng-change="vm.fnVerificarDescuento()" ng-model="vm.checkAutorizarDescuento"> </div> </div> </div> <div class="col-xs-6" ng-if="Security.hasAccess('ventas.asignarcortesias')"> <div class="form-group" ng-class="{'has-error': form.mesa_tipodescuento.$invalid}"> <div class="checkbox-inline is-icheck"> <label class="control-label"> Aplicar cortesía a toda la mesa </label> <input class="form-control input-sm" type="checkbox" ng-change="vm.fnValidarCortesiaMesaCompleta()" icheck ng-true-value="'1'" ng-false-value="'0'" ng-model="vm.checkAutorizarCortesia"> </div> </div> </div> </div> <div class="row p-t-sm" ng-if="vm.descuentoAutorizado"> <div class="col-xs-6"> <div class="form-group" ng-class="{'has-error': form.mesa_tipodescuento.$invalid}"> <label class="control-label">Tipo de descuento</label> <select class="form-control" ng-change="vm.fnCalcularDescuentoSegunCategoriadescuento()" ng-model="vm.mesa.mesa_tipodescuento" name="mesa_tipodescuento" id="mesa_tipodescuento" required> <option value="">Seleccionar</option> <option value="1">En moneda {{Utility.getSimboloMoneda()}}</option> <option value="2">En porcentaje</option> </select> <div ng-if="form.mesa_tipodescuento.$invalid" ng-messages="form.mesa_tipodescuento.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> </div> </div> <div class="col-xs-6"> <div class="form-group" ng-class="{'has-error': form.mesa_descuento.$invalid}"> <label class="control-label">Monto</label> <input type="text" autocomplete="off" class="form-control" placeholder="Monto" ng-disabled="vm.mesa.mesa_tipodescuento==2 && vm.aplicarDescuentoVenta" ng-model="vm.mesa.mesa_descuento" solo-numeros name="mesa_descuento" required> <div ng-if="form.mesa_descuento.$invalid" ng-messages="form.mesa_descuento.$error"> <div class="help-block" ng-message="parse">Valor no válido</div> </div> </div> </div> <div class="col-xs-6"> <div class="form-group" ng-class="{'has-error': form.mesa_tipodescuento.$invalid}"> <div class="checkbox-inline is-icheck"> <label class="control-label"> Aplicar una categoria de descuento </label> <input class="form-control input-sm" icheck type="checkbox" ng-change="vm.fnNoAplicarDescuento()" ng-model="vm.aplicarDescuentoVenta"> </div> </div> </div> <div class="col-xs-6"> <select ng-if="vm.listaCategoriasDescuento.length" ng-disabled="!vm.aplicarDescuentoVenta" ng-options="item as item.categoriadescuento_descripcion for item in vm.listaCategoriasDescuento" class="form-control" name="categoriadescuento_id" ng-model="vm.categoriadescuento" ng-change="vm.fnCalcularDescuentoSegunCategoriadescuento()" required> </select> <p class="form-control-static" ng-if="!vm.listaCategoriasDescuento.length">No hay categorias registradas.</p> </div> <div class="col-xs-12"> <div class="form-group m-t-xs"> <label>Motivo Dscto.:</label> <input class="form-control text-bold" ng-model="vm.mesa.mesa_motivodescuento"> </div> </div> </div> </div> <div class="ibox-footer text-right"> <button class="btn btn-default" type="button" ng-click="vm.fnCancelar()">Cancelar</button> <button class="btn btn-primary" type="submit" ladda="vm.loading" ng-disabled="form.$invalid">Guardar</button> </div> </form> </div>
