<div rest-loader-model="vm.loading" ng-class="{'is-loading': vm.loading}"></div> <div class="h-full w-full flex flex-col gap-16 p-16"> <div class="w-full flex justify-between"> <div class="flex flex-col"> <span class="text-16 font-bold" style="color:#878787">Paso 3</span> <span class="text-20 font-bold">Combinaciones</span> </div> <i class="fa fa-close text-22 cursor-pointer" ng-click="vm.cancelar()"></i> </div> <div style="width:100%;border:1px solid #e4e4e4"></div> <div class="w-full"> <div class="w-full flex flex-col gap-12" style="border:1px solid #e8eaec;padding:20px 16px"> <div class="alert alert-info alert-min-padding m-0 text-12"> Ingresa en esta tabla las equivalencias correspondientes para la venta de este combo. </div> <div class="w-full overflow-x-auto"> <table class="table table-bordered table-shadow m-b-none" style="min-width:max-content;max-height:350px"> <thead> <tr style="position:relative"> <th ng-repeat="cateogriacombo in vm.listaCategoriacomboequivalencia" class="text-center" title="cateogriacombo" style="width:208px"> {{ cateogriacombo.categoria_descripcion }} </th> <th class="text-center" style="width:208px;position:sticky;right:0;background:#f5f5f6;z-index:2">Acciones</th> </tr> </thead> <tbody style="max-height:300px;overflow-y:auto"> <tr ng-repeat="fila in vm.filas track by $index"> <td ng-repeat="cateogriacombo in vm.listaCategoriacomboequivalencia"> <input type="number" min="0" placeholder="0" class="form-control" style="background:#fdfaf7;text-align:left" maxlength="12" ng-model="cateogriacombo.listaEquivalencias[$parent.$index].equivalenciacombo_cantidadmaxima" ng-change="vm.activarAgregar(cateogriacombo.listaEquivalencias[$parent.$index],fila)"> </td> <td class="" style="position:sticky;right:0;background:#fff;z-index:1"> <button type="button" class="btn ladda-button w-full" ng-class="'btn-success'" ng-if="fila.nuevo" ng-disabled="fila.disabled" ng-click="vm.agregarFila(fila)"> <i class="fa" ng-class="'fa-plus'"></i> Agregar ({{fila.val
