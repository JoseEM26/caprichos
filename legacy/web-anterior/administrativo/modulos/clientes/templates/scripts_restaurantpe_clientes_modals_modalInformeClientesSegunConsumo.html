<div class="ibox no-margins"> <div class="ibox-title"> <h5> Exportar clientes según último consumo </h5> </div> <div class="ibox-content"> <div class="row"> <div class="col-sm-12"> <label class="control-label" uib-tooltip="Selecciona un local para el filtrado."> Local <i class="icon-help"></i></label> <ui-select ng-model="vm.localSeleccionado" theme="bootstrap" search-enabled="false"> <ui-select-match placeholder="Selecciona un local"> Local: <strong>{{$select.selected.local_descripcion}}</strong> </ui-select-match> <ui-select-choices repeat="local in vm.localList | filter: $select.local_descripcion"> <div ng-bind-html="local.local_descripcion | highlight: $select.local_descripcion"></div> </ui-select-choices> </ui-select> </div> </div> <div class="row p-t-md"> <div class="col-sm-6"> <label class="control-label" uib-tooltip="Selecciona la fecha de inicio del análisis.">Fecha de Inicio de Análisis <i class="icon-help"></i></label> <p class="no-margins"> <button type="button" class="btn btn-default" date-range-picker ng-model="pickerFechaInicioAnalisis.fechas.startDate" options="pickerFechaInicioAnalisis.opciones"> <i class="fa fa-calendar"></i> {{pickerFechaInicioAnalisis.fechas.startDate | amDateFormat: 'DD MMMM, YYYY - HH:mm A'}} </button> </p> </div> <div class="col-sm-6"> <label class="control-label" uib-tooltip="Selecciona la fecha de último consumo del cliente."> Fecha último consumo <i class="icon-help"></i></label> <p class="no-margins"> <button type="button" class="btn btn-default" date-range-picker ng-model="pickerFechaUltimoConsumo.fechas.startDate" options="pickerFechaUltimoConsumo.opciones"> <i class="fa fa-calendar"></i> {{pickerFechaUltimoConsumo.fechas.startDate | amDateFormat: 'DD MMMM, YYYY - HH:mm A'}} </button> </p> </div> </div> <div class="float-e-margins text-right p-t-md"> <button class="btn btn-primary" ng-click="vm.fnExportarClientesPorConsumo()" ladda="vm.btnActualizado">Descargar </button> <button class="btn btn-default" ng-click="vm.cerrarModal()">Cancelar</button> </div> </div> </div>
