<div class="ibox no-margins"> <div class="ibox-title"> <h5> Exportar comparativo entre fechas </h5> </div> <div class="ibox-content"> <div> <div class="row"> <div class="col-sm-12"> <div class="form-group"> <label>Primer bloque</label> <button class="btn btn-default pull-right" date-range-picker ng-model="dateInitial.fechas" options="dateInitial.opciones"> <i class="fa fa-calendar"></i> Del <strong>{{dateInitial.fechas.startDate | amDateFormat: 'DD MMMM, YYYY'}}</strong> hasta <strong>{{dateInitial.fechas.endDate | amDateFormat: 'DD MMMM,YYYY'}}</strong> </button> </div> </div> <div class="col-sm-12"> <div class="form-group"> <label>Segundo bloque</label> <button class="btn btn-default pull-right" date-range-picker ng-model="dateEnd.fechas" options="dateEnd.opciones"> <i class="fa fa-calendar"></i> Del <strong>{{dateEnd.fechas.startDate | amDateFormat: 'DD MMMM, YYYY'}}</strong> hasta <strong>{{dateEnd.fechas.endDate | amDateFormat: 'DD MMMM,YYYY'}}</strong> </button> </div> </div> </div> <div class="float-e-margins"> <button type="none" ladda="vm.btnCargandoTodos" data-style="expand-left" ng-click="vm.fnDownloadReport()" class="btn btn-primary"> <i class="fa fa-download"></i> Descargar </button> <button type="none" ng-click="vm.cerrarModal()" class="btn btn-default"> Cancelar </button> </div> </div> </div> </div>
