<div class="ibox no-margins"> <div class="ibox-title"> <h4>Venta detallada por salón</h4> </div> <div class="ibox-content"> <div class="form-group"> <label class="control-label">Local *</label> <ui-select ng-model="vm.localSeleccionado" theme="bootstrap" on-select="vm.fnCargarSalones()"> <ui-select-match placeholder="Selecciona un local"> {{$select.selected.local_descripcion}} </ui-select-match> <ui-select-choices repeat="local in vm.localList | filter: {local_descripcion: $select.search}"> <div ng-bind-html="local.local_descripcion | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> <div class="form-group"> <label class="control-label block">Fecha *</label> <button type="button" class="btn btn-default" date-range-picker ng-model="rangoDeFechas.fechas" options="rangoDeFechas.opciones"> <i class="fa fa-calendar"></i> Del <strong>{{rangoDeFechas.fechas.startDate | amDateFormat: 'DD/MM/YYYY h:mm A'}}</strong> al <strong>{{rangoDeFechas.fechas.endDate | amDateFormat: 'DD/MM/YYYY h:mm A'}}</strong> </button> <p class="help-block m-b-none">Máx. 33 días en Excel · 7 días en PDF</p> </div> <div class="form-group"> <label class="control-label block">Salones <i class="fa fa-spinner fa-spin" ng-if="vm.cargandoSalones"></i></label> <div ng-dropdown-multiselect="" options="vm.salonList" selected-model="vm.salonesSeleccionados" extra-settings="vm.settingMultiSelectSalon" translation-texts="vm.textosMultiselectSalon" events="vm.multiselectEventsSalon"></div> </div> <div class="form-group"> <label class="control-label block">Mesas <small class="text-muted">(según los salones elegidos)</small></label> <div ng-dropdown-multiselect="" options="vm.mesaList" selected-model="vm.mesasSeleccionadas" extra-settings="vm.settingMultiSelectMesa" translation-texts="vm.textosMultiselectMesa"></div> </div> <div class="form-group"> <label class="control-label block">Estado de la venta</label> <ui-select ng-model="vm.estadoSeleccionado" theme="bootstrap" search-enabled="false"> <ui-select-match placeholder="Selecciona un estado"> Estado: <strong>{{$select.selected.descripcion}}</strong> </ui-select-match> <ui-select-choices repeat="estado in vm.estadoList"> <div>{{estado.descripcion}}</div> </ui-select-choices> </ui-select> <p class="help-block m-b-none" ng-if="vm.fnMostrarNotaEnCurso()"> <i class="fa fa-info-circle"></i> Las ventas en curso muestran las mesas abiertas en este momento. </p> </div> <div class="text-right p-t-md"> <button type="button" class="btn btn-default" ng-click="vm.cerrarModal()">Cancelar</button> <button type="button" class="btn btn-primary" ng-click="vm.fnDescargar('xlsx')"> <i class="fa fa-fw fa-file-excel-o"></i> Excel </button> <button type="button" class="btn btn-danger" ng-click="vm.fnDescargar('pdf')"> <i class="fa fa-fw fa-file-pdf-o"></i> PDF </button> </div> </div> </div>
