<div class="ibox"> <div class="ibox-title"> <h5 ng-if="vm.turno.turno_descripcion"><i class="fa fa-edit"></i> <strong>Turno:</strong> {{vm.turno.turno_descripcion}}</h5> <h5 ng-if="!vm.turno.turno_descripcion"><i class="fa fa-plus-circle"></i> Agregar turno</h5> </div> <div class="ibox-content"> <ng-form name="form"> <div class="form-group" ng-class="{'has-error': !vm.turno.turno_descripcion && form.$dirty}"> <label class="control-label" for="turno_descripcion">Nombre</label> <input colocar-focus capitalize class="form-control" name="turno_descripcion" id="turno_descripcion" ng-minlength="3" ng-model="vm.turno.turno_descripcion" required uniquenombrecaja> <div ng-if="form.turno_descripcion.$dirty" ng-messages="form.turno_descripcion.$error"> <div class="help-block" ng-message="required">Campo requerido</div> <div class="help-block" ng-message="minlength">Nombre muy corto (minimo 3 letras)</div> <div class="help-block" ng-message="uniqueNombrecaja">Se econtraron coincidencias</div> </div> </div> <div class="form-group" ng-class="{'has-error': !vm.turno_hora_inicio && form.$dirty}"> <label class="control-label" for="turno_hora_inicio">Hora de inicio</label> <div class="input-group clockpicker"> <input class="form-control" type="text" required name="turno_hora_inicio" id="turno_hora_inicio" ng-model="vm.turno_hora_inicio" data-lng-clockpicker readonly lng-clockpicker-options="clockpickerInicio"> <div ng-if="form.turno_hora_inicio.$dirty" ng-messages="form.turno_hora_inicio.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> <span class="input-group-addon"> <span class="fa fa-clock-o"></span> </span> </div> </div> <div class="form-group" ng-class="{'has-error': !vm.turno_hora_fin && form.$dirty}"> <label class="control-label" for="turno_hora_fin">Hora de fin</label> <div class="input-group clockpicker"> <input class="form-control" type="text" required name="turno_hora_fin" id="turno_hora_fin" ng-model="vm.turno_hora_fin" lng-clockpicker readonly lng-clockpicker-options="clockpickerFin"> <div ng-if="form.turno_hora_fin.$dirty" ng-messages="form.turno_hora_fin.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> <span class="input-group-addon"> <span class="fa fa-clock-o"></span> </span> </div> </div> <div class="form-group"> <label>Estado</label> <div class="checkbox is-icheck"> <label> <input type="checkbox" id="turno_estado" icheck ng-model="vm.turno.turno_estado" ng-true-value="'1'" ng-false-value="'0'"> Turno activo </label> </div> </div> <div class="float-e-margins"> <button ladda="btnCargandoGuardar" ng-disabled="form.$invalid" class="btn btn-primary" ng-if="$state.is('ajustes.turnos.nuevo')" id="btnRegistrar" ng-click="vm.fnAgregar()"><i class="fa fa-save"></i> Guardar</button> <button ladda="btnCargandoModificar" ng-disabled="form.$invalid" class="btn btn-success" ng-if="$state.is('ajustes.turnos.editar')" id="btnModificar" ng-click="vm.fnActualizar()"><i class="fa fa-save"></i> Modificar</button> <button class="btn btn-default" ng-click="$state.go('ajustes.turnos')">Cancelar</button> </div> </ng-form> </div> </div>
