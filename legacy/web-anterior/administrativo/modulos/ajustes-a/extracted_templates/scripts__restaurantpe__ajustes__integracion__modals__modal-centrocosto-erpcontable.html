<div class="modal-header"> <button type="button" class="close" ng-click="vm.cancelar()"><span>&times;</span></button> <h4 class="modal-title"><i class="fa fa-plus"></i> Nuevo centro de costo</h4> </div> <div class="modal-body"> <form name="formCentroCosto" novalidate> <div class="row"> <div class="col-sm-4"> <div class="form-group" ng-class="{'has-error': formCentroCosto.cencos.$invalid && formCentroCosto.$submitted}"> <label class="control-label">Código <span class="text-danger">*</span></label> <input class="form-control" name="cencos" ng-model="vm.centro.cencos" required maxlength="30" placeholder="Ej. CC001"> </div> </div> <div class="col-sm-8"> <div class="form-group" ng-class="{'has-error': formCentroCosto.descCencos.$invalid && formCentroCosto.$submitted}"> <label class="control-label">Descripción <span class="text-danger">*</span></label> <input class="form-control" name="descCencos" ng-model="vm.centro.descCencos" required maxlength="200" placeholder="Ej. Administración"> </div> </div> </div> <div class="row"> <div class="col-sm-8"> <div class="form-group" ng-class="{'has-error': formCentroCosto.clasificacion.$invalid && formCentroCosto.$submitted}"> <label class="control-label">Clasificación <span class="text-danger">*</span></label> <input class="form-control" name="clasificacion" ng-model="vm.centro.clasificacion" required maxlength="60" placeholder="Ej. Operativo"> </div> </div> <div class="col-sm-4"> <div class="form-group" ng-class="{'has-error': formCentroCosto.factor.$invalid && formCentroCosto.$submitted}"> <label class="control-label">Factor (%) <span class="text-danger">*</span></label> <input class="form-control" type="number" min="0" max="100" name="factor" ng-model="vm.centro.factor" required placeholder="0 - 100"> </div> </div> </div> </form> </div> <div class="modal-footer"> <button type="button" class="btn btn-default" ng-click="vm.cancelar()">Cancelar</button> <button type="button" ladda="vm.guardando" class="btn btn-primary" ng-click="vm.guardar(formCentroCosto)"> <i class="fa fa-check"></i> Crear </button> </div>
