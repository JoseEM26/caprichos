<div class="ibox"> <div class="ibox-title"> <h5 ng-if="$state.is('ajustes.formasdepago.nuevo')"><i class="fa fa-plus-circle"></i> Agregar Forma de Pago</h5> <h5 ng-if="$state.is('ajustes.formasdepago.editar')"><i class="fa fa-pencil"></i> Editar Forma de Pago</h5> </div> <div class="ibox-content"> <ng-form name="form"> <div class="row"> <div class="col-sm-6"> <div class="form-group" ng-class="{'has-error': !vm.formaPago.formadepago_descripcion && form.$dirty}"> <label for="formadepago_descripcion" class="control-label">Descripción de la forma de pago</label> <input class="form-control" required id="formadepago_descripcion" name="formadepago_descripcion" ng-model="vm.formaPago.formadepago_descripcion"> <div ng-if="form.formadepago_descripcion.$dirty" ng-messages="form.formadepago_descripcion.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> </div> </div> <div class="col-sm-6" ng-if="vm.formaPago.formadepago_id > 0"> <div class="form-group"> <label class="control-label">Estado</label> <div class="checkbox is-icheck"> <label> <input type="checkbox" icheck ng-model="vm.formaPago.formadepago_estado" ng-true-value="'1'" ng-false-value="'0'"> Forma de pago activa </label> </div> </div> </div> </div> <div class="float-e-margins"> <button ladda="btnCargandoGuardar" ng-disabled="form.$invalid" class="btn btn-primary" ng-if="$state.is('ajustes.formasdepago.nuevo')" id="btnRegistrar" ng-click="vm.fnAgregar()"><i class="fa fa-save"></i> Guardar </button> <button ladda="btnCargandoModificar" ng-disabled="form.$invalid" class="btn btn-success" ng-if="$state.is('ajustes.formasdepago.editar')" id="btnModificar" ng-click="vm.fnActualizar()"><i class="fa fa-save"></i> Modificar </button> <button class="btn btn-default" ng-click="$state.go('ajustes.formasdepago')">Cancelar</button> </div> </ng-form> </div> </div>
