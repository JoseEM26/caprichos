ccion" ng-model="vm.transportista.transportista_direccion" required> <div ng-if="form.transportista_direccion.$dirty" ng-messages="form.transportista_direccion.$error"> <div class="help-block" ng-message="required">Campo requerido</div> </div> </div> </div> <div class="col-sm-6"> <div class="form-group"> <label for="transportista_placa" class="control-label">Placa del vehiculo:</label> <input class="form-control" type="text" id="transportista_placa" name="transportista_placa" ng-model="vm.transportista.transportista_placa"> </div> </div> <div class="col-sm-6"> <div class="form-group"> <label for="transportista_marca" class="control-label">Marca del vehiculo:</label> <input class="form-control" type="text" id="transportista_marca" name="transportista_marca" ng-model="vm.transportista.transportista_marca"> </div> </div> <div class="col-sm-6"> <div class="form-group"> <label for="transportista_certificado" class="control-label">Certificado:</label> <input class="form-control" type="text" id="transportista_certificado" name="transportista_certificado" ng-model="vm.transportista.transportista_certificado"> </div> </div> <div class="col-sm-6"> <div class="form-group"> <label for="transportista_licencia" class="control-label">Licencia:</label> <input class="form-control" type="text" id="transportista_licencia" name="transportista_licencia" ng-model="vm.transportista.transportista_licencia"> </div> </div> <div class="col-sm-6"> <div class="form-group"> <label for="transportista_telefono" class="control-label">Teléfono:</label> <input class="form-control" type="text" id="transportista_telefono" name="transportista_telefono" ng-model="vm.transportista.transportista_telefono"> </div> <div class="form-group"> <label>Estado</label> <div class="checkbox is-icheck"> <label> <input type="checkbox" id="transportista_estadol" icheck ng-model="vm.transportista.transportista_estadol" ng-true-value="'1'" ng-false-value="'0'"> Transportista activo </label> </div> </div> </div> </div> <di
