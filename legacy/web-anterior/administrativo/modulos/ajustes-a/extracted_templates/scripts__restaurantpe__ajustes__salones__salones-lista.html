 <div> <div id="salones" class="ibox"> <div class="ibox-title"> <h5>Salones</h5> </div> <div class="ibox-content"> <button class="btn btn-primary m-b-md" ng-click="vm.fnNuevaSalon();$state.go('ajustes.salones.nuevo')"> <i class="fa fa-plus-circle"></i> Nuevo Salón </button> <div class="row"> <div class="col-sm-7"> <div class="input-group m-b" ng-class="{'has-warning': vm.valBusqueda}"> <div class="input-group-addon"> <i class="fa fa-search"></i> </div> <input type="text" autocomplete="off" class="form-control" placeholder="Buscar..." ng-model="vm.valBusqueda"> </div> </div> <div class="col-sm-3"> <ui-select ng-model="vm.paginacionSeleccionada" ng-change="vm.fnCargarSalons()" theme="bootstrap" search-enabled="false"> <ui-select-match placeholder="Paginación"> <span ng-if="$select.selected.paginacion_valor != 'Todos'"> Por: <strong>{{$select.selected.paginacion_valor}}</strong> registros </span> <span ng-if="$select.selected.paginacion_valor == 'Todos'"> Por: <strong>{{$select.selected.paginacion_valor}}</strong> los registros </span> </ui-select-match> <ui-select-choices repeat="item in vm.cantidadesPorPagina | filter: $select.search"> <div ng-if="item.paginacion_valor != 'Todos'" ng-bind-html="item.paginacion_valor + ' registros' | highlight: $select.search"></div> <div ng-if="item.paginacion_valor == 'Todos'" ng-bind-html="item.paginacion_valor + ' los registros' | highlight: $select.search"></div> </ui-select-choices> </ui-select> </div> <div class="col-sm-2" uib-tooltip="Volver a cargar los datos"> <button class="btn btn-default btn-icon btn-block" ng-click="vm.fnCargarSalons()"><i class="fa fa-refresh"></i></button> </div> </div> <div rest-loader-model="cargando" ng-class="{'is-loading': cargando}"></div> <div class="table-responsive restloader-remote-el" ng-class="{'is-loading': cargando}"> <table class="table table-condensed table-hover table-text-13 table-middle table-hover table-clickable m-b-none"> <thead> <tr> <th>Nombre</th> <th>Mesas</th> <th>Estado</th> <th class="text-right">Acciones</th> </tr> </thead> <tbody> <tr ng-repeat="salon in vm.salonList | filter:vm.valBusqueda" ng-class="{'disabled': !salon.estaActivo(), 'active': salon.salon_id == $state.params.idSalon}" ng-click="vm.fnVer(salon.salon_id)"> <td>{{salon.salon_descripcion}}</td> <td>{{salon.salon_cantidadmesas}}</td> <td> <span ng-if="salon.salon_estado=='1'" class="label label-primary">Activo</span> <span ng-if="salon.salon_estado=='0'" class="label label-danger">Inactivo</span> </td> <td class="text-right"> <button class="btn btn-info btn-xs" ng-click="vm.fnVer(salon.salon_id)"> Ver </button> <button class="btn btn-success btn-xs" ng-click="vm.fnObtenerPorId(salon.salon_id);$state.go('ajustes.salones.editar', {idSalon: salon.salon_id});$event.stopPropagation();"> <i class="fa fa-edit"></i> Editar </button> </td> </tr> <tr ng-hide="(vm.salonList|filter:vm.valBusqueda).length != 0"> <td colspan="3"> <em> <span>No hay resultados</span> <span ng-if="vm.valBusqueda">para <strong>{{vm.valBusqueda}}</strong></span> </em> </td> </tr> </tbody> </table> </div> <nav class="b-t-gray-l1 text-right"> <uib-pagination class="m-sm m-b-xs" ng-model="vm.paginaActual" total-items="vm.totalRegistros" items-per-page="vm.paginacionSeleccionada.paginacion_id" previous-text="Anterior" next-text="Siguiente" first-text="Primera" last-text="Último" max-size="8" ng-change="vm.fnCargarSalons()"> </uib-pagination> </nav> </div> </div> </div>
